<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case &amp; MSE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Case & MSE">
<meta name="theme-color" content="#365F91">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#1B2A3A; --ink-2:#4A5A6B; --ink-3:#7A8898;
  --blue:#365F91; --blue-deep:#243F60; --wash:#EAF2F8; --wash-2:#D9EAF7;
  --line:#CFDAE5; --paper:#FFFFFF; --page:#F3F6F9;
  --risk:#9E3A38; --risk-wash:#F8ECEB;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rail:292px; --bar:60px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#E6EDF4; --ink-2:#B3C0CD; --ink-3:#8494A5;
  --blue:#8DB4E2; --blue-deep:#B9D3F0; --wash:#1D2B3A; --wash-2:#243649;
  --line:#33465A; --paper:#141D27; --page:#0E151D;
  --risk:#E39A97; --risk-wash:#3A2224;
}}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--page);color:var(--ink);font:17px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
textarea{resize:none;min-height:88px;overflow:hidden;line-height:1.45}
textarea.big{min-height:180px}

/* ----- top bar ----- */
.bar{position:sticky;top:0;z-index:20;height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar h1{font:600 19px/1.2 var(--serif);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .status{font-size:13px;color:var(--ink-3);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;min-height:44px;font-size:16px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.primary{color:#0E151D} }
.btn.quiet{border-color:transparent;background:transparent;color:var(--blue)}
.btn.danger{color:var(--risk)}
.only-narrow{display:none}

/* ----- case list ----- */
.home{max-width:760px;margin:0 auto;padding:28px 20px 60px}
.home h2{font:600 30px/1.2 var(--serif);margin:8px 0 6px}
.home .lede{color:var(--ink-2);margin:0 0 22px;max-width:60ch}
.cases{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cases li{border-bottom:1px solid var(--line)}
.cases button.open{display:flex;width:100%;text-align:left;gap:16px;align-items:center;padding:16px 4px;background:none;border:0}
.cases .who{flex:1;min-width:0}
.cases .who strong{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cases .who span{font-size:14px;color:var(--ink-3)}
.meter{width:120px;flex:none;font-size:13px;color:var(--ink-3);text-align:right}
.meter i{display:block;height:6px;border-radius:3px;background:var(--wash-2);margin-top:5px;overflow:hidden}
.meter i b{display:block;height:100%;background:var(--blue)}
.empty{padding:36px 4px;color:var(--ink-2)}
.privacy{margin-top:34px;padding:16px 18px;border-left:3px solid var(--blue);background:var(--wash);border-radius:0 8px 8px 0;font-size:15px;color:var(--ink-2)}
.privacy strong{color:var(--ink)}
.home .foot{margin-top:18px;display:flex;justify-content:flex-end}
.bar h1 small{display:block;font:500 12.5px/1.2 var(--sans);color:var(--ink-3);margin-top:2px}
.cases .who .kind{display:block;font-size:13px;font-weight:600;color:var(--blue);margin-bottom:1px}
.cases .who .kind.pn{color:#2F7A6B}
.cases .who .kind.dc{color:#7A4E7E}
.cases .who .kind.mc{color:#8A5A12}
.cases .who .kind.ca{color:#4E5A96}
.cases .who .kind.ho{color:#9E3A38}
.cases .who .kind.sp{color:#2F7A6B}
.refs{background:var(--wash);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin:0 0 22px;font-size:15px;color:var(--ink-2)}
.refs p{margin:4px 0}
.refs .refs-h{font-size:13px;font-weight:600;color:var(--ink-3);margin-top:0}
.lines{display:grid;gap:8px}
.ln{display:flex;align-items:center;gap:10px}
.ln span{width:22px;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cert.splan{font-size:15.5px}
.splan .sp-inst{text-align:center;color:#6B7785;font-size:13px;margin:0 0 4px}
.splan h3{color:#365F91;font-size:28px;margin:6px 0 8px;letter-spacing:0}
.splan .sp-who{text-align:center;margin:0 0 4px}
.splan .sp-review{text-align:center;color:#6B7785;font-size:14px;margin:0}
.splan h4.bar{background:#D9EAF7;color:#1B2A3A;padding:6px 10px;margin:22px 0 4px;font-size:16.5px}
.splan h4.bar span{color:#365F91;margin-right:8px}
.splan .sub{font-style:italic;color:#6B7785;font-size:14px;margin:0 0 4px}
.splan ol.ruled{margin:0;padding-left:26px}
.splan ol.ruled li{border-bottom:1px solid #B7C9DB;padding:8px 0 3px;color:#1B2A3A}
.splan ol.ruled li::marker{color:#365F91;font-weight:700}
.splan ol.ruled.plain{list-style:none;padding-left:0}
.splan .urgent{border-top:2px solid #9E3A38;border-bottom:2px solid #9E3A38;color:#9E3A38;font-weight:700;text-align:center;padding:10px 6px;margin:26px 0 10px}
.splan .sig .lbl2{color:#6B7785;font-size:13px}
.splan .sp-foot{color:#8A96A3;font-size:12px;text-align:center;margin:24px 0 0}
.fit{font-size:14.5px;font-weight:600;color:#2F7A6B;margin:0 0 14px}
.fit.over{color:var(--risk)}
.ptcards{display:grid;gap:16px}
.ptcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ptcard-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ptcard-head strong{font-size:17.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptcard-head span{font-size:14px;color:var(--ink-3)}
.ptgrid{display:grid;grid-template-columns:2fr 1fr 1fr 0.8fr 1.4fr;gap:8px 10px;margin-bottom:10px}
.ptgrid label,.ptareas label{font-size:13.5px;color:var(--ink-2);display:block}
.ptgrid input{margin-top:3px;padding:8px 10px}
.ptareas{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.ptareas small{display:block;font-size:12.5px;color:var(--ink-3)}
.ptareas textarea{margin-top:3px;min-height:56px;padding:8px 10px}
.ptareas label.on textarea{background:var(--wash)}
.pick.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;cursor:pointer}
.pick.checks input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--blue);-webkit-appearance:auto;appearance:auto}
.pick.checks label > span strong{display:block;font-size:16.5px}
.pick.checks label > span span{font-size:14px;color:var(--ink-3)}
.pick.morning{max-height:none}
.hoprev-wrap{overflow-x:auto;margin-bottom:24px}
.hoprev{background:#fff;color:#1B2A3A;border:1px solid var(--line);border-radius:6px;padding:22px 24px;min-width:860px;font:11.5px/1.3 Calibri,Carlito,var(--sans);box-shadow:0 2px 14px rgba(20,40,60,.08)}
.hoprev h3{font-size:16px;color:#365F91;margin:0 0 2px}
.hoprev .who{color:#6B7785;margin:0 0 8px}
.hoprev table{border-collapse:collapse;width:100%;table-layout:fixed}
.hoprev th{background:#D9EAF7;text-align:left;padding:4px 5px;border:1px solid #B7C9DB;vertical-align:bottom}
.hoprev td{border:1px solid #B7C9DB;padding:4px 5px;vertical-align:top;height:58px;word-wrap:break-word}
.hoprev td.pt{background:#EAF2F8}
.starts-label{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);margin:18px 0 -6px}
.starts + .starts-label{margin-top:0}
.warn-box{background:var(--risk-wash);border-left:3px solid var(--risk);padding:10px 12px;border-radius:0 8px 8px 0;color:var(--ink)!important}
.cert table.info{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:14.5px}
.cert table.info th,.cert table.info td{border:1px solid #B7C9DB;padding:6px 10px;text-align:left;vertical-align:top}
.cert table.info th{background:#EAF2F8;width:30%;font-weight:700}
.cert table.meds th{background:#D9EAF7;width:auto}
.cert .tblwrap{overflow-x:auto}
.cert h4{color:#365F91;font-size:16.5px;margin:22px 0 6px}
.cert .lbl{font-weight:700;margin:10px 0 2px}
.cert .txt{margin:0 0 8px;text-align:justify}
.cert{background:#fff;color:#1B2A3A;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(20,40,60,.08);padding:40px 48px;margin:0 0 28px;font:15.5px/1.6 Calibri,Carlito,var(--sans)}
.cert header{text-align:center;border-bottom:2px solid #365F91;padding-bottom:10px}
.cert header .h0{font-weight:700;font-size:19px}
.cert header .h2{font-size:13px;color:#6B7785}
.cert h3{text-align:center;font:700 22px/1.2 Calibri,Carlito,var(--sans);letter-spacing:.04em;margin:30px 0 22px}
.cert .date{text-align:right}
.cert .body{text-align:justify;line-height:1.8}
.cert .dx{margin-left:44px;font-weight:700}
.cert .dx.normal{font-weight:400}
.cert em{color:#9E3A38;font-style:normal;font-weight:600}
.cert .sigs{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px}
.cert .sig{text-align:center;display:flex;flex-direction:column;font-size:14.5px}
.cert .sig .line{border-top:1px solid #1B2A3A;margin-bottom:4px}
.cert .warn{color:#9E3A38;font-weight:600;margin-top:16px}
.starts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 26px}
.starts button{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:84px}
.starts button strong{display:block;font-size:17px;color:var(--blue-deep)}
.starts button span{display:block;font-size:14px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.starts #new{background:var(--blue);border-color:var(--blue)}
.starts #new strong,.starts #new span{color:#fff}
.sheet p.small{font-size:14px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cases .who .kind.pn{color:#7FCBB9} :root:not([data-theme="light"]) .cases .who .kind.dc{color:#D2A6D6} :root:not([data-theme="light"]) .starts #new strong,:root:not([data-theme="light"]) .starts #new span{color:#0E151D} }
.pick{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid var(--line);max-height:44vh;overflow:auto}
.pick li{border-bottom:1px solid var(--line)}
.pick button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 4px;min-height:44px}
.pick button strong{display:block;font-size:16.5px}
.pick button span{font-size:14px;color:var(--ink-3)}
.carry{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 24px;font-size:15px;color:var(--ink-2)}
.carry strong{color:var(--ink)}
.carry .btn{flex:none}
.source{font-size:14px;color:var(--ink-3);margin:-8px 0 20px}
.credit{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-3);line-height:1.5}
.credit p{margin:0}
.credit a{color:var(--blue)}
.sheet p{margin:0 0 12px;color:var(--ink-2)}
.sheet p strong{color:var(--ink)}
.sheet .field{margin-bottom:18px}
.sheet .warn-box{margin:8px 0 0;font-size:14px}
.sheet.wide{max-width:640px}

/* ----- case layout ----- */
.layout{display:grid;grid-template-columns:var(--rail) 1fr;min-height:calc(100% - var(--bar))}
.rail{position:sticky;top:var(--bar);height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:var(--page);padding:10px 0 40px;-webkit-overflow-scrolling:touch}
.rail .grp{font:600 13px/1.3 var(--sans);color:var(--ink-3);padding:14px 18px 4px 18px}
.rail button{display:grid;grid-template-columns:40px 1fr 14px;align-items:center;gap:4px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 14px 9px 15px;font-size:15px;line-height:1.3;color:var(--ink-2)}
.rail button .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:14px}
.rail button.sub{padding-left:27px}
.rail button.cur{background:var(--paper);border-left-color:var(--blue);color:var(--ink);font-weight:600}
.rail button.risk.cur{border-left-color:var(--risk)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--blue);border-color:var(--blue)}
.risk .dot.on{background:var(--risk);border-color:var(--risk)}
.main{padding:26px 34px 80px;max-width:900px;width:100%}
.sec-head{margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--blue)}
.sec-head.risk{border-bottom-color:var(--risk)}
.sec-head .kicker{font-size:14px;color:var(--ink-3);margin:0 0 2px}
.sec-head h2{font:600 28px/1.2 var(--serif);margin:0;color:var(--blue-deep)}
.sec-head.risk h2{color:var(--risk)}
.sec-head p.note{margin:8px 0 0;color:var(--ink-2);font-style:italic}

.field{margin:0 0 24px}
.field > .lab{display:block;font-weight:600;font-size:16px;margin:0 0 3px}
.field > .hint{display:block;font-size:14px;color:var(--ink-3);margin:0 0 8px}
.field > .lab + input,.field > .lab + textarea,.field > .lab + .chips,.field > .lab + .seg,.field > .lab + .grid{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;min-height:44px;font-size:15.5px;line-height:1.2;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.risky .chip[aria-pressed="true"]{background:var(--risk);border-color:var(--risk)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E151D} }
.score{font-size:14px;color:var(--ink-2);margin-top:8px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:10px 18px;min-height:44px;font-size:15.5px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.risky .seg button[aria-pressed="true"]{background:var(--risk)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E151D} }
.detail{margin-top:10px}
.radios{display:grid;gap:10px}
.radios .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.radios .row > span{width:120px;font-size:15px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.grid.inline{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.grid.long{grid-template-columns:1fr}
.grid label{display:block;font-size:14px;color:var(--ink-2)}
.grid label input,.grid label textarea{margin-top:4px}
.grid textarea{min-height:64px}
.tbl{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--paper)}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;table-layout:fixed}
.tbl th{background:var(--wash-2);font-size:13.5px;font-weight:600;text-align:left;padding:8px 10px;color:var(--ink-2);vertical-align:bottom}
.tbl td{border-top:1px solid var(--line);padding:0;vertical-align:top}
.tbl td + td,.tbl th + th{border-left:1px solid var(--line)}
.tbl textarea{border:0;border-radius:0;min-height:48px;padding:10px;font-size:16px;background:transparent}
.tbl textarea:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.tbl-actions{display:flex;gap:6px;margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.pager .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis}

/* ----- sheet + toast ----- */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.38);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--paper);border-radius:14px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:22px 24px}
.sheet h3{font:600 22px/1.2 var(--serif);margin:0 0 12px}
.sheet ul{margin:0 0 16px;padding-left:20px}
.sheet li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;z-index:50;font-size:15px;max-width:90vw}

/* ----- narrower iPads / portrait ----- */
@media (max-width:980px){
  .ptgrid{grid-template-columns:1fr 1fr}
  .ptareas{grid-template-columns:1fr}
  .starts{grid-template-columns:1fr 1fr}
  .cert{padding:28px 24px}
  .carry{flex-direction:column;align-items:flex-start}
  .layout{grid-template-columns:1fr}
  .rail{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px));left:0;bottom:0;height:auto;width:min(330px,86vw);z-index:30;transform:translateX(-105%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
  .rail.open{transform:none;visibility:visible;transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.18)}
  .only-narrow{display:inline-block}
  .main{padding:22px 20px 80px}
  .bar .status{display:none}
}
@media (max-width:640px){ .starts{grid-template-columns:1fr} }
@media (max-width:600px){ .bar .hide-sm{display:none} .meter{width:80px} .bar h1{font-size:17px} }
@media (prefers-reduced-motion:reduce){ .rail{transition:none} }

</style>
</head>
<body>
<noscript>This app needs JavaScript turned on in Safari.</noscript>
<script src="slides.js"></script>
<script>
/* ---------- Template structure (mirrors the Integrated Psychiatry Resident Case + MSE Template) ---------- */
const SECTIONS = [
  { id:'enc', num:'A', title:'Patient & encounter information', fields:[
    {t:'text', id:'patient', label:'Patient / MRN'},
    {t:'text', id:'datetime', label:'Date / time'},
    {t:'text', id:'agesex', label:'Age / sex'},
    {t:'text', id:'location', label:'Location / unit'},
    {t:'text', id:'interviewer', label:'Interviewer'},
    {t:'text', id:'attending', label:'Attending'}
  ]},
  { id:'idd', num:'1', title:'Identifying data & source of information', fields:[
    {t:'text', id:'marital', label:'Marital status'},
    {t:'text', id:'occupation', label:'Occupation'},
    {t:'text', id:'referred', label:'Referred by'},
    {t:'text', id:'livingwith', label:'Living with'},
    {t:'text', id:'informant', label:'Informant'},
    {t:'radio', id:'reliability', label:'Reliability', o:['Poor','Fair','Good'], detail:'Details'},
    {t:'area', id:'idsummary', label:'Identifying summary', hint:'Age, sex, marital status, occupation, how patient came to be seen, source and reliability.'}
  ]},
  { id:'cc', num:'2', title:'Chief complaint', fields:[
    {t:'area', id:'cc', label:'Chief complaint', hint:"Patient's own words whenever possible.", quote:true}
  ]},
  { id:'hpi', num:'3', title:'History of present illness', fields:[
    {t:'area', id:'hpi', label:'HPI narrative', hint:'Chronological: onset, course, severity, precipitants/stressors, associated symptoms, functional change, why seeking help now.', big:true},
    {t:'parts', id:'assoc', label:'Associated changes', p:['Sleep','Mood','Interests','Relationships','Functioning']},
    {t:'area', id:'timeline', label:'Timeline / key events'}

/* ---------- Helpers shared by the app and the Word export ---------- */
const str = v => (typeof v === 'string' ? v.trim() : '');
function isFilled(f, d){
  const v = d[f.id];
  switch(f.t){
    case 'text': case 'area': return !!str(v);
    case 'checks': return Array.isArray(v) && v.length>0;
    case 'radio': return !!v || !!str(d[f.id+'__d']);
    case 'radios': case 'parts': return !!v && Object.values(v).some(x=>str(x));
    case 'table': return Array.isArray(v) && v.some(r=>r.some(c=>str(c)));
    case 'patients': return Array.isArray(v) && v.length>0;
    case 'lines': return Array.isArray(v) && v.some(x=>str(x));
  }
  return false;
}
const sectionStarted = (s,d) => s.fields.some(f=>isFilled(f,d));
function lc(s){ return /^[A-Z][a-z]/.test(s) ? s[0].toLowerCase()+s.slice(1) : s; }
function quoted(s){ s=str(s); if(!s) return s; return /^["“]/.test(s) ? s : '“'+s+'”'; }
function endDot(s){ s=str(s); return s && !/[.!?”"]$/.test(s) ? s+'.' : s; }

/* Builds the one-paragraph MSE from sections 11A–11F */
function draftMSE(d){
  const j = a => (a||[]).map(lc).join(', ');
  const key = k => /^[A-Z]{2}/.test(k) ? k : lc(k.replace(/\s*\(\/3\)/,''));
  const parts = (id) => { const o=d[id]||{}; return Object.entries(o).filter(([k,v])=>str(v)).map(([k,v])=>key(k)+' '+str(v)).join(', '); };
  const segs = [];
  const add = (label, bits) => { const t = bits.filter(Boolean).map(str).filter(Boolean).map(lc).join('; '); if(t) segs.push(label+': '+t.replace(/\.$/,'')+'.'); };
  add('Appearance/behavior', [j(d.appChecks), d.appNarr]);
  add('Speech/thought process', [j(d.speechChecks), d.speechNarr, d.thoughtNarr, d.tpNeg]);
  const si = d.si||{}, hi = d.hi||{};
  const siT = Object.keys(si).length ? Object.entries(si).map(([k,v])=>key(k)+' '+lc(v)).join(', ') : '';
  const hiT = Object.keys(hi).length ? Object.entries(hi).map(([k,v])=>key(k)+' '+lc(v)).join(', ') : '';
  const nssiT = d.nssi ? 'NSSI '+lc(d.nssi)+(str(d.nssi__d)?' ('+str(d.nssi__d)+')':'') : '';
  add('Thought content', [j(d.tcChecks), d.delusions, siT, hiT, nssiT]);
  add('Perception', [j(d.percChecks), d.percNarr]);
  const moodT = str(d.mood) ? 'mood '+quoted(d.mood) : '';
  const affT = (d.affectChecks||[]).length ? 'affect '+j(d.affectChecks) : '';
  const cong = d.congruence ? lc(d.congruence)+(str(d.congruence__d)?' ('+str(d.congruence__d)+')':'') : '';
  add('Mood/affect', [moodT, affT, d.affectNarr, cong]);
  const ins = d.insight ? 'insight '+lc(d.insight)+(str(d.insight__d)?' ('+str(d.insight__d)+')':'') : '';
  const jud = d.judgment ? 'judgment '+lc(d.judgment)+(str(d.judgment__d)?' ('+str(d.judgment__d)+')':'') : '';
  const orient = parts('orient'), mem = parts('memory'), att = parts('attention'), ex = parts('exec');
  add('Sensorium/cognition/insight/judgment', [j(d.cogChecks), orient&&'orientation: '+orient, att&&'attention: '+att, mem&&'memory: '+mem, ex&&ex, d.testResults, ins, jud]);
  return segs.join(' ');
}
if (typeof module !== 'undefined') module.exports = { SECTIONS, REMINDERS, isFilled, sectionStarted, draftMSE, str, lc, quoted, endDot };

/* Loose date reader for "Sep 30, 2026", "30 Sep 2026", or "2026-09-30" */
function parseLooseDate(s){
  s=str(s); if(!s) return null;
  const M=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/); if(m && M.includes(m[1].toLowerCase())) return new Date(+m[3],M.indexOf(m[1].toLowerCase()),+m[2]);
  m=s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{4})/); if(m && M.includes(m[2].toLowerCase())) return new Date(+m[3],M.indexOf(m[2].toLowerCase()),+m[1]);
  return null;
}

/* Build a new progress note from a case or an earlier progress note */
function progressFromSource(src, srcKind, now, author){
  const d = { datetime: now.toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}), author: author || str(src.author) || str(src.interviewer) || '' };
  ['patient','agesex','location','attending','primaryDx','differential','otherDx'].forEach(k=>{ if(str(src[k])) d[k]=src[k]; });
  d.admitDate = srcKind==='case' ? str(src.datetime).replace(/,?\s*\d{1,2}:\d{2}.*$/,'') : str(src.admitDate);
  const ad = parseLooseDate(d.admitDate);
  if(ad){ const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()); const n=Math.round((today-ad)/86400000)+1; if(n>=1 && n<1000) d.hday=String(n); }
  const rows = t => (t||[]).filter(r=>r.some(c=>str(c)));
  if(srcKind==='case') d.meds = rows(src.meds).map(r=>[r[0]||'', r[1]||'', '', r[3]||'']);
  else d.meds = rows(src.meds).map(r=>[r[0]||'', r[1]||'', '', r[3]||'']);   // "Change today" starts blank

  /* ---- ZIP (stored, no compression) ---- */
  const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

  /* ---- Medical certificate: a letter, not a form ---- */

  Object.entries(SCHEMAS).forEach(([k,sc])=>sc.sections.forEach(s=>s.fields.forEach(f=>FIELDS[k][f.id]=f)));

  let store = load();
  let cur = null, secIdx = 0, saveTimer = null;

  function load(){
    try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.cases){ Object.values(s.cases).forEach(c=>{ c.kind=c.kind||'case'; }); s.last=s.last||{}; return s; } }catch(e){}
    return {cases:{}, last:{}};
  }
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(store)); setStatus('Saved on this iPad'); }
    catch(e){ setStatus('Not saved: storage is full or blocked'); toast('This record could not be saved. Export it now, then delete old records.'); }
  }
  function queueSave(){ setStatus('Saving…'); clearTimeout(saveTimer); saveTimer=setTimeout(persist, 400); }
  function setStatus(t){ const el=$('#status'); if(el) el.textContent=t; }
  function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 3600); }
  const R = () => store.cases[cur];
  const D = () => R().data;
  const SECS = rec => SCHEMAS[(rec||R()).kind].sections;
  const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const when = t => new Date(t).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});
  const progress = rec => SECS(rec).filter(s=>sectionStarted(s,rec.data)).length;
  const recTitle = rec => rec.kind==='ho' ? ((str(rec.data.unit)||'On-call handover')+', '+(rec.data.rows||[]).length+' patient'+((rec.data.rows||[]).length===1?'':'s')) : str(rec.data.patient) || str(rec.data.patientName) || ('Untitled '+SCHEMAS[rec.kind].name.toLowerCase());
  const recKind = rec => rec.kind==='pn' ? ('Progress note'+(str(rec.data.hday)?', hospital day '+str(rec.data.hday):'')) : rec.kind==='dc' ? ('Discharge summary'+(str(rec.data.dischargeDate)?', '+str(rec.data.dischargeDate):'')) : rec.kind==='mc' ? ('Medical certificate'+(str(rec.data.certDate)?', '+str(rec.data.certDate):'')) : rec.kind==='ca' ? ('Clinical abstract'+(str(rec.data.dateIssued)?', '+str(rec.data.dateIssued):'')) : rec.kind==='ho' ? ('Handover sheet'+(str(rec.data.hoDate)?', '+str(rec.data.hoDate):'')) : rec.kind==='sp' ? ('Safety plan'+(str(rec.data.spDate)?', '+str(rec.data.spDate):'')) : 'Case';
  const samePt = (a,b) => !!str(a) && str(a).toLowerCase().replace(/\s+/g,' ')===str(b).toLowerCase().replace(/\s+/g,' ');

  function sheet(html, onReady, cls){
    const s=document.createElement('div'); s.className='scrim';
    s.innerHTML=`<div class="sheet${cls?' '+cls:''}" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(s);
    const close=()=>s.remove(); s.onclick=e=>{ if(e.target===s) close(); };
    onReady(s, close);
    const f=s.querySelector('button'); if(f) f.focus();
  }

  /* ----- home ----- */
  function renderHome(){
    cur=null; document.title='Case & MSE';
    const list = Object.values(store.cases).sort((a,b)=>b.updated-a.updated);
    document.body.innerHTML = `
      <header class="bar"><h1>Case &amp; MSE</h1>
        <button class="btn" id="imp">Open Word file</button>
        <input type="file" id="impFile" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden></header>
      <main class="home">
        <h2>Patient records</h2>
        <p class="starts-label">During the admission</p>
        <div class="starts">
          <button id="new"><strong>New case</strong><span>Initial interview and MSE</span></button>
          <button id="newpn"><strong>New progress note</strong><span>Follow-up visit, built from the case or last note</span></button>
          <button id="newdc"><strong>New discharge summary</strong><span>End of admission, built from the case and notes</span></button>
        </div>
        <p class="starts-label">On call</p>
        <div class="starts">
          <button id="newho"><strong>New handover sheet</strong><span>One printable page of active inpatients</span></button>
        </div>
        <p class="starts-label">Documents for the patient</p>
        <div class="starts">
          <button id="newmc"><strong>New medical certificate</strong><span>Diagnosis, dates of care, and signatures</span></button>
          <button id="newca"><strong>New clinical abstract</strong><span>Summary of the admission for claims, referrals, and transfers</span></button>
          <button id="newsp"><strong>New safety plan</strong><span>Six-step plan the patient takes home</span></button>
        </div>
        ${list.length ? `<ul class="cases">${list.map(c=>{
          const n=SECS(c).length, p=progress(c), pct=Math.round(p/n*100);
          return `<li><button class="open" data-open="${c.id}">
            <span class="who"><span class="kind ${c.kind}">${h(recKind(c))}</span><strong>${h(recTitle(c))}</strong>
            <span>${h(str(c.data.datetime))}${str(c.data.datetime)?'. ':''}Edited ${h(when(c.updated))}</span></span>
            <span class="meter">${p} of ${n} sections<i><b style="width:${pct}%"></b></i></span></button></li>`;}).join('')}</ul>`
          : `<p class="empty">Nothing here yet. Tap <strong>New case</strong> to start an interview, or <strong>Open Word file</strong> to continue one you exported.</p>`}
        <div class="privacy"><strong>Where your data lives.</strong> Records are saved only in this app on this iPad; nothing is uploaded anywhere. Export the Word file to your hospital's approved storage, then delete the record here.</div>
        ${list.length?`<div class="foot"><button class="btn quiet danger" id="wipe">Delete all records</button></div>`:''}
        <footer class="credit"><p>Web app developed in 2026 by Isabella Navarro, MD.</p><p>Latest version ${VERSION}.</p><p><a href="mailto:isaymotion@gmail.com">isaymotion@gmail.com</a></p></footer>
      </main>`;
    $('#new').onclick = newCase;
    $('#newpn').onclick = chooseProgressSource;
    $('#newdc').onclick = chooseDischargeSource;
    $('#newmc').onclick = chooseCertSource;
    $('#newca').onclick = chooseAbstractSource;
    $('#newho').onclick = newHandover;
    $('#newsp').onclick = chooseSafetySource;
    $('#imp').onclick = ()=>{ pickFile(importFile); };
    document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRec(b.dataset.open));
    const w=$('#wipe'); if(w) w.onclick=()=>{ if(confirm('Delete ALL records from this iPad? This cannot be undone.')){ store.cases={}; persist(); renderHome(); } };
    window.scrollTo(0,0);
  }
  function pickFile(cb, multi){ const i=$('#impFile'); i.multiple=!!multi; i.onchange=e=>{ const fs=Array.from(e.target.files); e.target.value=''; if(fs.length) cb(multi?fs:fs[0]); }; i.click(); }
  async function readWord(file){
    try{ const res = await DocxImport.fileToData(file); if(!res.filled){ toast('No information was found in that file. Choose a Word file exported from this app.'); return null; } return res; }
    catch(err){
      toast(err && err.message==='letter-stripped' ? 'This document was re-saved without the app\'s saved details, so it cannot be reopened here. Start a new one instead.' : err && err.message==='old-ios' ? 'This file was re-saved in Word or Pages, and this iPad needs iPadOS 16.4 or later to read it.' : 'This file could not be read. Choose a .docx file that was exported from this app.');
      return null;
    }
  }
  async function importFile(file){
    const res = await readWord(file); if(!res) return;
    const id=newId();
    store.cases[id] = {id, kind:res.kind, created:Date.now(), updated:Date.now(), importedFrom:file.name, data:res.data};
    persist(); openRec(id);
    const rec=store.cases[id], what = lc(SCHEMAS[res.kind].name);
    sheet(`<h3>${h(SCHEMAS[res.kind].name)} opened from Word file</h3>
      ${res.edited?`<p class="warn-box"><strong>This file was changed after it was exported.</strong> The app restored the details as they were at export. Changes made in Word are not included, so re-enter them here if they are still needed.</p>`:''}
      <p>${h(file.name)} filled ${progress(rec)} of ${SECS(rec).length} sections. It was added as a new ${what}, so the original file is unchanged. Review each section before exporting again.</p>
      ${res.missed.length?`<p><strong>This text could not be placed in a field.</strong> Re-enter it where it belongs:</p><ul>${res.missed.slice(0,40).map(m=>`<li>${h(m)}</li>`).join('')}</ul>`:''}
      ${res.kind==='ho'?`<p>Overnight events typed into the sheet were read in. To write this morning's notes, go to <strong>3. Next morning</strong>.</p><div class="tools"><button class="btn primary" data-morning>Go to Next morning</button><button class="btn" data-close>Review handover</button></div>`:`<button class="btn primary" data-close>Review ${what}</button>`}`, (s,close)=>{ s.querySelector('[data-close]').onclick=close; const m=s.querySelector('[data-morning]'); if(m) m.onclick=()=>{ close(); secIdx=SECS().findIndex(x=>x.morning); renderRail(); renderSection(); }; });
  }
  function newCase(){
    const id=newId();
    store.cases[id] = {id, kind:'case', created:Date.now(), updated:Date.now(), data:{ datetime:when(Date.now()), interviewer:store.last.interviewer||'', attending:store.last.attending||'' }};
    persist(); openRec(id);
  }

  /* ----- progress notes ----- */
  function chooseProgressSource(){
    const list = Object.values(store.cases).filter(c=>c.kind==='case'||c.kind==='pn').sort((a,b)=>b.updated-a.updated);
    sheet(`<h3>New progress note</h3>
      <p>Start from the patient's case or most recent progress note. Identifiers, diagnosis, medications, and plan carry over.</p>
      ${list.length?`<ul class="pick">${list.map(c=>`<li><button data-src="${c.id}"><strong>${h(recTitle(c))}</strong><span>${h(recKind(c))}${str(c.data.datetime)?'. '+h(str(c.data.datetime)):''}</span></button></li>`).join('')}</ul>`:''}
      <div class="tools"><button class="btn primary" data-file>Choose Word file</button><button class="btn" data-blank>Start blank</button><button class="btn quiet" data-close>Cancel</button></div>`,
    (s,close)=>{
      s.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{ close(); const src=store.cases[b.dataset.src]; createProgress(src.data, src.kind, recTitle(src)+' ('+lc(recKind(src))+')'); });
      s.querySelector('[data-file]').onclick=()=>{ close(); pickFile(async f=>{ const res=await readWord(f); if(!res) return; if(res.kind!=='case' && res.kind!=='pn'){ toast('Choose a case or progress note for this.'); return; } createProgress(res.data, res.kind, f.name); }); };
      s.querySelector('[data-blank]').onclick=()=>{ close(); createProgress({}, 'blank', null); };
      s.querySelector('[data-close]').onclick=close;
    });
  }
  function createProgress(src, srcKind, label){
    const built = srcKind==='blank' ? {data:{datetime:when(Date.now())}, prev:{}, lastMSE:{}} : progressFromSource(src, srcKind, new Date(), store.last.interviewer);
    built.data.author = built.data.author || store.last.interviewer || '';
    built.data.attending = built.data.attending || store.last.attending || '';
    const id=newId();
    store.cases[id] = {id, kind:'pn', created:Date.now(), updated:Date.now(), source:label, prev:built.prev, lastMSE:built.lastMSE, data:built.data};
    persist(); openRec(id);
    if(label) toast('Started from '+label+'. Check the carried-over details.');
  }

  /* ----- discharge summaries ----- */
  function chooseDischargeSource(){
    const list = Object.values(store.cases).filter(c=>c.kind==='case'||c.kind==='pn').sort((a,b)=>(a.kind===b.kind?0:a.kind==='case'?-1:1) || b.updated-a.updated);
    sheet(`<h3>New discharge summary</h3>
      <p>Choose the patient's admission case. Progress notes for the same patient on this iPad are added automatically.</p>
      ${list.length?`<ul class="pick">${list.map(c=>`<li><button data-src="${c.id}"><strong>${h(recTitle(c))}</strong><span>${h(recKind(c))}${str(c.data.datetime)?'. '+h(str(c.data.datetime)):''}</span></button></li>`).join('')}</ul>`:''}
      <p class="small">Working from Word files instead? Select the case and the progress notes together.</p>
      <div class="tools"><button class="btn primary" data-file>Choose Word files</button><button class="btn" data-blank>Start blank</button><button class="btn quiet" data-close>Cancel</button></div>`,
    (s,close)=>{
      s.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{
        close(); const pick=store.cases[b.dataset.src], pt=pick.data.patient;
        const same = Object.values(store.cases).filter(c=>c.id===pick.id || samePt(c.data.patient, pt));
        const cs = pick.kind==='case' ? pick : same.filter(c=>c.kind==='case').sort((a,b)=>b.updated-a.updated)[0];
        const pns = same.filter(c=>c.kind==='pn').map(c=>c.data);
        createDischarge(cs?cs.data:null, pns, 'this iPad');
      });
      s.querySelector('[data-file]').onclick=()=>{ close(); pickFile(async files=>{
        let cs=null; const pns=[];
        for(const f of files){ const res=await readWord(f); if(!res) continue; if(res.kind==='case' && !cs) cs=res.data; else if(res.kind==='pn') pns.push(res.data); }
        if(!cs && !pns.length){ toast('Choose the case and progress notes for this patient.'); return; }
        if(!cs && !pns.length) return;
        createDischarge(cs, pns, files.length===1?files[0].name:files.length+' Word files');
      }, true); };
      s.querySelector('[data-blank]').onclick=()=>{ close(); createDischarge(null, [], null); };
      s.querySelector('[data-close]').onclick=close;
    });
  }
  function createDischarge(caseD, pns, from){
    const built = dischargeFromSources(caseD, pns, new Date(), store.last.interviewer);
    built.data.author = built.data.author || store.last.interviewer || '';
    built.data.attending = built.data.attending || store.last.attending || '';
    const parts = [caseD?'the case':'', pns.length?(pns.length===1?'1 progress note':pns.length+' progress notes'):''].filter(Boolean).join(' and ');
    const label = parts ? parts+(from?' ('+from+')':'') : null;
    const id=newId();
    store.cases[id] = {id, kind:'dc', created:Date.now(), updated:Date.now(), source:label, prev:built.prev, lastMSE:built.lastMSE, courseNotes:built.courseNotes, data:built.data};
    persist(); openRec(id);
    if(label) toast('Built from '+label+'. Check every carried-over detail.');
    if(!caseD && (pns.length || from)) setTimeout(()=>toast('No admission case was found, so "Reason for admission" is blank.'), 3700);
  }

  /* ----- medical certificates ----- */
  const ORDER = {dc:0, pn:1, case:2};
  const newest = (list, kind) => list.filter(c=>c.kind===kind).sort((a,b)=>(kind==='pn' ? (parseInt(str(b.data.hday),10)||0)-(parseInt(str(a.data.hday),10)||0) : 0) || b.updated-a.updated)[0];
  function chooseCertSource(){
    const list = Object.values(store.cases).filter(c=>c.kind in ORDER).sort((a,b)=>ORDER[a.kind]-ORDER[b.kind] || b.updated-a.updated);
    sheet(`<h3>New medical certificate</h3>
      <p>Choose the record to build it from. A discharge summary gives the inpatient dates, final diagnosis, and signing physicians.</p>
      ${list.length?`<ul class="pick">${list.map(c=>`<li><button data-src="${c.id}"><strong>${h(recTitle(c))}</strong><span>${h(recKind(c))}${c.kind!=='dc'&&str(c.data.datetime)?'. '+h(str(c.data.datetime)):''}</span></button></li>`).join('')}</ul>`:''}
      <div class="tools"><button class="btn primary" data-file>Choose Word file</button><button class="btn" data-blank>Start blank</button><button class="btn quiet" data-close>Cancel</button></div>`,
    (s,close)=>{
      s.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{ close(); const r=store.cases[b.dataset.src]; createCert(r.data, r.kind, recTitle(r)+' ('+lc(recKind(r))+')'); });
      s.querySelector('[data-file]').onclick=()=>{ close(); pickFile(async f=>{ const res=await readWord(f); if(!res) return; if(!['case','pn','dc'].includes(res.kind)){ toast('Choose a case, progress note, or discharge summary.'); return; } createCert(res.data, res.kind, f.name); }); };
      s.querySelector('[data-blank]').onclick=()=>{ close(); createCert(null, null, null); };
      s.querySelector('[data-close]').onclick=close;
    });
  }
  function createCert(src, kind, label){
    const d = certFromSource(src, kind, new Date(), store.last);
    const id=newId();
    store.cases[id] = {id, kind:'mc', created:Date.now(), updated:Date.now(), source:label, data:d};
    persist(); openRec(id);
    if(label) toast('Started from '+label+'. Check every detail before printing.');
  }
  function chooseAbstractSource(){
    const list = Object.values(store.cases).filter(c=>c.kind in ORDER).sort((a,b)=>ORDER[a.kind]-ORDER[b.kind] || b.updated-a.updated);
    sheet(`<h3>New clinical abstract</h3>
      <p>Choose any record for the patient. The case, latest progress note, and discharge summary for the same patient on this iPad are all used.</p>
      ${list.length?`<ul class="pick">${list.map(c=>`<li><button data-src="${c.id}"><strong>${h(recTitle(c))}</strong><span>${h(recKind(c))}${c.kind!=='dc'&&str(c.data.datetime)?'. '+h(str(c.data.datetime)):''}</span></button></li>`).join('')}</ul>`:''}
      <p class="small">Working from Word files instead? Select the discharge summary, case, and notes together.</p>
      <div class="tools"><button class="btn primary" data-file>Choose Word files</button><button class="btn" data-blank>Start blank</button><button class="btn quiet" data-close>Cancel</button></div>`,
    (s,close)=>{
      s.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{
        close(); const pick=store.cases[b.dataset.src];
        const same = Object.values(store.cases).filter(c=>c.kind in ORDER && (c.id===pick.id || samePt(c.data.patient, pick.data.patient)));
        const get = k => pick.kind===k ? pick : newest(same, k);
        const dc=get('dc'), cs=get('case'), pn=get('pn');
        const used=[cs&&'case', pn&&'progress note', dc&&'discharge summary'].filter(Boolean);
        createAbstract(dc&&dc.data, cs&&cs.data, pn&&pn.data, recTitle(pick)+': '+used.join(', '));
      });
      s.querySelector('[data-file]').onclick=()=>{ close(); pickFile(async files=>{
        let dc=null, cs=null, pn=null;
        for(const f of files){ const res=await readWord(f); if(!res) continue;
          if(res.kind==='dc' && !dc) dc=res.data; else if(res.kind==='case' && !cs) cs=res.data;
          else if(res.kind==='pn' && (!pn || (parseInt(str(res.data.hday),10)||0) >= (parseInt(str(pn.hday),10)||0))) pn=res.data; }
        if(!dc && !cs && !pn){ toast('Choose the case, progress notes, or discharge summary for this patient.'); return; }
        createAbstract(dc, cs, pn, files.length===1?files[0].name:files.length+' Word files');
      }, true); };
      s.querySelector('[data-blank]').onclick=()=>{ close(); createAbstract(null, null, null, null); };
      s.querySelector('[data-close]').onclick=close;
    });
  }
  function createAbstract(dc, cs, pn, label){
    const d = abstractFromSources(dc, cs, pn, new Date(), store.last);
    const id=newId();
    store.cases[id] = {id, kind:'ca', created:Date.now(), updated:Date.now(), source:label, data:d};
    persist(); openRec(id);
    if(label) toast('Built from '+label+'. Check every detail before printing.');
  }
  function abstractPreviewHTML(d){
    const P=abstractParts(d), e=t=>h(t).replace(/\n/g,'<br>');
    const sig = s => s ? `<div class="sig"><div class="line"></div><strong>${h(s.name)}</strong><span>${h(s.title)}</span><span>PRC Lic. No. ${s.lic?h(s.lic):'<em>missing</em>'}</span></div>` : '<div class="sig empty"></div>';
    const cells = P.signers.length>=2 ? [P.signers[0],P.signers[1]] : [null, P.signers[0]];
    return `<article class="cert abstract" aria-label="Abstract preview">
      <header>${P.header.filter(Boolean).map((t,i)=>`<div class="h${i}">${h(t)}</div>`).join('') || '<div class="h2"><em>Institution not entered</em></div>'}</header>
      <h3>CLINICAL ABSTRACT</h3>
      <p class="date">Date: ${P.date?h(P.date):'<em>missing</em>'}</p>
      ${P.info.length?`<table class="info">${P.info.map(([k,v])=>`<tr><th scope="row">${h(k)}</th><td>${h(v)}</td></tr>`).join('')}</table>`:''}
      ${P.sections.map(sec=>`<h4>${h(sec.title)}</h4>${sec.items.map(it=>`<p class="lbl">${h(it.label)}</p>${it.table?`<div class="tblwrap"><table class="info meds"><tr>${it.table.cols.map(c=>`<th>${h(c)}</th>`).join('')}</tr>${it.table.rows.map(r=>`<tr>${it.table.cols.map((_,i)=>`<td>${h(r[i]||'')}</td>`).join('')}</tr>`).join('')}</table></div>`:`<p class="txt">${e(it.text)}</p>`}`).join('')}`).join('') || '<p class="warn">No clinical details entered yet.</p>'}
      <p class="body">${h(P.closing)}</p>
      <div class="sigs">${cells.map(sig).join('')}</div>
      ${P.signers.length?'':'<p class="warn">No signing physician entered.</p>'}
    </article>`;
  }
  /* ----- safety plan ----- */
  function chooseSafetySource(){
    const list = Object.values(store.cases).filter(c=>c.kind in ORDER).sort((a,b)=>ORDER[a.kind]-ORDER[b.kind] || b.updated-a.updated);
    sheet(`<h3>New safety plan</h3>
      <p>Choose any record for the patient. Their name, your name, and your hospital's numbers are filled in, and relevant notes from the chart are shown for reference while you work with the patient.</p>
      ${list.length?`<ul class="pick">${list.map(c=>`<li><button data-src="${c.id}"><strong>${h(recTitle(c))}</strong><span>${h(recKind(c))}${c.kind!=='dc'&&str(c.data.datetime)?'. '+h(str(c.data.datetime)):''}</span></button></li>`).join('')}</ul>`:''}
      <div class="tools"><button class="btn primary" data-blank>Start blank</button><button class="btn quiet" data-close>Cancel</button></div>`,
    (s,close)=>{
      s.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{
        close(); const pick=store.cases[b.dataset.src];
        const same = Object.values(store.cases).filter(c=>c.kind in ORDER && (c.id===pick.id || samePt(c.data.patient, pick.data.patient)));
        const recs = ['dc','pn','case'].map(k=> pick.kind===k ? pick : newest(same,k)).filter(Boolean);
        createSafety(recs, recTitle(pick));
      });
      s.querySelector('[data-blank]').onclick=()=>{ close(); createSafety([], null); };
      s.querySelector('[data-close]').onclick=close;
    });
  }
  function createSafety(recs, label){
    const built = safetyFromSources(recs, new Date(), store.last);
    const id=newId();
    store.cases[id] = {id, kind:'sp', created:Date.now(), updated:Date.now(), source:label, refs:built.refs, data:built.data};
    persist(); openRec(id);
    if(label) toast('Started for '+label+'. Fill it in together with the patient, in their words.');
  }
  function refsHTML(s, rec){
    const keys=(s.refs||[]).filter(k=>rec.refs && str(rec.refs[k]));
    if(!keys.length) return '';
    return `<aside class="refs" aria-label="From the chart"><p class="refs-h">From the chart, for reference only. This text is not printed.</p>${keys.map(k=>`<p><strong>${h(SP_REF_LABELS[k])}:</strong> ${h(rec.refs[k])}</p>`).join('')}</aside>`;
  }
  function safetyPreviewHTML(d){

  /* ----- handover ----- */
  function patientGroups(){
    const groups = [];
    Object.values(store.cases).filter(c=>['case','pn','dc'].includes(c.kind) && str(c.data.patient)).forEach(c=>{
      let g = groups.find(g=>samePt(g.patient, c.data.patient)); if(!g){ g={patient:c.data.patient, recs:[]}; groups.push(g); } g.recs.push(c); });
    return groups.map(g=>{
      const latest = newest(g.recs,'pn') || newest(g.recs,'case');
      const discharged = g.recs.some(c=>c.kind==='dc');
      const outpatient = !g.recs.some(c=>c.kind==='pn') && latest && latest.kind==='case' && latest.data.loc==='Outpatient';
      return {patient:g.patient, latest, active: !!latest && !discharged && !outpatient};
    });
  }
  const byWard = (a,b) => str(a.ward).localeCompare(str(b.ward), undefined, {numeric:true}) || str(a.patient).localeCompare(str(b.patient));
  function newHandover(){
    const now = new Date();
    const rows = patientGroups().filter(g=>g.active).map(g=>handoverRow(g.latest.data, g.latest.kind, g.latest.id, now)).sort(byWard);
    const id=newId();
    store.cases[id] = {id, kind:'ho', created:Date.now(), updated:Date.now(), data:{ hoDate:when(Date.now()), fromRes:store.last.interviewer||'', unit:store.last.unit||'', rows }};
    persist(); openRec(id); secIdx=1; renderRail(); renderSection();
    toast(rows.length ? 'Added '+rows.length+' active inpatient'+(rows.length===1?'':'s')+'. Add pending labs and what to watch.' : 'No active inpatients on this iPad. Add patients below.');
  }
  function addPatientSheet(){
    const d=D(), have=d.rows||[];

    sheet(`<h3>Add patients</h3>
      ${opts.length?`<p>Patients on this iPad not yet on the sheet. Discharged patients are marked.</p><ul class="pick checks">${opts.map((g,i)=>`<li><label><input type="checkbox" data-gi="${i}" ${g.active?'checked':''}><span><strong>${h(g.patient)}</strong><span>${h(recKind(g.latest))}${g.active?'':'. Discharged or outpatient'}</span></span></label></li>`).join('')}</ul>`:'<p>Every patient on this iPad is already on the sheet.</p>'}
      <div class="tools">${opts.length?'<button class="btn primary" data-add>Add selected</button>':''}<button class="btn" data-blankrow>Add a patient not on this iPad</button><button class="btn quiet" data-close>Cancel</button></div>`,
    (s,close)=>{
      const add=s.querySelector('[data-add]'); if(add) add.onclick=()=>{ const now=new Date(); s.querySelectorAll('[data-gi]:checked').forEach(cb=>{ const g=opts[+cb.dataset.gi]; d.rows.push(handoverRow(g.latest.data, g.latest.kind, g.latest.id, now)); }); close(); touch(); renderSection(); };
      s.querySelector('[data-blankrow]').onclick=()=>{ d.rows.push({key:'',patient:'',agesex:'',ward:'',hday:'',admitDate:'',dx:'',risk:'',meds:'',pending:'',watch:'',overnight:''}); close(); touch(); renderSection(); setTimeout(()=>{ const els=document.querySelectorAll('[data-rk="patient"]'); if(els.length) els[els.length-1].focus(); },50); };
      s.querySelector('[data-close]').onclick=close;
    });
  }
  function pagesBadge(d){
    const n=handoverPages(d); if(!n) return '';
    return `<p class="fit ${n>1?'over':''}" id="fit">${n===1?'Fits on one printed page.':'About '+n+' printed pages. Shorten entries or split the list to fit one page.'}</p>`;
  }
  const HO_FIELDS = [['patient','Patient / MRN','text'],['agesex','Age / sex','text'],['ward','Ward / bed','text'],['hday','Hospital day','text'],['admitDate','Admission date','text'],
    ['dx','Diagnosis','area'],['risk','Risk','area','Suicide / violence risk, observation level'],['meds','Current meds','area','Name and dose; separate with semicolons'],
    ['pending','Pending labs / results','area'],['watch','Watch overnight / to do','area','What could go wrong, and what to do'],['overnight','Overnight events','area','Filled in by the on-call resident']];
  function patientsHTML(d){
    const rows=d.rows||[];

        <div class="ptgrid">${HO_FIELDS.slice(0,5).map(([k,l])=>`<label>${h(l)}<input type="text" data-row="${i}" data-rk="${k}" value="${h(r[k])}" autocomplete="off"></label>`).join('')}</div>
        <div class="ptareas">${HO_FIELDS.slice(5).map(([k,l,,hint])=>`<label${k==='overnight'?' class="on"':''}>${h(l)}${hint?`<small>${h(hint)}</small>`:''}<textarea data-row="${i}" data-rk="${k}">${h(r[k])}</textarea></label>`).join('')}</div>

  function handoverPreviewHTML(d){
    const rows=d.rows||[], e=t=>h(t).replace(/\n/g,'<br>');
    const head=['On-call handover', str(d.unit), str(d.hoDate)].filter(Boolean).join('  |  ');
    const who=[str(d.fromRes)&&'Handing over: '+str(d.fromRes), str(d.toRes)&&'Receiving: '+str(d.toRes), str(d.attOnCall)&&'Attending on call: '+str(d.attOnCall), rows.length+' patient'+(rows.length===1?'':'s')].filter(Boolean).join('     ');
    return `${pagesBadge(d)}<div class="hoprev-wrap"><article class="hoprev" aria-label="Handover print preview"><h3>${h(head)}</h3><p class="who">${h(who)}</p>

  function morningHTML(rec){
    const rows=rec.data.rows||[];
    if(!rows.length) return '<p class="empty">There are no patients on this handover sheet.</p>';
    return `<ul class="pick checks morning">${rows.map((r,i)=>{ const made=r.noteId && store.cases[r.noteId];

      return `<li><label><input type="checkbox" data-mi="${i}" ${made?'':'checked'}><span><strong>${h(r.patient||'Patient '+(i+1))}</strong><span>${made?'Note already created this morning. ':''}${bits.length?'Will add '+bits.join(', ')+'.':'Nothing recorded overnight.'}</span></span></label></li>`; }).join('')}</ul>
      <div class="tools"><button class="btn primary" id="mknotes">Create progress notes</button></div>`;

  function createMorningNotes(){
    const rec=R(), ho=rec.data, now=new Date(), made=[];
    const picks = Array.from(document.querySelectorAll('[data-mi]:checked')).map(cb=>+cb.dataset.mi);
    if(!picks.length){ toast('Tick at least one patient.'); return; }
    const redo = picks.filter(i=>ho.rows[i].noteId && store.cases[ho.rows[i].noteId]);
    if(redo.length && !confirm(redo.length+' of these already have a note from this handover. Create another?')) return;
    picks.forEach(i=>{
      const row=ho.rows[i];
      let src = row.key && store.cases[row.key];
      const g = patientGroups().find(g=>samePt(g.patient,row.patient)); if(g && g.latest) src = g.latest;
      const built = progressFromHandover(row, ho, src?src.data:null, src?src.kind:null, now, store.last.interviewer);
      built.data.author = built.data.author || store.last.interviewer || '';
      const id=newId();
      store.cases[id] = {id, kind:'pn', created:Date.now()+made.length, updated:Date.now(), source:'on-call handover'+(str(ho.hoDate)?' ('+str(ho.hoDate)+')':'')+(src?' and '+lc(recKind(src)):''), prev:built.prev, lastMSE:built.lastMSE, data:built.data};
      row.noteId=id; made.push(store.cases[id]);
    });
    touch(); persist(); renderSection();
    sheet(`<h3>${made.length} progress note${made.length===1?'':'s'} created</h3>
      <p>Each note has the identifiers, diagnosis, medications, and plan carried forward, plus the handover items. Open one to finish it.</p>
      <ul class="pick">${made.map(r=>`<li><button data-go="${r.id}"><strong>${h(recTitle(r))}</strong><span>${h(recKind(r))}</span></button></li>`).join('')}</ul>
      <div class="tools"><button class="btn" data-close>Stay on handover</button></div>`,
      (s,close)=>{ s.querySelector('[data-close]').onclick=close; s.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ close(); openRec(b.dataset.go); }); });
  }

  function previewHTML(d){
    const P=certParts(d), e=t=>h(t).replace(/\n/g,'<br>');
    const sig = s => s ? `<div class="sig"><div class="line"></div><strong>${h(s.name)}</strong><span>${h(s.title)}</span><span>PRC Lic. No. ${s.lic?h(s.lic):'<em>missing</em>'}</span></div>` : '<div class="sig empty"></div>';

      <h3>MEDICAL CERTIFICATE</h3>

      <p><strong>To whom it may concern:</strong></p>
      <p class="body">${h(P.lead)}<strong>${h(P.name)}</strong>${h(P.rest)}</p>
      ${P.dx.map(t=>`<p class="dx">${h(t)}</p>`).join('')}

  /* ----- editor ----- */
  function openRec(id){ cur=id; secIdx=0; renderEditor(); }
  function renderEditor(){
    const rec=R(); document.title=recTitle(rec)+' | Case & MSE';
    document.body.innerHTML = `
      <header class="bar">
        <button class="btn quiet" id="back" aria-label="All records">‹ Records</button>
        <button class="btn only-narrow" id="menu" aria-expanded="false" aria-controls="rail">Sections</button>
        <h1 id="title">${h(recTitle(rec))}<small>${h(recKind(rec))}</small></h1>
        <span class="status" id="status">Saved on this iPad</span>
        ${['mc','ca','ho','sp'].includes(rec.kind)?'':'<button class="btn hide-sm" id="rem">Reminders</button>'}
        <button class="btn quiet danger hide-sm" id="del">Delete</button>
        ${rec.kind==='case'?'<button class="btn" id="pres" aria-label="Create presentation slides">Slides</button>':''}
        <button class="btn primary" id="export">Export Word file</button>
      </header>
      <div class="layout"><nav class="rail" id="rail" aria-label="Sections"></nav><main class="main" id="main"></main></div>`;

    if($('#rem')) $('#rem').onclick = showReminders;
    $('#del').onclick = ()=>{ if(confirm('Delete this record from this iPad? Export it first if you need a copy.')){ delete store.cases[cur]; persist(); renderHome(); } };
    $('#export').onclick = exportDocx;
    if($('#pres')) $('#pres').onclick = presentationSheet;
    renderRail(); renderSection();
  }
  function renderRail(){
    const d=D(); let g=null, html='';
    SECS().forEach((s,i)=>{
      if(s.group && s.group!==g) html+=`<div class="grp">${h(s.num.replace(/[A-Z]$/,''))} &nbsp;${h(s.group)}</div>`;
      g=s.group||null;
      const on=sectionStarted(s,d);
      html+=`<button class="${s.group?'sub ':''}${s.risk?'risk ':''}${i===secIdx?'cur':''}" data-sec="${i}" ${i===secIdx?'aria-current="step"':''}><span class="n">${h(s.num)}</span><span>${h(s.title)}</span>${s.preview||s.morning?'<span></span>':`<span class="dot ${on?'on':''}" aria-label="${on?'started':'not started'}"></span>`}</button>`;
    });
    const r=$('#rail'); r.innerHTML=html;
    r.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ secIdx=+b.dataset.sec; r.classList.remove('open'); $('#menu').setAttribute('aria-expanded','false'); renderRail(); renderSection(); window.scrollTo(0,0); });
  }
  function updateRailDots(){
    const d=D();
    document.querySelectorAll('#rail [data-sec]').forEach(b=>{ const on=sectionStarted(SECS()[+b.dataset.sec],d); const dot=b.querySelector('.dot'); if(!dot) return; dot.classList.toggle('on',on); dot.setAttribute('aria-label',on?'started':'not started'); });
  }

  function fieldHTML(f, d, rec){
    const prevV = f.prev && rec.prev && rec.prev[f.prev];
    const lab = `<span class="lab" id="l-${f.id}">${h(f.label)}</span>${f.hint?`<span class="hint">${h(f.hint)}</span>`:''}${prevV?`<span class="hint prev">Last documented: <strong>${h(prevV)}</strong></span>`:''}`;
    const v = d[f.id];
    switch(f.t){
      case 'text': return `<div class="field">${lab}<input type="text" data-f="${f.id}" aria-labelledby="l-${f.id}" value="${h(v)}" autocomplete="off"></div>`;
      case 'area': return `<div class="field">${lab}<textarea class="${f.big?'big':''}" data-f="${f.id}" aria-labelledby="l-${f.id}">${h(v)}</textarea>${f.tool==='course' && rec.courseNotes && rec.courseNotes.length?`<div class="tools"><button class="btn" id="draftCourse">Draft from ${rec.courseNotes.length===1?'1 progress note':rec.courseNotes.length+' progress notes'}</button></div>`:''}${f.tool==='lastMSE' && str(rec.lastMSE)?`<div class="tools"><button class="btn" id="insLastMSE">Insert last progress-note MSE</button></div>`:''}${f.mseTools?`<div class="tools"><button class="btn" id="draft">${h(typeof f.mseTools==='string'?f.mseTools:'Draft from 11A–11F')}</button><button class="btn" id="copy">Copy paragraph</button></div>`:''}</div>`;
      case 'checks': { const sel=v||[]; return `<div class="field" role="group" aria-labelledby="l-${f.id}">${lab}<div class="chips">${f.o.map(o=>`<button class="chip" data-chk="${f.id}" data-o="${h(o)}" aria-pressed="${sel.includes(o)}">${h(o)}</button>`).join('')}</div>${f.score?`<div class="score" id="sc-${f.id}">${sel.length}/${f.o.length} positive</div>`:''}</div>`; }
      case 'radio': return `<div class="field" role="group" aria-labelledby="l-${f.id}">${lab}<div class="seg">${f.o.map(o=>`<button data-rad="${f.id}" data-o="${h(o)}" aria-pressed="${v===o}">${h(o)}</button>`).join('')}</div>${f.detail?`<div class="detail"><input type="text" data-f="${f.id}__d" placeholder="${h(f.detail)}" aria-label="${h(f.label+': '+f.detail)}" value="${h(d[f.id+'__d'])}"></div>`:''}</div>`;
      case 'radios': { const o=v||{}; return `<div class="field">${lab}<div class="radios">${f.p.map(([k,opts])=>`<div class="row" role="group" aria-label="${h(k)}"><span>${h(k)}</span><div class="seg">${opts.map(x=>`<button data-rads="${f.id}" data-k="${h(k)}" data-o="${h(x)}" aria-pressed="${o[k]===x}">${h(x)}</button>`).join('')}</div></div>`).join('')}</div></div>`; }
      case 'parts': { const o=v||{}; return `<div class="field">${lab}<div class="grid ${f.long?'long':''} ${f.inline?'inline':''}">${f.p.map(k=>`<label>${h(k)}${f.long?`<textarea data-f="${f.id}" data-k="${h(k)}">${h(o[k])}</textarea>`:`<input type="text" data-f="${f.id}" data-k="${h(k)}" value="${h(o[k])}" autocomplete="off">`}</label>`).join('')}</div></div>`; }
      case 'patients': return patientsHTML(d);
      case 'lines': {
        const arr = Array.isArray(v) ? v : []; while(arr.length<(f.n||3)) arr.push(''); d[f.id]=arr;
        return `<div class="field">${lab}<div class="lines">${arr.map((x,i)=>`<div class="ln"><span>${i+1}.</span><input type="text" data-f="${f.id}" data-li="${i}" value="${h(x)}" aria-label="${h(f.label+', line '+(i+1))}" autocomplete="off"></div>`).join('')}</div><div class="tbl-actions"><button class="btn quiet" data-addline="${f.id}">Add line</button></div></div>`;
      }
      case 'table': {
        let rows = (v && v.length) ? v : [];
        while(rows.length<f.rows) rows.push(f.c.map(()=>''));
        d[f.id]=rows;
        return `<div class="field">${lab}<div class="tbl"><table><thead><tr>${f.c.map(c=>`<th scope="col">${h(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr>${f.c.map((c,ci)=>`<td><textarea data-f="${f.id}" data-r="${ri}" data-c="${ci}" aria-label="${h(c+', row '+(ri+1))}">${h(r[ci])}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tbl-actions"><button class="btn quiet" data-addrow="${f.id}">Add row</button>${rows.length>1?`<button class="btn quiet" data-delrow="${f.id}">Remove last row</button>`:''}</div></div>`;
      }
    }
    return '';
  }

  function renderSection(){

      </div>
      ${hasLast?`<div class="carry"><div><strong>Start from the last MSE?</strong> Copies the previous selections for 3A–3C so you only change what's different. SI, HI, and self-harm stay blank to be asked today.</div><button class="btn" id="copymse">Start from last MSE</button></div>`:''}
      ${(s.id==='pnInfo'||s.id==='dcInfo') && rec.source?`<p class="source">Started from ${h(rec.source)}.</p>`:''}

        ${next?`<button class="btn primary" id="next">${h(next.num)} ${h(next.title)} ›</button>`:`<span class="tools" style="margin:0">${rec.kind==='case'?'<button class="btn" id="donePres">Create slides</button>':''}<button class="btn primary" id="done">Export Word file</button></span>`}
      </div>`;
    const go = i => { secIdx=i; renderRail(); renderSection(); window.scrollTo(0,0); };

    const cm=$('#copymse'); if(cm) cm.onclick=()=>{

    };
    const ap=$('#addpt'); if(ap) ap.onclick=addPatientSheet;
    const mk=$('#mknotes'); if(mk) mk.onclick=createMorningNotes;
    const dc=$('#draftCourse'); if(dc) dc.onclick=()=>{
      const t=draftCourse(rec.courseNotes); if(!t){ toast('Those progress notes have no assessment or plan changes to draft from.'); return; }
      const ta=$('[data-f="course"]'); if(str(ta.value) && !confirm('Replace the current hospital course with a new draft?')) return;
      ta.value=t; setVal('course',null,t); grow(ta); toast('Draft added. Edit it into a narrative.');
    };
    const im=$('#insLastMSE'); if(im) im.onclick=()=>{
      const ta=$('[data-f="dcMSE"]'); if(str(ta.value) && !confirm('Replace the current text with the last progress-note MSE?')) return;
      ta.value=rec.lastMSE; setVal('dcMSE',null,rec.lastMSE); grow(ta); toast('Inserted. Update it to today\'s findings, including SI and HI.');
    };
    const dr=$('#draft'); if(dr) dr.onclick=()=>{
      const t=draftMSE(D()); if(!t){ toast('Nothing to draft yet. Fill in the MSE sections first.'); return; }
      const ta=$('[data-f="mseNarr"]'); if(str(ta.value) && !confirm('Replace the current paragraph with a new draft?')) return;
      ta.value=t; setVal('mseNarr',null,t); grow(ta);
    };
    const cp=$('#copy'); if(cp) cp.onclick=()=>{
      const t=str(D().mseNarr); if(!t){ toast('The paragraph is empty.'); return; }
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Paragraph copied. Paste it into the EHR.')).catch(()=>{ const ta=$('[data-f="mseNarr"]'); ta.focus(); ta.select(); toast('Text selected. Tap Copy.'); });
    };
    document.querySelectorAll('#main textarea').forEach(grow);
  }

  function grow(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; }
  function touch(){ R().updated=Date.now(); updateRailDots(); queueSave(); }
  function setVal(id, k, val){
    const d=D();
    if(k==null) d[id]=val; else { d[id]=d[id]||{}; d[id][k]=val; }
    if(id==='patient'){ const t=$('#title'); if(t) t.firstChild.textContent=str(val)||recTitle({kind:R().kind,data:{}}); }
    if(id==='interviewer'||id==='author') store.last.interviewer=val;
    if(id==='attending') store.last.attending=val;
    if(id==='unit') store.last.unit=val;
    if(id==='fromRes') store.last.interviewer=val;
    if(['mc','ca','sp'].includes(R().kind)){
      if(['instName','instDept','instAddress','resTitle','attTitle'].includes(id)) store.last[id]=val;
      store.last.lic = store.last.lic || {};
      if(id==='resLic' && str(d.resName)) store.last.lic[normName(d.resName)]=val;
      if(id==='attLic' && str(d.attName)) store.last.lic[normName(d.attName)]=val;
      if((id==='resName'||id==='attName') && store.last.lic[normName(val)]){ const lk=id==='resName'?'resLic':'attLic'; if(!str(d[lk])){ d[lk]=store.last.lic[normName(val)]; const el=$(`[data-f="${lk}"]`); if(el) el.value=d[lk]; } }
    }
    if(id==='patientName'){ const t=$('#title'); if(t) t.firstChild.textContent=str(val)||'Untitled medical certificate'; }
    if(R().kind==='dc' && (id==='admitDate'||id==='dischargeDate')){ const l=daysBetween(d.admitDate,d.dischargeDate); if(l){ d.los=l; const el=$('[data-f="los"]'); if(el) el.value=l; } }
    touch();
  }

  document.addEventListener('input', e=>{
    const el=e.target;
    if(cur && el.dataset && el.dataset.row!=null && el.dataset.rk){
      if(el.tagName==='TEXTAREA') grow(el);
      const r=D().rows[+el.dataset.row]; r[el.dataset.rk]=el.value;
      if(el.dataset.rk==='patient'){ const hd=el.closest('.ptcard').querySelector('.ptcard-head strong'); if(hd) hd.textContent=str(el.value)||'New patient'; }
      const fit=$('#fit'); if(fit){ const n=handoverPages(D()); fit.className='fit'+(n>1?' over':''); fit.textContent=n===1?'Fits on one printed page.':'About '+n+' printed pages. Shorten entries or split the list to fit one page.'; }
      touch(); return;
    }
    if(!cur || !el.dataset || !el.dataset.f) return;
    if(el.tagName==='TEXTAREA') grow(el);
    const id=el.dataset.f;
    if(el.dataset.r!=null){ D()[id][+el.dataset.r][+el.dataset.c]=el.value; if(R().kind==='sp' && id==='hotlines'){ const tmp={hotlines:D().hotlines.filter(r=>r.some(x=>str(x))).map(r=>r.slice())}; if(D().lang==='Filipino') spSwapDefaults(tmp,'English'); store.last.hotlines=tmp.hotlines; } touch(); return; }
    if(el.dataset.li!=null){ D()[id][+el.dataset.li]=el.value; touch(); return; }
    setVal(id, el.dataset.k??null, el.value);
  });
  document.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b || !cur) return;
    const d=D(), F=FIELDS[R().kind];
    if(b.dataset.chk){ const id=b.dataset.chk, o=b.dataset.o; const a=d[id]=d[id]||[];
      const i=a.indexOf(o); if(i>=0) a.splice(i,1); else a.push(o);
      const f=F[id]; d[id]=f.o.filter(x=>a.includes(x));
      b.setAttribute('aria-pressed', i<0); const sc=$('#sc-'+id); if(sc) sc.textContent=`${d[id].length}/${f.o.length} positive`; touch(); }
    else if(b.dataset.rad){ const id=b.dataset.rad, o=b.dataset.o; const was=d[id]; d[id] = d[id]===o ? null : o;
      if(R().kind==='sp' && id==='lang'){ if(!d.lang) d.lang='English'; if(d.lang!==(was||'English')){ spSwapDefaults(d, d.lang); store.last.spLang=d.lang; } b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.o===d.lang)); touch(); return; }
      b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.o===d[id])); touch(); }
    else if(b.dataset.rads){ const id=b.dataset.rads, k=b.dataset.k, o=b.dataset.o; d[id]=d[id]||{};
      if(d[id][k]===o) delete d[id][k]; else d[id][k]=o;
      b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', d[id][k]===x.dataset.o)); touch(); }
    else if(b.dataset.addline){ d[b.dataset.addline].push(''); touch(); renderSection(); const ins=document.querySelectorAll(`[data-f="${b.dataset.addline}"]`); if(ins.length) ins[ins.length-1].focus(); }
    else if(b.dataset.rowdel!=null){ const i=+b.dataset.rowdel, r=d.rows[i]; if(!confirm('Remove '+(str(r.patient)||'this patient')+' from the handover sheet?')) return; d.rows.splice(i,1); touch(); renderSection(); }
    else if(b.dataset.addrow){ const f=F[b.dataset.addrow]; d[f.id].push(f.c.map(()=>'')); touch(); renderSection(); }
    else if(b.dataset.delrow){ const f=F[b.dataset.delrow]; const last=d[f.id][d[f.id].length-1];
      if(last.some(c=>str(c)) && !confirm('The last row has text in it. Remove it?')) return; d[f.id].pop(); touch(); renderSection(); }
  });

  async function exportDocx(){
    persist();
    const rec=R(), d=D();
    const bytes = DocxGen.build(d, rec.kind);
    const base = (str(d.patient)||str(d.patientName)||(R().kind==='ho'?(str(d.unit)||'Unit'):'')||'Patient').replace(/[^\w\- ]+/g,' ').trim().replace(/\s+/g,'_').slice(0,50) || 'Patient';
    const hd = rec.kind==='pn' && /^\d+$/.test(str(d.hday)) ? '_HD'+str(d.hday) : '';
    const name = `${base}_${SCHEMAS[rec.kind].file}${hd}_${new Date().toISOString().slice(0,10)}.docx`;
    await saveFile(bytes, name, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'Word file created: '+name);
  }
  // Hands a file to the iPad's share sheet (Save to Files, AirDrop, open in an app); downloads it elsewhere
  async function saveFile(bytes, name, type, done){
    const file = new File([bytes], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:name}); return; }
      catch(err){ if(err && err.name==='AbortError') return; }
    }
    const url=URL.createObjectURL(file), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast(done);
  }

  /* ----- case presentation (PowerPoint) ----- */
  const tplCache = {};
  async function templateBytes(t){
    if(tplCache[t.id]) return tplCache[t.id];
    const r = await fetch(t.file); if(!r.ok) throw new Error('no-template');
    return (tplCache[t.id] = await r.arrayBuffer());
  }
  function presentationSheet(){
    persist();
    const rec=R(), d=D(), avail=CaseSlides.availableSections(d, SECTIONS);
    if(!avail.length){ toast('Nothing to present yet. Fill in the case first.'); return; }
    const P = store.last.pres || {}, T = CaseSlides.TEMPLATES;
    const st = { tpl: T.some(t=>t.id===P.tpl) ? P.tpl : T[0].id, mode: ['initials','alias','full'].includes(P.mode) ? P.mode : 'initials',
      dividers: P.dividers!==false, notes: P.notes!==false, include: new Set(avail.map(s=>s.id)) };
    const initials = CaseSlides.deidentify(d,'initials').label;
    const title = str(rec.presTitle) || str(d.primaryDx).split(/\n/)[0].slice(0,90) || 'Case presentation';
    const presenter = str(d.interviewer) || str(store.last.interviewer);
    const modes = [['initials','Initials ('+initials+')'],['alias','“Patient A”'],['full','Full name']];
    sheet(`<h3>Case presentation</h3>
      <p class="small">Makes a PowerPoint file from this case, in the order of the case file. Slides show the entries in short blocks; the full text you typed goes into the speaker notes. It opens in PowerPoint, Keynote, or Google Slides for editing.</p>
      <div class="field"><span class="lab" id="l-pt">Slide design</span>${T.length>1?'':'<span class="hint">More designs can be added later.</span>'}<div class="seg" role="group" aria-labelledby="l-pt">${T.map(t=>`<button data-pt="${h(t.id)}" aria-pressed="${t.id===st.tpl}">${h(t.name)}</button>`).join('')}</div></div>
      <div class="field"><label class="lab" for="ptitle">Title</label><input type="text" id="ptitle" value="${h(title)}" autocomplete="off"></div>
      <div class="field"><label class="lab" for="ppres">Presenter</label><input type="text" id="ppres" value="${h(presenter)}" autocomplete="off"></div>
      <div class="field"><span class="lab" id="l-pm">Show the patient as</span><span class="hint">The name and MRN are replaced everywhere in the slides and notes. Read the slides before presenting: names of relatives or places typed into the text are not changed.</span>
        <div class="seg" role="group" aria-labelledby="l-pm">${modes.map(([k,l])=>`<button data-pm="${k}" aria-pressed="${k===st.mode}">${h(l)}</button>`).join('')}</div>
        <p class="warn-box" id="pmwarn" ${st.mode==='full'?'':'hidden'}>The full name and MRN will appear on the slides. Use this only within the care team, and follow your department's privacy rules.</p></div>
      <div class="field"><span class="lab" id="l-ps">Sections</span><span class="hint">Only sections with entries are listed. Tap to leave one out.</span>
        <div class="chips" role="group" aria-labelledby="l-ps">${avail.map(s=>`<button class="chip" data-ps="${h(s.id)}" aria-pressed="true">${h(s.num)}. ${h(s.title)}</button>`).join('')}</div></div>
      <div class="field"><span class="lab" id="l-px">Also include</span>
        <div class="chips" role="group" aria-labelledby="l-px"><button class="chip" data-px="dividers" aria-pressed="${st.dividers}">Outline and part dividers</button><button class="chip" data-px="notes" aria-pressed="${st.notes}">Full text in speaker notes</button></div></div>
      <div class="tools"><button class="btn primary" id="pgo">Create PowerPoint</button><button class="btn quiet" data-close>Cancel</button></div>`,
    (s, close)=>{
      s.querySelector('[data-close]').onclick=close;
      s.addEventListener('click', e=>{
        const b=e.target.closest('button'); if(!b) return;
        if(b.dataset.pt){ st.tpl=b.dataset.pt; s.querySelectorAll('[data-pt]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
        else if(b.dataset.pm){ st.mode=b.dataset.pm; s.querySelectorAll('[data-pm]').forEach(x=>x.setAttribute('aria-pressed', x===b)); s.querySelector('#pmwarn').hidden = st.mode!=='full'; }
        else if(b.dataset.ps){ const id=b.dataset.ps, on=!st.include.has(id); on?st.include.add(id):st.include.delete(id); b.setAttribute('aria-pressed', on); }
        else if(b.dataset.px){ const k=b.dataset.px; st[k]=!st[k]; b.setAttribute('aria-pressed', st[k]); }
      });
      const go=s.querySelector('#pgo');
      go.onclick = async ()=>{
        if(!st.include.size){ toast('Choose at least one section.'); return; }
        const t=T.find(x=>x.id===st.tpl), ttl=str(s.querySelector('#ptitle').value)||'Case presentation', pres=str(s.querySelector('#ppres').value);
        rec.presTitle = ttl===title && !str(rec.presTitle) ? '' : ttl;
        store.last.pres = { tpl:st.tpl, mode:st.mode, dividers:st.dividers, notes:st.notes }; persist();
        go.disabled=true; go.textContent='Creating…';
        try{
          const out = await CaseSlides.generate(D(), { template: await templateBytes(t), templateCfg:t, title:ttl, presenter:pres, patientAs:st.mode,
            dividers:st.dividers, notes:st.notes, include:avail.map(x=>x.id).filter(id=>st.include.has(id)) });
          const base = String(out.label).replace(/\./g,'').replace(/[^\w\- ]+/g,' ').trim().replace(/\s+/g,'_').slice(0,40) || 'Patient';
          const name = `${base}_Case_presentation_${new Date().toISOString().slice(0,10)}.pptx`;
          close();
          await saveFile(out.bytes, name, 'application/vnd.openxmlformats-officedocument.presentationml.presentation', `PowerPoint created: ${out.count} slides`);
        }catch(err){
          go.disabled=false; go.textContent='Create PowerPoint';
          toast(err && err.message==='old-ios' ? 'Update the iPad (iPadOS 16.4 or later) to create slides.' : err && err.message==='no-template' ? 'The slide design could not be loaded. Connect to the internet once, then try again.' : 'The presentation could not be created. Export the Word file and contact the developer.');
          if(typeof console!=='undefined') console.error(err);
        }
      };
    }, 'wide');
  }

  function showReminders(){
    sheet(`<h3>Interview &amp; MSE reminders</h3><ul>${REMINDERS.map(r=>`<li>${h(r)}</li>`).join('')}</ul><button class="btn primary" data-close>Close</button>`,
      (s,close)=>{ s.querySelector('[data-close]').onclick=close; });
  }

  window.addEventListener('pagehide', ()=>{ if(cur) persist(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && cur) persist(); });
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
  renderHome();
})();

</script>
