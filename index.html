  /* ----- Google Docs and Slides: an editable copy in the resident's own Google Drive -----
     Sign-in goes to Google's page and back (pop-up windows often fail in Home Screen apps). The access
     lasts about an hour and lets the app see only the files it creates. */
  const gReady = () => /\.apps\.googleusercontent\.com$/.test(String(GOOGLE_CLIENT_ID||''));
  const GK = 'psyCaseApp.google';
  const sess = { get:k=>{ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); }catch(e){} } };
  const keep = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} } };
  function gToken(){ try{ const t=JSON.parse(sess.get(GK)||'null'); return t && t.exp>Date.now()+60000 ? t.token : null; }catch(e){ return null; } }
  function gSignIn(intent){
    persist();
    keep.set(GK+'.pending', JSON.stringify({ ...intent, at:Date.now() }));
    const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
    sess.set(GK+'.state', state); keep.set(GK+'.state', state);
    const redirect = location.origin + location.pathname.replace(/index\.html$/,'');
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({ client_id:GOOGLE_CLIENT_ID, redirect_uri:redirect, response_type:'token',
      scope:'https://www.googleapis.com/auth/drive.file', state, include_granted_scopes:'true' });
  }
  function gStart(intent){
    if(navigator.onLine===false){ toast('Connect to the internet to save to Google Drive.'); return; }
    const t = gToken(); if(t) gRun(intent, t, true); else gSignIn(intent);
  }
  async function gFolder(token){
    const auth = { Authorization:'Bearer '+token };
    const id = store.last.gFolder;
    if(id){ const r = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?fields=id,trashed`, { headers:auth });
      if(r.ok){ const j = await r.json(); if(!j.trashed) return id; } }
    const r = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', { method:'POST', headers:{ ...auth, 'Content-Type':'application/json' }, body:JSON.stringify({ name:'PsychInterview', mimeType:'application/vnd.google-apps.folder' }) });
    if(r.status===401) throw new Error('google-auth');
    if(!r.ok) return null;
    const j = await r.json(); store.last.gFolder = j.id; persist(); return j.id;
  }
  async function gUpload(bytes, name, srcType, gType, token){
    const auth = { Authorization:'Bearer '+token };
    const check = r => { if(r.status===401) throw new Error('google-auth'); if(r.status===403) throw new Error('google-denied'); if(!r.ok) throw new Error('google-upload'); return r; };
    const folder = await gFolder(token);
    const meta = { name: name.replace(/\.(docx|pptx)$/,''), mimeType:gType, ...(folder ? { parents:[folder] } : {}) };
    const q = 'fields=id,name,webViewLink';
    if(bytes.length <= 4*1024*1024){
      const bd = 'caseapp' + Math.random().toString(36).slice(2);
      const body = new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: ${srcType}\r\n\r\n`, bytes, `\r\n--${bd}--`]);
      return (await check(await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&'+q, { method:'POST', headers:{ ...auth, 'Content-Type':'multipart/related; boundary='+bd }, body }))).json();
    }
    // larger files (some slide designs): Google's two-step upload
    const start = check(await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&'+q, { method:'POST',
      headers:{ ...auth, 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type':srcType }, body:JSON.stringify(meta) }));
    const loc = start.headers.get('Location'); if(!loc) throw new Error('google-upload');
    return (await check(await fetch(loc, { method:'PUT', headers:{ 'Content-Type':srcType }, body:bytes }))).json();
  }
  async function gRun(intent, token, canRetry){
    const rec = store.cases[intent.rec]; if(!rec){ toast('That record is no longer on this iPad.'); return; }
    const slides = intent.what==='slides', what = slides ? 'Google Slides' : 'Google Docs';
    let close = ()=>{}, box = null;
    sheet(`<h3>Saving to ${what}</h3><p id="gstat">Creating the file…</p>`, (s,c)=>{ close=c; box=s; });
    const stat = t => { const el = box && box.querySelector('#gstat'); if(el) el.textContent = t; };
    try{
      const f = slides ? await slidesFor(rec, intent.pres) : await docxFor(rec, intent.layout);
      stat('Uploading to your Google Drive…');
      const res = await gUpload(f.bytes, f.name, slides ? PPTX_TYPE : DOCX_TYPE, slides ? 'application/vnd.google-apps.presentation' : 'application/vnd.google-apps.document', token);
      box.querySelector('.sheet').innerHTML = `<h3>Saved to ${what}</h3><p><strong>${h(res.name||f.name)}</strong> is in the <strong>PsychInterview</strong> folder of your Google Drive. Check the layout there; ${slides?'Google Slides may swap fonts it does not have.':'Google Docs may move pictures a little.'}</p>
        <div class="tools">${res.webViewLink ? `<a class="btn primary" href="${h(res.webViewLink)}" target="_blank" rel="noopener">Open in ${what}</a>` : ''}<button class="btn quiet" data-close>Done</button></div>`;
      box.querySelector('[data-close]').onclick = close;
      const a = box.querySelector('a.btn'); if(a) a.focus();
    }catch(err){
      close();
      const m = err && err.message;
      if(m==='google-auth' && canRetry){ sess.set(GK, null); gSignIn(intent); return; }
      toast(m==='google-denied' ? 'Google refused the upload. Check that the Google Drive API is turned on in the app\'s Google Cloud project.'
        : m==='old-ios' ? 'Update the iPad (iPadOS 16.4 or later) to create slides.'
        : 'The file could not be saved to Google Drive. Check the internet connection and try again.');
      if(typeof console!=='undefined') console.error(err);
    }
  }
  /* Back from Google's sign-in page: keep the access, then finish the export that started it */
  function gResume(){
    const hs = location.hash.slice(1); if(!/(^|&)(access_token|error)=/.test(hs)) return;
    const p = new URLSearchParams(hs);
    history.replaceState(null, '', location.pathname + location.search);
    let pending = null; try{ pending = JSON.parse(keep.get(GK+'.pending')||'null'); }catch(e){}
    const want = sess.get(GK+'.state') || keep.get(GK+'.state');
    keep.set(GK+'.pending', null); keep.set(GK+'.state', null); sess.set(GK+'.state', null);
    if(p.get('error')){ toast(p.get('error')==='access_denied' ? 'Google sign-in was cancelled, or this Gmail account is not on the app\'s list of testers.' : 'Google sign-in did not finish. Try again.'); return; }
    if(!want || p.get('state')!==want){ toast('Google sign-in could not be confirmed. Try again.'); return; }
    const token = p.get('access_token'); if(!token) return;
    sess.set(GK, JSON.stringify({ token, exp: Date.now() + (+p.get('expires_in')||3600)*1000 }));
    if(pending && Date.now()-pending.at < 15*60000 && store.cases[pending.rec]){ openRec(pending.rec); gRun(pending, token, false); }
    else toast('Signed in to Google. Tap the export again.');
  }

  /* The genogram as a PNG picture for Word: { bytes, w, h, wIn, hIn } (wIn/hIn in symbol units) */
  async function genogramPNG(d){
    const G = genogramLayout(d); if(!G) return null;
    const unit = 80, svg = genogramSVG(G, unit);
    const img = new Image();
    await new Promise((res, rej)=>{ img.onload=res; img.onerror=rej; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
    const c = document.createElement('canvas'); c.width=Math.round(G.w*unit); c.height=Math.round(G.h*unit);
    const g = c.getContext('2d'); g.fillStyle='#ffffff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r, 'image/png'));
    return { bytes:new Uint8Array(await blob.arrayBuffer()), w:c.width, h:c.height, wIn:G.w, hIn:G.h };
  }

  async function exportFile(){
    persist();
    if(gReady()){
      const rec=R(), f=await docxFor(rec);
      sheet(`<h3>Word file ready</h3><p>${h(f.name)}</p><div class="tools"><button class="btn primary" id="wshare">Share</button><button class="btn" id="wgoogle">Save to Google Docs</button><button class="btn quiet" data-close>Done</button></div>`,
        (s2, close)=>{ s2.querySelector('[data-close]').onclick=close;
          s2.querySelector('#wshare').onclick=()=>saveFile(f.bytes, f.name, DOCX_TYPE, 'Word file created: '+f.name);
          s2.querySelector('#wgoogle').onclick=()=>{ close(); gStart({ rec:cur, what:'doc' }); }; });
      return;
    }
    const rec=R(), d=D();
    const bytes = DocxGen.build(d, rec.kind);
    const base = (str(d.patient)||str(d.patientName)||(R().kind==='ho'?(str(d.unit)||'Unit'):'')||'Patient').replace(/[^\w\- ]+/g,' ').trim().replace(/\s+/g,'_').slice(0,50) || 'Patient';
    const hd = rec.kind==='pn' && /^\d+$/.test(str(d.hday)) ? '_HD'+str(d.hday) : '';
    const name = `${base}_${SCHEMAS[rec.kind].file}${hd}_${new Date().toISOString().slice(0,10)}.docx`;
    await saveFile(bytes, name, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'Word file created: '+name);
  }
  // Hands a file to the iPad's share sheet (Save to Files, AirDrop, open in an app); downloads it elsewhere
  async function saveFile(bytes, name, type, done){
    const file = new File([bytes], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:name}); return; }
      catch(err){ if(err && err.name==='AbortError') return; }
    }
    const url=URL.createObjectURL(file), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast(done);
  }

  /* ----- case presentation (PowerPoint) ----- */
  const tplCache = {};
  async function templateBytes(t){
    if(tplCache[t.id]) return tplCache[t.id];
    const r = await fetch(t.file); if(!r.ok) throw new Error('no-template');
    return (tplCache[t.id] = await r.arrayBuffer());
  }
  function presentationSheet(){
    persist();
    const rec=R(), d=D(), avail=CaseSlides.availableSections(d, SECTIONS);
    if(!avail.length){ toast('Nothing to present yet. Fill in the case first.'); return; }
    const P = store.last.pres || {}, T = CaseSlides.TEMPLATES;
    const st = { tpl: T.some(t=>t.id===P.tpl) ? P.tpl : T[0].id, mode: ['initials','alias','full'].includes(P.mode) ? P.mode : 'initials',
      dividers: P.dividers!==false, notes: P.notes!==false, include: new Set(avail.map(s=>s.id)), fmt: ['pptx','pdf','key'].concat(gReady()?['gslides']:[]).includes(P.fmt) ? P.fmt : 'pptx' };
    const FMT = {
      pptx:{ label:'PowerPoint', go:'Create PowerPoint', hint:'Opens in PowerPoint, Keynote, or Google Slides, where you can edit it.' },
      pdf: { label:'PDF', go:'Create PDF', hint:'Ready to present or send; it cannot be edited. Speaker notes are not included, and the text cannot be selected.' },
      key: { label:'Keynote', go:'Create for Keynote', hint:'Keynote turns the slides into a Keynote presentation on this iPad. After you tap Share, choose Keynote (tap More if you do not see it). Keynote may swap fonts it does not have.' } };
    if(gReady()) FMT.gslides = { label:'Google Slides', go:'Save to Google Slides', hint:'Saves an editable copy in the PsychInterview folder of your Google Drive. You sign in with your Gmail account the first time in each session. Google Slides may swap fonts it does not have.' };
    const initials = CaseSlides.deidentify(d,'initials').label;
    const title = str(rec.presTitle) || str(d.caseTitle) || str(d.primaryDx).split(/\n/)[0].slice(0,90) || 'Case presentation';
    const presenter = str(d.preparedBy) || str(d.interviewer) || str(store.last.interviewer);
    const modes = [['initials','Initials ('+initials+')'],['alias','“Patient A”'],['full','Full name']];
    sheet(`<h3>Case presentation</h3>
      <p class="small">Makes slides from this case, in the order of the case file. Slides show the entries in short blocks; the full text you typed goes into the speaker notes.</p>
      <div class="field"><span class="lab" id="l-pf">Save as</span><span class="hint" id="pfhint">${h(FMT[st.fmt].hint)}</span><div class="seg" role="group" aria-labelledby="l-pf">${Object.entries(FMT).map(([k,f])=>`<button data-pf="${k}" aria-pressed="${k===st.fmt}">${h(f.label)}</button>`).join('')}</div></div>
      <div class="field"><span class="lab" id="l-pt">Slide design</span><span class="hint" id="pthint">${h((T.find(t=>t.id===st.tpl)||{}).note||'')}</span><div class="seg" role="group" aria-labelledby="l-pt">${T.map(t=>`<button data-pt="${h(t.id)}" aria-pressed="${t.id===st.tpl}">${h(t.name)}</button>`).join('')}</div></div>
      <div class="field"><label class="lab" for="ptitle">Title</label><input type="text" id="ptitle" value="${h(title)}" autocomplete="off"></div>
      <div class="field"><label class="lab" for="ppres">Presenter</label><input type="text" id="ppres" value="${h(presenter)}" autocomplete="off"></div>
      <div class="field"><span class="lab" id="l-pm">Show the patient as</span><span class="hint">The name and MRN are replaced everywhere in the slides and notes. Read the slides before presenting: names of relatives or places typed into the text are not changed.</span>
        <div class="seg" role="group" aria-labelledby="l-pm">${modes.map(([k,l])=>`<button data-pm="${k}" aria-pressed="${k===st.mode}">${h(l)}</button>`).join('')}</div>
        <p class="warn-box" id="pmwarn" ${st.mode==='full'?'':'hidden'}>The full name and MRN will appear on the slides. Use this only within the care team, and follow your department's privacy rules.</p></div>
      <div class="field"><span class="lab" id="l-ps">Sections</span><span class="hint">Only sections with entries are listed. Tap to leave one out.</span>
        <div class="chips" role="group" aria-labelledby="l-ps">${avail.map(s=>`<button class="chip" data-ps="${h(s.id)}" aria-pressed="true">${h(s.num)}. ${h(s.title)}</button>`).join('')}</div></div>
      <div class="field"><span class="lab" id="l-px">Also include</span>
        <div class="chips" role="group" aria-labelledby="l-px"><button class="chip" data-px="dividers" aria-pressed="${st.dividers}">Outline and part dividers</button><button class="chip" data-px="notes" aria-pressed="${st.notes}">Full text in speaker notes</button></div></div>
      <div class="tools" id="ptools"><button class="btn primary" id="pgo">${h(FMT[st.fmt].go)}</button><button class="btn quiet" data-close>Cancel</button></div>`,
    (s, close)=>{
      s.querySelector('[data-close]').onclick=close;
      s.addEventListener('click', e=>{
        const b=e.target.closest('button'); if(!b) return;
        if(b.dataset.pt){ st.tpl=b.dataset.pt; s.querySelectorAll('[data-pt]').forEach(x=>x.setAttribute('aria-pressed', x===b)); s.querySelector('#pthint').textContent=(T.find(t=>t.id===st.tpl)||{}).note||''; }
        else if(b.dataset.pm){ st.mode=b.dataset.pm; s.querySelectorAll('[data-pm]').forEach(x=>x.setAttribute('aria-pressed', x===b)); s.querySelector('#pmwarn').hidden = st.mode!=='full'; }
        else if(b.dataset.ps){ const id=b.dataset.ps, on=!st.include.has(id); on?st.include.add(id):st.include.delete(id); b.setAttribute('aria-pressed', on); }
        else if(b.dataset.px){ const k=b.dataset.px; st[k]=!st[k]; b.setAttribute('aria-pressed', st[k]); }
        else if(b.dataset.pf){ st.fmt=b.dataset.pf; s.querySelectorAll('[data-pf]').forEach(x=>x.setAttribute('aria-pressed', x===b)); s.querySelector('#pfhint').textContent=FMT[st.fmt].hint; const g=s.querySelector('#pgo'); if(g && !g.disabled) g.textContent=FMT[st.fmt].go; }
      });
      const go=s.querySelector('#pgo');
      go.onclick = async ()=>{
        if(!st.include.size){ toast('Choose at least one section.'); return; }
        const t=T.find(x=>x.id===st.tpl), ttl=str(s.querySelector('#ptitle').value)||'Case presentation', pres=str(s.querySelector('#ppres').value);
        rec.presTitle = ttl===title && !str(rec.presTitle) ? '' : ttl;
        store.last.pres = { tpl:st.tpl, mode:st.mode, dividers:st.dividers, notes:st.notes, fmt:st.fmt }; persist();
        const fmt=st.fmt;
        if(fmt==='gslides'){ close(); gStart({ rec:cur, what:'slides', pres:{ tpl:st.tpl, mode:st.mode, dividers:st.dividers, notes:st.notes, title:ttl, presenter:pres, include:avail.map(x=>x.id).filter(id=>st.include.has(id)) } }); return; }
        go.disabled=true; go.textContent='Creating…';
        try{
          const out = await CaseSlides.generate(D(), { template: await templateBytes(t), templateCfg:t, title:ttl, presenter:pres, patientAs:st.mode,
            dividers:st.dividers, notes:st.notes, include:avail.map(x=>x.id).filter(id=>st.include.has(id)) });
          const base = String(out.label).replace(/\./g,'').replace(/[^\w\- ]+/g,' ').trim().replace(/\s+/g,'_').slice(0,40) || 'Patient';
          const stem = `${base}_Case_presentation_${new Date().toISOString().slice(0,10)}`;
          let file;
          if(fmt==='pdf'){
            if(!t.pdf) throw new Error('no-pdf');
            const bytes = await CasePDF.render(out.deck, { backgrounds:t.pdf.backgrounds, fonts:'fonts/', title:ttl,
              onProgress:(i,n)=>{ go.textContent=`Drawing slide ${i} of ${n}…`; } });
            file = { bytes, name:stem+'.pdf', type:'application/pdf', what:'PDF' };
          } else file = { bytes:out.bytes, name:stem+'.pptx', type:'application/vnd.openxmlformats-officedocument.presentationml.presentation', what: fmt==='key' ? 'Slides for Keynote' : 'PowerPoint' };
          // Sharing needs a fresh tap on the iPad, so the file waits for one
          const tools = s.querySelector('#ptools');
          tools.innerHTML = `<p class="small" style="flex-basis:100%;margin:0 0 6px"><strong>${h(file.what)} ready: ${out.count} slides.</strong> ${fmt==='key'?'Tap Share, then choose <strong>Keynote</strong>. Keynote converts the slides and keeps them as a Keynote presentation.':'Tap Share to save it to Files, AirDrop it, or open it in another app.'}</p><button class="btn primary" id="pshare">Share</button><button class="btn quiet" data-close>Done</button>`;
          tools.querySelector('[data-close]').onclick=close;
          tools.querySelector('#pshare').onclick=()=>saveFile(file.bytes, file.name, file.type, `${file.what} saved: ${file.name}`);
          tools.querySelector('#pshare').focus();
        }catch(err){
          go.disabled=false; go.textContent=FMT[st.fmt].go;
          toast(err && err.message==='old-ios' ? 'Update the iPad (iPadOS 16.4 or later) to create slides.' : err && err.message==='no-pdf' ? 'This slide design cannot be saved as PDF yet. Choose PowerPoint.' : err && err.message==='no-template' ? 'The slide design could not be loaded. Connect to the internet once, then try again.' : 'The presentation could not be created. Export the Word file and contact the developer.');
          if(typeof console!=='undefined') console.error(err);
        }
      };
    }, 'wide');
  }

  function showReminders(){
    sheet(`<h3>Interview &amp; MSE reminders</h3><ul>${REMINDERS.map(r=>`<li>${h(r)}</li>`).join('')}</ul><button class="btn primary" data-close>Close</button>`,
      (s,close)=>{ s.querySelector('[data-close]').onclick=close; });
  }

  window.addEventListener('pagehide', ()=>{ if(cur) persist(); });
  setTimeout(()=>{ if(gReady()) gResume(); }, 0);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && cur) persist(); });
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
  renderHome();
})();

</script>
