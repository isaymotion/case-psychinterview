<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case &amp; MSE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Case & MSE">
<meta name="theme-color" content="#365F91">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#1B2A3A; --ink-2:#4A5A6B; --ink-3:#7A8898;
  --blue:#365F91; --blue-deep:#243F60; --wash:#EAF2F8; --wash-2:#D9EAF7;
  --line:#CFDAE5; --paper:#FFFFFF; --page:#F3F6F9;
  --risk:#9E3A38; --risk-wash:#F8ECEB;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rail:292px; --bar:60px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#E6EDF4; --ink-2:#B3C0CD; --ink-3:#8494A5;
  --blue:#8DB4E2; --blue-deep:#B9D3F0; --wash:#1D2B3A; --wash-2:#243649;
  --line:#33465A; --paper:#141D27; --page:#0E151D;
  --risk:#E39A97; --risk-wash:#3A2224;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--page);color:var(--ink);font:17px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
textarea{resize:none;min-height:88px;overflow:hidden;line-height:1.45}
textarea.big{min-height:180px}

/* ----- top bar ----- */
.bar{position:sticky;top:0;z-index:20;height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar h1{font:600 19px/1.2 var(--serif);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .status{font-size:13px;color:var(--ink-3);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;min-height:44px;font-size:16px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.primary{color:#0E151D} }
.btn.quiet{border-color:transparent;background:transparent;color:var(--blue)}
.btn.danger{color:var(--risk)}
.only-narrow{display:none}

/* ----- case list ----- */
.home{max-width:760px;margin:0 auto;padding:28px 20px 60px}
.home h2{font:600 30px/1.2 var(--serif);margin:8px 0 6px}
.home .lede{color:var(--ink-2);margin:0 0 22px;max-width:60ch}
.cases{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cases li{border-bottom:1px solid var(--line)}
.cases button.open{display:flex;width:100%;text-align:left;gap:16px;align-items:center;padding:16px 4px;background:none;border:0}
.cases .who{flex:1;min-width:0}
.cases .who strong{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cases .who span{font-size:14px;color:var(--ink-3)}
.meter{width:120px;flex:none;font-size:13px;color:var(--ink-3);text-align:right}
.meter i{display:block;height:6px;border-radius:3px;background:var(--wash-2);margin-top:5px;overflow:hidden}
.meter i b{display:block;height:100%;background:var(--blue)}
.empty{padding:36px 4px;color:var(--ink-2)}
.privacy{margin-top:34px;padding:16px 18px;border-left:3px solid var(--blue);background:var(--wash);border-radius:0 8px 8px 0;font-size:15px;color:var(--ink-2)}
.privacy strong{color:var(--ink)}
.home .foot{margin-top:18px;display:flex;justify-content:flex-end}

/* ----- case layout ----- */
.layout{display:grid;grid-template-columns:var(--rail) 1fr;min-height:calc(100% - var(--bar))}
.rail{position:sticky;top:var(--bar);height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:var(--page);padding:10px 0 40px;-webkit-overflow-scrolling:touch}
.rail .grp{font:600 13px/1.3 var(--sans);color:var(--ink-3);padding:14px 18px 4px 18px}
.rail button{display:grid;grid-template-columns:40px 1fr 14px;align-items:center;gap:4px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 14px 9px 15px;font-size:15px;line-height:1.3;color:var(--ink-2)}
.rail button .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:14px}
.rail button.sub{padding-left:27px}
.rail button.cur{background:var(--paper);border-left-color:var(--blue);color:var(--ink);font-weight:600}
.rail button.risk.cur{border-left-color:var(--risk)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--blue);border-color:var(--blue)}
.risk .dot.on{background:var(--risk);border-color:var(--risk)}
.main{padding:26px 34px 80px;max-width:900px;width:100%}
.sec-head{margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--blue)}
.sec-head.risk{border-bottom-color:var(--risk)}
.sec-head .kicker{font-size:14px;color:var(--ink-3);margin:0 0 2px}
.sec-head h2{font:600 28px/1.2 var(--serif);margin:0;color:var(--blue-deep)}
.sec-head.risk h2{color:var(--risk)}
.sec-head p.note{margin:8px 0 0;color:var(--ink-2);font-style:italic}

.field{margin:0 0 24px}
.field > .lab{display:block;font-weight:600;font-size:16px;margin:0 0 3px}
.field > .hint{display:block;font-size:14px;color:var(--ink-3);margin:0 0 8px}
.field > .lab + input,.field > .lab + textarea,.field > .lab + .chips,.field > .lab + .seg,.field > .lab + .grid{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;min-height:44px;font-size:15.5px;line-height:1.2;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.risky .chip[aria-pressed="true"]{background:var(--risk);border-color:var(--risk)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E151D} }
.score{font-size:14px;color:var(--ink-2);margin-top:8px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:10px 18px;min-height:44px;font-size:15.5px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.risky .seg button[aria-pressed="true"]{background:var(--risk)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E151D} }
.detail{margin-top:10px}
.radios{display:grid;gap:10px}
.radios .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.radios .row > span{width:120px;font-size:15px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.grid.inline{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.grid.long{grid-template-columns:1fr}
.grid label{display:block;font-size:14px;color:var(--ink-2)}
.grid label input,.grid label textarea{margin-top:4px}
.grid textarea{min-height:64px}
.tbl{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--paper)}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;table-layout:fixed}
.tbl th{background:var(--wash-2);font-size:13.5px;font-weight:600;text-align:left;padding:8px 10px;color:var(--ink-2);vertical-align:bottom}
.tbl td{border-top:1px solid var(--line);padding:0;vertical-align:top}
.tbl td + td,.tbl th + th{border-left:1px solid var(--line)}
.tbl textarea{border:0;border-radius:0;min-height:48px;padding:10px;font-size:16px;background:transparent}
.tbl textarea:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.tbl-actions{display:flex;gap:6px;margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.pager .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis}

/* ----- sheet + toast ----- */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.38);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--paper);border-radius:14px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:22px 24px}
.sheet h3{font:600 22px/1.2 var(--serif);margin:0 0 12px}
.sheet ul{margin:0 0 16px;padding-left:20px}
.sheet li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;z-index:50;font-size:15px;max-width:90vw}

/* ----- narrower iPads / portrait ----- */
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .rail{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px));left:0;bottom:0;height:auto;width:min(330px,86vw);z-index:30;transform:translateX(-105%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
  .rail.open{transform:none;visibility:visible;transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.18)}
  .only-narrow{display:inline-block}
  .main{padding:22px 20px 80px}
  .bar .status{display:none}
}
@media (max-width:600px){ .bar .hide-sm{display:none} .meter{width:80px} }
@media (prefers-reduced-motion:reduce){ .rail{transition:none} }

</style>
</head>
<body>
<noscript>This app needs JavaScript turned on in Safari.</noscript>
<script>
/* ---------- Template structure (mirrors the Integrated Psychiatry Resident Case + MSE Template) ---------- */
const SECTIONS = [
  { id:'enc', num:'A', title:'Patient & encounter information', fields:[
    {t:'text', id:'patient', label:'Patient / MRN'},
    {t:'text', id:'datetime', label:'Date / time'},
    {t:'text', id:'agesex', label:'Age / sex'},
    {t:'text', id:'location', label:'Location / unit'},
    {t:'text', id:'interviewer', label:'Interviewer'},
    {t:'text', id:'attending', label:'Attending'}
  ]},
  { id:'idd', num:'1', title:'Identifying data & source of information', fields:[
    {t:'text', id:'marital', label:'Marital status'},
    {t:'text', id:'occupation', label:'Occupation'},
    {t:'text', id:'referred', label:'Referred by'},
    {t:'text', id:'livingwith', label:'Living with'},
    {t:'text', id:'informant', label:'Informant'},
    {t:'radio', id:'reliability', label:'Reliability', o:['Poor','Fair','Good'], detail:'Details'},
    {t:'area', id:'idsummary', label:'Identifying summary', hint:'Age, sex, marital status, occupation, how patient came to be seen, source and reliability.'}
  ]},
  { id:'cc', num:'2', title:'Chief complaint', fields:[
    {t:'area', id:'cc', label:'Chief complaint', hint:"Patient's own words whenever possible.", quote:true}
  ]},
  { id:'hpi', num:'3', title:'History of present illness', fields:[
    {t:'area', id:'hpi', label:'HPI narrative', hint:'Chronological: onset, course, severity, precipitants/stressors, associated symptoms, functional change, why seeking help now.', big:true},
    {t:'parts', id:'assoc', label:'Associated changes', p:['Sleep','Mood','Interests','Relationships','Functioning']},
    {t:'area', id:'timeline', label:'Timeline / key events'}
  ]},
  { id:'ros', num:'4', title:'Psychiatric review of systems', fields:[
    {t:'checks', id:'rosChecks', label:'Endorsed symptoms', o:['Sleep change','↓ Interest','Guilt','↓ Energy','↓ Concentration','Appetite change','Psychomotor change','Suicidality','↓ Need for sleep','Grandiosity','Impulsivity','Generalized worry','Panic attacks','Obsessions / compulsions','Trauma / PTSD symptoms','Social anxiety','Specific phobias','Hallucinations','Delusions / paranoia','Ideas of reference','Inattention / hyperactivity','Disordered eating']},
    {t:'area', id:'rosDetails', label:'ROS details', hint:'Positive symptoms, duration/severity, and pertinent negatives.'}
  ]},
  { id:'pph', num:'5', title:'Past psychiatric history', fields:[
    {t:'area', id:'priorDx', label:'Prior diagnoses', hint:'Diagnosis / who made it / approximate date.'},
    {t:'table', id:'episodes', label:'Past episodes', c:['Episode / diagnosis','Onset / duration / severity','Treatment / dose / duration','Response / adherence / outcome'], rows:3},
    {t:'area', id:'hosp', label:'Hospitalizations / ECT'},
    {t:'area', id:'psychotherapy', label:'Psychotherapy'},
    {t:'area', id:'pastMeds', label:'Past medication trials', hint:'Medication, dose, duration, response, adverse effects, adherence.'}
  ]},
  { id:'safety', num:'6', title:'Safety & lethality history', risk:true, note:'Ask directly and specifically.', fields:[
    {t:'checks', id:'safetyChecks', label:'Endorsed', o:['Current SI','Current intent','Current plan','Access to means','Past attempt(s)','NSSI','Current HI','History of violence','Command hallucinations']},
    {t:'area', id:'pastAttempts', label:'Past attempts', hint:'Method, lethality, rescue potential, preparatory acts, circumstances.'},
    {t:'area', id:'protective', label:'Protective factors', hint:'What has stopped the patient from acting / reasons for living / supports.'},
    {t:'area', id:'otherSafety', label:'Other safety concerns'}
  ]},
  { id:'sub', num:'7', title:'Substance use, abuse & addiction', fields:[
    {t:'checks', id:'subChecks', label:'Substances / behaviors', o:['Alcohol','Tobacco / nicotine','Cannabis','Stimulants','Opioids','Sedatives','Hallucinogens','Other substances','Caffeine','Gambling']},
    {t:'table', id:'subTable', label:'Use details', c:['Substance','Amount / route / frequency','Last use','Tolerance / withdrawal / consequences'], rows:4},
    {t:'checks', id:'cage', label:'CAGE', score:true, o:['Cut down','Annoyed by criticism','Guilty','Eye-opener']},
    {t:'checks', id:'raps4', label:'RAPS4', score:true, o:['Remorse','Amnesia','Perform (failed to)','Starter (morning drink)']}
  ]},
  { id:'med', num:'8', title:'Past medical history & medications', fields:[
    {t:'area', id:'medhx', label:'Medical / surgical history', hint:'Major illnesses, surgeries, neurologic history, and conditions that may mimic or complicate psychiatric illness.'},
    {t:'table', id:'meds', label:'Current medications', c:['Medication','Dose / frequency','Prescriber','Adherence / side effects'], rows:4},
    {t:'text', id:'allergies', label:'Allergies'},
    {t:'text', id:'otc', label:'OTC / herbal / supplements'}
  ]},
  { id:'fam', num:'9', title:'Family history', fields:[
    {t:'checks', id:'famChecks', label:'Noted', o:['Psychiatric diagnoses','Psychiatric hospitalizations','Substance use','Suicide','Medication response / adverse effects','Available family supports']},
    {t:'area', id:'famhx', label:'Family psychiatric history'}
  ]},
  { id:'soc', num:'10', title:'Developmental & social history', fields:[
    {t:'area', id:'childhood', label:'Childhood / development'},
    {t:'area', id:'eduwork', label:'Education / work'},
    {t:'area', id:'relationships', label:'Relationships / family'},
    {t:'area', id:'trauma', label:'Trauma / abuse'},
    {t:'area', id:'legal', label:'Military / legal'},
    {t:'area', id:'living', label:'Current living situation'},
    {t:'area', id:'sexual', label:'Sexual history (as indicated)'}
  ]},
  { id:'app', num:'11A', group:'Mental status examination', groupNote:'Objective composite snapshot during the interview; interpretation belongs in the formulation.', title:'Appearance & behavior', note:'Describe what the reader would actually see.', fields:[
    {t:'checks', id:'appChecks', label:'Observed', o:['Well-groomed','Disheveled / poor hygiene','Appropriate clothing','Unusual clothing','Appears stated age','Older / younger than stated age','Eye contact appropriate','Limited / avoidant eye contact','Intense eye contact','Cooperative','Guarded','Hostile','Seductive / flirtatious','Withdrawn','Agitated / restless','Pacing','Subdued','Tremulous','Rigid','Peculiar mannerisms','Observed response to internal stimuli']},
    {t:'area', id:'appNarr', label:'Appearance / behavior narrative', hint:'Specific clothing, grooming, notable features, motor behavior, attitude, and pertinent negatives.'}
  ]},
  { id:'speech', num:'11B', group:'Mental status examination', title:'Speech & thought process', note:'Name the specific phenomenon and severity; avoid the nonspecific label "thought disorder."', fields:[
    {t:'checks', id:'speechChecks', label:'Observed', o:['Rate normal','Slow','Rapid','Volume normal','Soft','Loud','Pressured','Long response latency','Normal fluency','Linear / goal-directed','Circumstantial','Tangential','Derailment / loosening','Flight of ideas','Thought blocking','Perseveration','Illogical','Disorganized','Word salad','Clang associations']},
    {t:'area', id:'speechNarr', label:'Speech narrative', hint:'Rate, volume, pressure, latency, fluency, spontaneity, articulation.'},
    {t:'area', id:'thoughtNarr', label:'Thought-process narrative', hint:'Organization + phenomenon + severity + brief example if useful.'},
    {t:'area', id:'tpNeg', label:'Pertinent negatives', hint:'No pressure / no blocking / no illogic / no derailment, etc., as actually assessed.'}
  ]},
  { id:'tc', num:'11C', group:'Mental status examination', risk:true, title:'Thought content', note:'Document beliefs and dangerousness specifically; refer to HPI rather than duplicating lengthy history.', fields:[
    {t:'checks', id:'tcChecks', label:'Present', o:['Ruminations','Obsessions','Compulsions','Delusions','Persecutory / paranoid','Grandiose','Somatic','Ideas of reference','Guilt / worthlessness','Hopelessness','Suicidal ideation','Homicidal / violent ideation','NSSI','No abnormal thought content elicited']},
    {t:'area', id:'delusions', label:'Delusions / other content', hint:'Content, conviction, preoccupation, behavioral consequences; "see HPI" when appropriate.'},
    {t:'radios', id:'si', label:'Suicide — current', p:[['SI',['Denied','Passive','Active']],['Plan',['None','Present']],['Intent',['None','Present']],['Actions taken',['None','Present']]]},
    {t:'radios', id:'hi', label:'Homicide / violence — current', p:[['HI',['Denied','Present']],['Plan',['None','Present']],['Intent',['None','Present']],['Actions / access',['None','Present']]]},
    {t:'radio', id:'nssi', label:'Self-harm (NSSI thoughts / behavior)', o:['Denied','Present'], detail:'Details'}
  ]},
  { id:'perc', num:'11D', group:'Mental status examination', title:'Perception', note:'Specify what was asked and what was endorsed or denied.', fields:[
    {t:'checks', id:'percChecks', label:'Reported / observed', o:['Auditory hallucinations','Visual hallucinations','Tactile hallucinations','Olfactory hallucinations','Gustatory hallucinations','Illusions','Depersonalization','Derealization','No abnormal perceptions reported','Observed behavior suggestive of hallucinations']},
    {t:'area', id:'percNarr', label:'Perception narrative', hint:'Modality, content/frequency if relevant, patient response, and observed behavior.'}
  ]},
  { id:'mood', num:'11E', group:'Mental status examination', title:'Mood & affect', note:'Mood = patient-reported feeling. Affect = clinician-observed emotional expression.', fields:[
    {t:'area', id:'mood', label:"Mood — patient's words", hint:'Quote the patient when possible.', quote:true},
    {t:'checks', id:'affectChecks', label:'Affect', o:['Broad / full range','Restricted','Blunted','Flat','Labile','Euthymic / neutral','Dysphoric','Anxious','Irritable','Expansive','Angry','Suspicious','Frightened','Sad / tearful','Other']},
    {t:'area', id:'affectNarr', label:'Affect narrative', hint:'Range + quality + reactivity/stability + observable expression.'},
    {t:'radio', id:'congruence', label:'Congruence', o:['Congruent','Incongruent','Notable discrepancy'], detail:'Details'}
  ]},
  { id:'cog', num:'11F', group:'Mental status examination', title:'Sensorium, cognition & insight', note:'Always state level of consciousness and exactly what was tested.', fields:[
    {t:'checks', id:'cogChecks', label:'Sensorium', o:['Alert','Drowsy','Fluctuating','Hyper-alert / hypervigilant','Stable level of consciousness','Oriented person','Oriented place','Oriented date/time','Oriented situation','Distractible','Attention intact on interview']},
    {t:'parts', id:'orient', label:'Orientation', p:['Person','Place','Date/time','Situation']},
    {t:'parts', id:'attention', label:'Attention', p:['Digit span forward','Digit span backward','Vigilance','Other']},
    {t:'parts', id:'memory', label:'Memory', p:['Immediate / registration','Delayed recall (/3)','Recent','Remote']},
    {t:'parts', id:'exec', label:'Intellectual / executive function', p:['Fund of knowledge','Abstraction','Calculations','Clock / cube / language']},
    {t:'checks', id:'tests', label:'Formal testing used', o:['No formal cognitive testing','MMSE','MoCA','CAM','Digit span','Vigilance test','Clock drawing','Cube drawing','Other']},
    {t:'area', id:'testResults', label:'Formal cognitive testing results', hint:'Exact test, score/findings, errors, limitations.'},
    {t:'radio', id:'insight', label:'Insight', o:['None','Partial','Full'], detail:"Patient's understanding of illness and need for treatment"},
    {t:'radio', id:'judgment', label:'Judgment', o:['Good','Fair','Poor'], detail:'Basis / example'},
    {t:'area', id:'motivation', label:'Treatment motivation / engagement', hint:'Willingness to accept evaluation, treatment, admission, safety measures, follow-up.'}
  ]},
  { id:'mse', num:'11G', group:'Mental status examination', title:'One-paragraph MSE (EHR-ready)', note:'Tap "Draft from 11A–11F" to assemble a starting paragraph from what you entered, then edit it.', fields:[
    {t:'area', id:'mseNarr', label:'MSE narrative', big:true, mseTools:true}
  ]},
  { id:'pe', num:'12', title:'Physical & neurological examination', fields:[
    {t:'parts', id:'vitals', label:'Vitals', p:['BP','HR','RR','Temp','SpO₂'], inline:true},
    {t:'area', id:'neuro', label:'General / neurologic', hint:'General observation, gait, skin, pupils, focused neurologic findings, AIMS if indicated.'},
    {t:'text', id:'deferred', label:'If not performed: reason deferred'}
  ]},
  { id:'labs', num:'13', title:'Labs, imaging & collateral information', fields:[
    {t:'parts', id:'labs', label:'Labs', p:['CBC','Electrolytes','LFTs','TSH','B12 / folate','Utox','Other']},
    {t:'area', id:'imaging', label:'Imaging / other tests'},
    {t:'area', id:'collateral', label:'Collateral', hint:'Contact/source, date, key information, records reviewed.'}
  ]},
  { id:'form', num:'14', title:'Formulation', note:'Integrate biological, psychological, and social factors; interpretation belongs here rather than in the MSE.', fields:[
    {t:'area', id:'bio', label:'Biological'},
    {t:'area', id:'psych', label:'Psychological'},
    {t:'area', id:'social', label:'Social'},
    {t:'area', id:'integrated', label:'Integrated formulation', big:true}
  ]},
  { id:'dx', num:'15', title:'Diagnostic impression (DSM-5)', fields:[

/* ---------- Helpers shared by the app and the Word export ---------- */
const str = v => (typeof v === 'string' ? v.trim() : '');

    case 'radio': return !!v || !!str(d[f.id+'__d']);
    case 'radios': case 'parts': return !!v && Object.values(v).some(x=>str(x));
    case 'table': return Array.isArray(v) && v.some(r=>r.some(c=>str(c)));

}
const sectionStarted = (s,d) => s.fields.some(f=>isFilled(f,d));

  add('Speech/thought process', [j(d.speechChecks), d.speechNarr, d.thoughtNarr, d.tpNeg]);
  const si = d.si||{}, hi = d.hi||{};
  const siT = Object.keys(si).length ? Object.entries(si).map(([k,v])=>key(k)+' '+lc(v)).join(', ') : '';
  const hiT = Object.keys(hi).length ? Object.entries(hi).map(([k,v])=>key(k)+' '+lc(v)).join(', ') : '';
  const nssiT = d.nssi ? 'NSSI '+lc(d.nssi)+(str(d.nssi__d)?' ('+str(d.nssi__d)+')':'') : '';
  add('Thought content', [j(d.tcChecks), d.delusions, siT, hiT, nssiT]);
  add('Perception', [j(d.percChecks), d.percNarr]);
  const moodT = str(d.mood) ? 'mood '+quoted(d.mood) : '';
  const affT = (d.affectChecks||[]).length ? 'affect '+j(d.affectChecks) : '';
  const cong = d.congruence ? lc(d.congruence)+(str(d.congruence__d)?' ('+str(d.congruence__d)+')':'') : '';
  add('Mood/affect', [moodT, affT, d.affectNarr, cong]);
  const ins = d.insight ? 'insight '+lc(d.insight)+(str(d.insight__d)?' ('+str(d.insight__d)+')':'') : '';
  const jud = d.judgment ? 'judgment '+lc(d.judgment)+(str(d.judgment__d)?' ('+str(d.judgment__d)+')':'') : '';

  }
  function newCase(){
    const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    store.cases[id] = {id, created:Date.now(), updated:Date.now(), data:{ datetime:nowLabel(), interviewer:store.last.interviewer||'', attending:store.last.attending||'' }};
    persist(); openCase(id);
  }
  function openCase(id){ cur=id; secIdx=0; renderCase(); }

  /* ----- case editor ----- */
  function renderCase(){
    const c=C(); document.title=(str(c.data.patient)||'Untitled case')+' | Case & MSE';
    document.body.innerHTML = `
      <header class="bar">
        <button class="btn quiet" id="back" aria-label="All cases">‹ Cases</button>
        <button class="btn only-narrow" id="menu" aria-expanded="false" aria-controls="rail">Sections</button>
        <h1 id="title">${h(str(c.data.patient)||'Untitled case')}</h1>
        <span class="status" id="status">Saved on this iPad</span>
        <button class="btn hide-sm" id="rem">Reminders</button>
        <button class="btn quiet danger hide-sm" id="del">Delete</button>
        <button class="btn primary" id="export">Export Word file</button>
      </header>
      <div class="layout"><nav class="rail" id="rail" aria-label="Sections"></nav><main class="main" id="main"></main></div>`;
    $('#back').onclick = ()=>{ persist(); renderHome(); };
    $('#menu').onclick = ()=>{ const r=$('#rail'); const o=r.classList.toggle('open'); $('#menu').setAttribute('aria-expanded',o); };
    $('#rem').onclick = showReminders;
    $('#del').onclick = ()=>{ if(confirm('Delete this case from this iPad? Export it first if you need a copy.')){ delete store.cases[cur]; persist(); renderHome(); } };
    $('#export').onclick = exportDocx;
    renderRail(); renderSection();
  }
  function renderRail(){
    const d=D(); let g=null, html='';
    SECTIONS.forEach((s,i)=>{
      if(s.group && s.group!==g) html+=`<div class="grp">11 &nbsp;${h(s.group)}</div>`;
      g=s.group||null;
      html+=`<button class="${s.group?'sub ':''}${s.risk?'risk ':''}${i===secIdx?'cur':''}" data-sec="${i}" ${i===secIdx?'aria-current="step"':''}><span class="n">${h(s.num)}</span><span>${h(s.title)}</span><span class="dot ${sectionStarted(s,d)?'on':''}" aria-label="${sectionStarted(s,d)?'started':'not started'}"></span></button>`;
    });
    const r=$('#rail'); r.innerHTML=html;
    r.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ secIdx=+b.dataset.sec; r.classList.remove('open'); $('#menu').setAttribute('aria-expanded','false'); renderRail(); renderSection(); window.scrollTo(0,0); });
  }
  function updateRailDots(){
    const d=D();
    document.querySelectorAll('#rail [data-sec]').forEach(b=>{ const s=SECTIONS[+b.dataset.sec], on=sectionStarted(s,d); const dot=b.querySelector('.dot'); dot.classList.toggle('on',on); dot.setAttribute('aria-label',on?'started':'not started'); });
  }

  function fieldHTML(f, d){
    const lab = `<span class="lab" id="l-${f.id}">${h(f.label)}</span>${f.hint?`<span class="hint">${h(f.hint)}</span>`:''}`;
    const v = d[f.id];
    switch(f.t){
      case 'text': return `<div class="field">${lab}<input type="text" data-f="${f.id}" aria-labelledby="l-${f.id}" value="${h(v)}" autocomplete="off"></div>`;
      case 'area': return `<div class="field">${lab}<textarea class="${f.big?'big':''}" data-f="${f.id}" aria-labelledby="l-${f.id}">${h(v)}</textarea>${f.mseTools?`<div class="tools"><button class="btn" id="draft">Draft from 11A–11F</button><button class="btn" id="copy">Copy paragraph</button></div>`:''}</div>`;
      case 'checks': { const sel=v||[]; return `<div class="field" role="group" aria-labelledby="l-${f.id}">${lab}<div class="chips">${f.o.map(o=>`<button class="chip" data-chk="${f.id}" data-o="${h(o)}" aria-pressed="${sel.includes(o)}">${h(o)}</button>`).join('')}</div>${f.score?`<div class="score" id="sc-${f.id}">${sel.length}/${f.o.length} positive</div>`:''}</div>`; }
      case 'radio': return `<div class="field" role="group" aria-labelledby="l-${f.id}">${lab}<div class="seg">${f.o.map(o=>`<button data-rad="${f.id}" data-o="${h(o)}" aria-pressed="${v===o}">${h(o)}</button>`).join('')}</div>${f.detail?`<div class="detail"><input type="text" data-f="${f.id}__d" placeholder="${h(f.detail)}" aria-label="${h(f.label+': '+f.detail)}" value="${h(d[f.id+'__d'])}"></div>`:''}</div>`;
      case 'radios': { const o=v||{}; return `<div class="field">${lab}<div class="radios">${f.p.map(([k,opts])=>`<div class="row" role="group" aria-label="${h(k)}"><span>${h(k)}</span><div class="seg">${opts.map(x=>`<button data-rads="${f.id}" data-k="${h(k)}" data-o="${h(x)}" aria-pressed="${o[k]===x}">${h(x)}</button>`).join('')}</div></div>`).join('')}</div></div>`; }
      case 'parts': { const o=v||{}; return `<div class="field">${lab}<div class="grid ${f.long?'long':''} ${f.inline?'inline':''}">${f.p.map(k=>`<label>${h(k)}${f.long?`<textarea data-f="${f.id}" data-k="${h(k)}">${h(o[k])}</textarea>`:`<input type="text" data-f="${f.id}" data-k="${h(k)}" value="${h(o[k])}" autocomplete="off">`}</label>`).join('')}</div></div>`; }
      case 'table': {
        const rows = (v && v.length) ? v : Array.from({length:f.rows},()=>f.c.map(()=>''));
        if(!v) d[f.id]=rows;
        return `<div class="field">${lab}<div class="tbl"><table><thead><tr>${f.c.map(c=>`<th scope="col">${h(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr>${f.c.map((c,ci)=>`<td><textarea data-f="${f.id}" data-r="${ri}" data-c="${ci}" aria-label="${h(c+', row '+(ri+1))}">${h(r[ci])}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tbl-actions"><button class="btn quiet" data-addrow="${f.id}">Add row</button>${rows.length>1?`<button class="btn quiet" data-delrow="${f.id}">Remove last row</button>`:''}</div></div>`;
      }
    }
    return '';
  }

  function renderSection(){
    const s=SECTIONS[secIdx], d=D();
    const prev=SECTIONS[secIdx-1], next=SECTIONS[secIdx+1];
    $('#main').innerHTML = `
      <div class="sec-head ${s.risk?'risk':''}">
        ${s.group?`<p class="kicker">11. ${h(s.group)}</p>`:''}
        <h2>${h(s.num)}. ${h(s.title)}</h2>
        ${s.groupNote?`<p class="note">${h(s.groupNote)}</p>`:''}
        ${s.note?`<p class="note">${h(s.note)}</p>`:''}
      </div>
      <div class="${s.risk?'risky':''}">${s.fields.map(f=>fieldHTML(f,d)).join('')}</div>
      <div class="pager">
        ${prev?`<button class="btn" id="prev">‹ ${h(prev.num)} ${h(prev.title)}</button>`:'<span></span>'}
        ${next?`<button class="btn primary" id="next">${h(next.num)} ${h(next.title)} ›</button>`:`<button class="btn primary" id="done">Export Word file</button>`}
      </div>`;
    const go = i => { secIdx=i; renderRail(); renderSection(); window.scrollTo(0,0); };
    if(prev) $('#prev').onclick=()=>go(secIdx-1);
    if(next) $('#next').onclick=()=>go(secIdx+1); else $('#done').onclick=exportDocx;
    const dr=$('#draft'); if(dr) dr.onclick=()=>{
      const t=draftMSE(D()); if(!t){ toast('Nothing to draft yet. Fill in sections 11A–11F first.'); return; }
      const ta=$('[data-f="mseNarr"]'); if(str(ta.value) && !confirm('Replace the current paragraph with a new draft?')) return;
      ta.value=t; setVal('mseNarr',null,t); grow(ta);
    };
    const cp=$('#copy'); if(cp) cp.onclick=()=>{
      const t=str(D().mseNarr); if(!t){ toast('The paragraph is empty.'); return; }
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Paragraph copied. Paste it into the EHR.')).catch(()=>{ const ta=$('[data-f="mseNarr"]'); ta.focus(); ta.select(); toast('Select-all done. Tap Copy.'); });
    };
    document.querySelectorAll('#main textarea').forEach(grow);
  }

  function grow(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; }
  function touch(){ C().updated=Date.now(); updateRailDots(); queueSave(); }
  function setVal(id, k, val){
    const d=D();
    if(k==null) d[id]=val; else { d[id]=d[id]||{}; d[id][k]=val; }
    if(id==='patient'){ const t=$('#title'); if(t) t.textContent=str(val)||'Untitled case'; }
    if(id==='interviewer'||id==='attending') store.last[id]=val;
    touch();
  }

  /* ----- one delegated listener for every field ----- */
  document.addEventListener('input', e=>{
    const el=e.target; if(!cur || !el.dataset || !el.dataset.f) return;
    if(el.tagName==='TEXTAREA') grow(el);
    const id=el.dataset.f;
    if(el.dataset.r!=null){ const d=D(); d[id][+el.dataset.r][+el.dataset.c]=el.value; touch(); return; }
    setVal(id, el.dataset.k??null, el.value);
  });
  document.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b || !cur) return;
    const d=D();
    if(b.dataset.chk){ const id=b.dataset.chk, o=b.dataset.o; const a=d[id]=d[id]||[];
      const i=a.indexOf(o); if(i>=0) a.splice(i,1); else a.push(o);
      const f=FIELDS[id]; d[id]=f.o.filter(x=>a.includes(x)); // keep template order
      b.setAttribute('aria-pressed', i<0); const sc=$('#sc-'+id); if(sc) sc.textContent=`${d[id].length}/${f.o.length} positive`; touch(); }
    else if(b.dataset.rad){ const id=b.dataset.rad, o=b.dataset.o; d[id] = d[id]===o ? null : o;
      b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.o===d[id])); touch(); }
    else if(b.dataset.rads){ const id=b.dataset.rads, k=b.dataset.k, o=b.dataset.o; d[id]=d[id]||{};
      if(d[id][k]===o) delete d[id][k]; else d[id][k]=o;
      b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', d[id][k]===x.dataset.o)); touch(); }
    else if(b.dataset.addrow){ const f=FIELDS[b.dataset.addrow]; d[f.id].push(f.c.map(()=>'')); touch(); renderSection(); }
    else if(b.dataset.delrow){ const f=FIELDS[b.dataset.delrow]; const last=d[f.id][d[f.id].length-1];
      if(last.some(c=>str(c)) && !confirm('The last row has text in it. Remove it?')) return; d[f.id].pop(); touch(); renderSection(); }
  });

  /* ----- export ----- */
  async function exportDocx(){
    persist();
    const d=D();
    const bytes = DocxGen.build(d);
    const base = (str(d.patient)||'Case').replace(/[^\w\- ]+/g,' ').trim().replace(/\s+/g,'_').slice(0,50) || 'Case';
    const name = `${base}_${new Date().toISOString().slice(0,10)}.docx`;
    const type = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    const file = new File([bytes], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:name}); return; }
      catch(err){ if(err && err.name==='AbortError') return; }
    }
    const url=URL.createObjectURL(file), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('Word file created: '+name);
  }

  function showReminders(){
    const s=document.createElement('div'); s.className='scrim';
    s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rh"><h3 id="rh">Interview &amp; MSE reminders</h3><ul>${REMINDERS.map(r=>`<li>${h(r)}</li>`).join('')}</ul><button class="btn primary" id="rclose">Close</button></div>`;
    document.body.appendChild(s);
    const close=()=>s.remove(); $('#rclose').onclick=close; s.onclick=e=>{ if(e.target===s) close(); };
    $('#rclose').focus();
  }

  window.addEventListener('pagehide', ()=>{ if(cur) persist(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && cur) persist(); });
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
  renderHome();
})();

</script>
</body>
</html>
