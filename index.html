<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PsychInterview</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PsychInterview">
<meta name="theme-color" content="#365F91">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#1B2A3A; --ink-2:#4A5A6B; --ink-3:#7A8898;
  --blue:#365F91; --blue-deep:#243F60; --wash:#EAF2F8; --wash-2:#D9EAF7;
  --line:#CFDAE5; --paper:#FFFFFF; --page:#F3F6F9;
  --risk:#9E3A38; --risk-wash:#F8ECEB;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rail:292px; --bar:60px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#E6EDF4; --ink-2:#B3C0CD; --ink-3:#8494A5;
  --blue:#8DB4E2; --blue-deep:#B9D3F0; --wash:#1D2B3A; --wash-2:#243649;
  --line:#33465A; --paper:#141D27; --page:#0E151D;
  --risk:#E39A97; --risk-wash:#3A2224;
}}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--page);color:var(--ink);font:17px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
textarea{resize:none;min-height:88px;overflow:hidden;line-height:1.45}
textarea.big{min-height:180px}

/* ----- top bar ----- */
.bar{position:sticky;top:0;z-index:20;height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar h1{font:600 19px/1.2 var(--serif);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .status{font-size:13px;color:var(--ink-3);white-space:nowrap}
.bar .logo{width:36px;height:36px;border-radius:22.5%;flex:none;display:block}
.credit .logo{width:56px;height:56px;border-radius:22.5%;display:block;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;min-height:44px;font-size:16px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.primary{color:#0E151D} }
.btn.quiet{border-color:transparent;background:transparent;color:var(--blue)}
.btn.danger{color:var(--risk)}
.only-narrow{display:none}

/* ----- case list ----- */
.home{max-width:760px;margin:0 auto;padding:28px 20px 60px}
.home h2{font:600 30px/1.2 var(--serif);margin:8px 0 6px}
.home .lede{color:var(--ink-2);margin:0 0 22px;max-width:60ch}
.cases{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cases li{border-bottom:1px solid var(--line)}
.cases button.open{display:flex;width:100%;text-align:left;gap:16px;align-items:center;padding:16px 4px;background:none;border:0}
.cases .who{flex:1;min-width:0}
.cases .who strong{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cases .who span{font-size:14px;color:var(--ink-3)}
.meter{width:120px;flex:none;font-size:13px;color:var(--ink-3);text-align:right}
.meter i{display:block;height:6px;border-radius:3px;background:var(--wash-2);margin-top:5px;overflow:hidden}
.meter i b{display:block;height:100%;background:var(--blue)}
.empty{padding:36px 4px;color:var(--ink-2)}
.privacy{margin-top:34px;padding:16px 18px;border-left:3px solid var(--blue);background:var(--wash);border-radius:0 8px 8px 0;font-size:15px;color:var(--ink-2)}
.privacy strong{color:var(--ink)}
.home .foot{margin-top:18px;display:flex;justify-content:flex-end}
.bar h1 small{display:block;font:500 12.5px/1.2 var(--sans);color:var(--ink-3);margin-top:2px}
.cases .who .kind{display:block;font-size:13px;font-weight:600;color:var(--blue);margin-bottom:1px}
.cases .who .kind.pn{color:#2F7A6B}
.cases .who .kind.dc{color:#7A4E7E}
.cases .who .kind.mc{color:#8A5A12}
.cases .who .kind.ca{color:#4E5A96}
.cases .who .kind.ho{color:#9E3A38}
.cases .who .kind.sp{color:#2F7A6B}
.refs{background:var(--wash);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin:0 0 22px;font-size:15px;color:var(--ink-2)}
.refs p{margin:4px 0}
.refs .refs-h{font-size:13px;font-weight:600;color:var(--ink-3);margin-top:0}
.lines{display:grid;gap:8px}
.ln{display:flex;align-items:center;gap:10px}
.ln span{width:22px;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cert.splan{font-size:15.5px}
.splan .sp-inst{text-align:center;color:#6B7785;font-size:13px;margin:0 0 4px}
.splan h3{color:#365F91;font-size:28px;margin:6px 0 8px;letter-spacing:0}
.splan .sp-who{text-align:center;margin:0 0 4px}
.splan .sp-review{text-align:center;color:#6B7785;font-size:14px;margin:0}
.splan h4.bar{background:#D9EAF7;color:#1B2A3A;padding:6px 10px;margin:22px 0 4px;font-size:16.5px}
.splan h4.bar span{color:#365F91;margin-right:8px}
.splan .sub{font-style:italic;color:#6B7785;font-size:14px;margin:0 0 4px}
.splan ol.ruled{margin:0;padding-left:26px}
.splan ol.ruled li{border-bottom:1px solid #B7C9DB;padding:8px 0 3px;color:#1B2A3A}
.splan ol.ruled li::marker{color:#365F91;font-weight:700}
.splan ol.ruled.plain{list-style:none;padding-left:0}
.splan .urgent{border-top:2px solid #9E3A38;border-bottom:2px solid #9E3A38;color:#9E3A38;font-weight:700;text-align:center;padding:10px 6px;margin:26px 0 10px}
.splan .sig .lbl2{color:#6B7785;font-size:13px}
.splan .sp-foot{color:#8A96A3;font-size:12px;text-align:center;margin:24px 0 0}
.fit{font-size:14.5px;font-weight:600;color:#2F7A6B;margin:0 0 14px}
.fit.over{color:var(--risk)}
.ptcards{display:grid;gap:16px}
.ptcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ptcard-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ptcard-head strong{font-size:17.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptcard-head span{font-size:14px;color:var(--ink-3)}
.ptgrid{display:grid;grid-template-columns:2fr 1fr 1fr 0.8fr 1.4fr;gap:8px 10px;margin-bottom:10px}
.ptgrid label,.ptareas label{font-size:13.5px;color:var(--ink-2);display:block}
.ptgrid input{margin-top:3px;padding:8px 10px}
.ptareas{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.ptareas small{display:block;font-size:12.5px;color:var(--ink-3)}
.ptareas textarea{margin-top:3px;min-height:56px;padding:8px 10px}
.ptareas label.on textarea{background:var(--wash)}
.pick.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;cursor:pointer}
.pick.checks input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--blue);-webkit-appearance:auto;appearance:auto}
.pick.checks label > span strong{display:block;font-size:16.5px}
.pick.checks label > span span{font-size:14px;color:var(--ink-3)}
.pick.morning{max-height:none}
.hoprev-wrap{overflow-x:auto;margin-bottom:24px}
.hoprev{background:#fff;color:#1B2A3A;border:1px solid var(--line);border-radius:6px;padding:22px 24px;min-width:860px;font:11.5px/1.3 Calibri,Carlito,var(--sans);box-shadow:0 2px 14px rgba(20,40,60,.08)}
.hoprev h3{font-size:16px;color:#365F91;margin:0 0 2px}
.hoprev .who{color:#6B7785;margin:0 0 8px}
.hoprev table{border-collapse:collapse;width:100%;table-layout:fixed}
.hoprev th{background:#D9EAF7;text-align:left;padding:4px 5px;border:1px solid #B7C9DB;vertical-align:bottom}
.hoprev td{border:1px solid #B7C9DB;padding:4px 5px;vertical-align:top;height:58px;word-wrap:break-word}
.hoprev td.pt{background:#EAF2F8}
.starts-label{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);margin:18px 0 -6px}
.starts + .starts-label{margin-top:0}
.warn-box{background:var(--risk-wash);border-left:3px solid var(--risk);padding:10px 12px;border-radius:0 8px 8px 0;color:var(--ink)!important}
.cert table.info{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:14.5px}
.cert table.info th,.cert table.info td{border:1px solid #B7C9DB;padding:6px 10px;text-align:left;vertical-align:top}
.cert table.info th{background:#EAF2F8;width:30%;font-weight:700}
.cert table.meds th{background:#D9EAF7;width:auto}
.cert .tblwrap{overflow-x:auto}
.cert h4{color:#365F91;font-size:16.5px;margin:22px 0 6px}
.cert .lbl{font-weight:700;margin:10px 0 2px}
.cert .txt{margin:0 0 8px;text-align:justify}
.cert{background:#fff;color:#1B2A3A;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(20,40,60,.08);padding:40px 48px;margin:0 0 28px;font:15.5px/1.6 Calibri,Carlito,var(--sans)}
.cert header{text-align:center;border-bottom:2px solid #365F91;padding-bottom:10px}
.cert header .h0{font-weight:700;font-size:19px}
.cert header .h2{font-size:13px;color:#6B7785}
.cert h3{text-align:center;font:700 22px/1.2 Calibri,Carlito,var(--sans);letter-spacing:.04em;margin:30px 0 22px}
.cert .date{text-align:right}
.cert .body{text-align:justify;line-height:1.8}
.cert .dx{margin-left:44px;font-weight:700}
.cert .dx.normal{font-weight:400}
.cert em{color:#9E3A38;font-style:normal;font-weight:600}
.cert .sigs{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px}
.cert .sig{text-align:center;display:flex;flex-direction:column;font-size:14.5px}
.cert .sig .line{border-top:1px solid #1B2A3A;margin-bottom:4px}
.cert .warn{color:#9E3A38;font-weight:600;margin-top:16px}
.starts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 26px}
.starts button{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:84px}
.starts button strong{display:block;font-size:17px;color:var(--blue-deep)}
.starts button span{display:block;font-size:14px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.starts #new{background:var(--blue);border-color:var(--blue)}
.starts #new strong,.starts #new span{color:#fff}
.sheet p.small{font-size:14px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cases .who .kind.pn{color:#7FCBB9} :root:not([data-theme="light"]) .cases .who .kind.dc{color:#D2A6D6} :root:not([data-theme="light"]) .starts #new strong,:root:not([data-theme="light"]) .starts #new span{color:#0E151D} }
.pick{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid var(--line);max-height:44vh;overflow:auto}
.pick li{border-bottom:1px solid var(--line)}
.pick button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 4px;min-height:44px}
.pick button strong{display:block;font-size:16.5px}
.pick button span{font-size:14px;color:var(--ink-3)}
.carry{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 24px;font-size:15px;color:var(--ink-2)}
.carry strong{color:var(--ink)}
.carry .btn{flex:none}
.source{font-size:14px;color:var(--ink-3);margin:-8px 0 20px}
.credit{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-3);line-height:1.5}
.credit p{margin:0}
.credit a{color:var(--blue)}
.sheet p{margin:0 0 12px;color:var(--ink-2)}
.sheet p strong{color:var(--ink)}
.sheet .field{margin-bottom:18px}
.sheet .warn-box{margin:8px 0 0;font-size:14px}
.sheet.wide{max-width:640px}

/* ----- case layout ----- */
.layout{display:grid;grid-template-columns:var(--rail) 1fr;min-height:calc(100% - var(--bar))}
.rail{position:sticky;top:var(--bar);height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:var(--page);padding:10px 0 40px;-webkit-overflow-scrolling:touch}
.rail .grp{font:600 13px/1.3 var(--sans);color:var(--ink-3);padding:14px 18px 4px 18px}
.rail button{display:grid;grid-template-columns:40px 1fr 14px;align-items:center;gap:4px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 14px 9px 15px;font-size:15px;line-height:1.3;color:var(--ink-2)}
.rail button .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:14px}
.rail button.sub{padding-left:27px}
.rail button.cur{background:var(--paper);border-left-color:var(--blue);color:var(--ink);font-weight:600}
.rail button.risk.cur{border-left-color:var(--risk)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dot.on{background:var(--blue);border-color:var(--blue)}
.risk .dot.on{background:var(--risk);border-color:var(--risk)}
.main{padding:26px 34px 80px;max-width:900px;width:100%}
.sec-head{margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--blue)}
.sec-head.risk{border-bottom-color:var(--risk)}
.sec-head .kicker{font-size:14px;color:var(--ink-3);margin:0 0 2px}
.sec-head h2{font:600 28px/1.2 var(--serif);margin:0;color:var(--blue-deep)}
.sec-head.risk h2{color:var(--risk)}
.sec-head p.note{margin:8px 0 0;color:var(--ink-2);font-style:italic}

.field{margin:0 0 24px}
.subhead{font:600 19px/1.25 var(--serif);color:var(--blue-deep);margin:34px 0 14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.subhead.small{font:600 14px/1.3 var(--sans);letter-spacing:.02em;color:var(--blue);background:var(--wash);border:0;border-radius:6px;padding:7px 12px;margin:26px 0 14px}
.risky .subhead{color:var(--risk)}
.field > .lab{display:block;font-weight:600;font-size:16px;margin:0 0 3px}
.field > .hint{display:block;font-size:14px;color:var(--ink-3);margin:0 0 8px}
.field > .lab + input,.field > .lab + textarea,.field > .lab + .chips,.field > .lab + .seg,.field > .lab + .grid{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 15px;min-height:44px;font-size:15.5px;line-height:1.2;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.risky .chip[aria-pressed="true"]{background:var(--risk);border-color:var(--risk)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E151D} }
.score{font-size:14px;color:var(--ink-2);margin-top:8px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:10px 18px;min-height:44px;font-size:15.5px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.risky .seg button[aria-pressed="true"]{background:var(--risk)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E151D} }
.detail{margin-top:10px}
.radios{display:grid;gap:10px}
.radios .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.radios .row > span{width:120px;font-size:15px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.grid.inline{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.grid.long{grid-template-columns:1fr}
.grid label{display:block;font-size:14px;color:var(--ink-2)}
.grid label input,.grid label textarea{margin-top:4px}
.grid textarea{min-height:64px}
.tbl{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--paper)}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;table-layout:fixed}
.tbl th{background:var(--wash-2);font-size:13.5px;font-weight:600;text-align:left;padding:8px 10px;color:var(--ink-2);vertical-align:bottom}
.tbl td{border-top:1px solid var(--line);padding:0;vertical-align:top}
.tbl td + td,.tbl th + th{border-left:1px solid var(--line)}
.tbl textarea{border:0;border-radius:0;min-height:48px;padding:10px;font-size:16px;background:transparent}
.tbl textarea:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.tbl-actions{display:flex;gap:6px;margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.pager .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis}

/* ----- case presentation format: family, labs, formulation grid ----- */
select{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:46px}
select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.fam{display:grid;gap:14px;margin-top:8px}
.famcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.famrow{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:10px}
.famcard label{display:block;font-size:14px;color:var(--ink-2)}
.famcard label input,.famcard label select,.famcard label textarea{margin-top:4px}
.famcard .w1{flex:1 1 90px;max-width:130px}.famcard .w2{flex:2 1 200px}.famcard .full{display:block}
.famcard textarea{min-height:60px}
.seg.sm button{padding:8px 14px;min-height:44px;font-size:15px}
.geno-wrap{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.geno{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:6px 0 8px}
.geno svg{display:block;max-width:100%;height:auto;margin:0 auto}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;margin-top:8px}
.labcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.labcard h4{margin:0 0 8px;font:600 16px/1.3 var(--sans);color:var(--blue-deep)}
.labcard textarea{min-height:64px}
.labgrid{display:grid;grid-template-columns:1.35fr 1fr 1fr 44px;gap:6px 8px;align-items:center}
.labgrid > span{font-size:12.5px;color:var(--ink-3)}
.labgrid input{padding:8px 9px;font-size:16px}
.flag{font-size:12.5px;font-weight:700;color:var(--risk)}
.gridtbl th[scope=row]{background:var(--wash);font-size:14px;width:16%;text-align:left;padding:8px 10px;vertical-align:top;color:var(--ink)}
.gridtbl textarea{border:0;border-radius:0;min-height:64px;padding:10px;font-size:16px;background:transparent}
.gridtbl td{border-left:1px solid var(--line)}
.lnarea{min-height:52px}
.ln{align-items:flex-start}.ln span{padding-top:12px}
@media (max-width:700px){ .labs{grid-template-columns:1fr} }
a.btn{display:inline-flex;align-items:center;text-decoration:none}
/* ----- sheet + toast ----- */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.38);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--paper);border-radius:14px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:22px 24px}
.sheet h3{font:600 22px/1.2 var(--serif);margin:0 0 12px}
.sheet ul{margin:0 0 16px;padding-left:20px}
.sheet li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;z-index:50;font-size:15px;max-width:90vw}

/* ----- narrower iPads / portrait ----- */
@media (max-width:980px){
  .ptgrid{grid-template-columns:1fr 1fr}
  .ptareas{grid-template-columns:1fr}
  .starts{grid-template-columns:1fr 1fr}
  .cert{padding:28px 24px}
  .carry{flex-direction:column;align-items:flex-start}
  .layout{grid-template-columns:1fr}
  .rail{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px));left:0;bottom:0;height:auto;width:min(330px,86vw);z-index:30;transform:translateX(-105%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
  .rail.open{transform:none;visibility:visible;transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.18)}
  .only-narrow{display:inline-block}
  .main{padding:22px 20px 80px}
  .bar .status{display:none}
}
@media (max-width:640px){ .starts{grid-template-columns:1fr} }
@media (max-width:600px){ .bar .hide-sm{display:none} .meter{width:80px} .bar h1{font-size:17px} }
@media (prefers-reduced-motion:reduce){ .rail{transition:none} }

    case 'radio': return !!v || !!str(d[f.id+'__d']);
    case 'radios': case 'parts': return !!v && Object.values(v).some(x=>str(x));
    case 'table': return Array.isArray(v) && v.some(r=>r.some(c=>str(c)));
    case 'patients': return Array.isArray(v) && v.length>0;
    case 'lines': return Array.isArray(v) && v.some(x=>str(x));

  const si = d.si||{}, hi = d.hi||{};
  const siT = Object.keys(si).length ? Object.entries(si).map(([k,v])=>key(k)+' '+lc(v)).join(', ') : '';
  const hiT = Object.keys(hi).length ? Object.entries(hi).map(([k,v])=>key(k)+' '+lc(v)).join(', ') : '';
  const nssiT = d.nssi ? 'NSSI '+lc(d.nssi)+(str(d.nssi__d)?' ('+str(d.nssi__d)+')':'') : '';
  add('Thought content', [j(d.tcChecks), d.delusions, siT, hiT, nssiT]);
  add('Perception', [j(d.percChecks), d.percNarr]);
  const moodT = str(d.mood) ? 'mood '+quoted(d.mood) : '';
  const affT = (d.affectChecks||[]).length ? 'affect '+j(d.affectChecks) : '';
  const cong = d.congruence ? lc(d.congruence)+(str(d.congruence__d)?' ('+str(d.congruence__d)+')':'') : '';
  add('Mood/affect', [moodT, affT, d.affectNarr, cong]);
  const ins = d.insight ? 'insight '+lc(d.insight)+(str(d.insight__d)?' ('+str(d.insight__d)+')':'') : '';
  const jud = d.judgment ? 'judgment '+lc(d.judgment)+(str(d.judgment__d)?' ('+str(d.judgment__d)+')':'') : '';

/* Loose date reader for "Sep 30, 2026", "30 Sep 2026", or "2026-09-30" */
function parseLooseDate(s){
  s=str(s); if(!s) return null;
  const M=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/); if(m && M.includes(m[1].toLowerCase())) return new Date(+m[3],M.indexOf(m[1].toLowerCase()),+m[2]);
  m=s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{4})/); if(m && M.includes(m[2].toLowerCase())) return new Date(+m[3],M.indexOf(m[2].toLowerCase()),+m[1]);
  return null;
}
const SAFETY_CHIPS = ['Suicidal ideation','Homicidal / violent ideation','NSSI'];

/* Build a new progress note from a case or an earlier progress note */
function progressFromSource(src, srcKind, now, author){
  const d = { datetime: now.toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}), author: author || str(src.author) || str(src.interviewer) || '' };
  ['patient','mrn','agesex','location','attending','primaryDx','otherDx'].forEach(k=>{ if(str(src[k])) d[k]=src[k]; });
  const dd = caseDifferential(src); if(dd) d.differential = dd;
  d.admitDate = srcKind==='case' ? str(src.datetime).replace(/,?\s*\d{1,2}:\d{2}.*$/,'') : str(src.admitDate);
  const ad = parseLooseDate(d.admitDate);
  if(ad){ const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()); const n=Math.round((today-ad)/86400000)+1; if(n>=1 && n<1000) d.hday=String(n); }
  const rows = t => (t||[]).filter(r=>r.some(c=>str(c)));
  if(srcKind==='case') d.meds = rows(src.meds).map(r=>[r[0]||'', r[1]||'', '', r[3]||'']);
  else d.meds = rows(src.meds).map(r=>[r[0]||'', r[1]||'', '', r[3]||'']);   // "Change today" starts blank
  d.planTable = rows(src.planTable).map(r=>r.slice(0,4));
  if(srcKind==='pn' && str(src.obs)) d.obs = src.obs;
  const prev = { suicideRisk:src.suicideRisk||'', violenceRisk:src.violenceRisk||'', level: srcKind==='case' ? (src.loc||'') : (src.dispo||'') };
  const lastMSE = {};
  ['appChecks','speechChecks','percChecks','affectChecks','cogChecks'].forEach(k=>{ if((src[k]||[]).length) lastMSE[k]=src[k].slice(); });
  if((src.tcChecks||[]).length) lastMSE.tcChecks = src.tcChecks.filter(x=>!SAFETY_CHIPS.includes(x));
  ['congruence','insight','judgment'].forEach(k=>{ if(src[k]) lastMSE[k]=src[k]; });
  return { data:d, prev, lastMSE };
}
if (typeof module !== 'undefined') module.exports = { PN_SECTIONS, SCHEMAS, parseLooseDate, progressFromSource };

const shortDate = dt => dt.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
function daysBetween(a, b){ const x=parseLooseDate(a), y=parseLooseDate(b); if(!x||!y) return ''; const n=Math.round((y-x)/86400000); return n>=0 && n<5000 ? (n===1?'1 day':n+' days') : ''; }
const hdNum = r => { const n=parseInt(str(r.hday),10); return isNaN(n)?-1:n; };

/* Build a discharge summary from the admission case plus any progress notes */
function dischargeFromSources(caseD, pns, now, author){
  pns = (pns||[]).slice().sort((a,b)=>hdNum(a)-hdNum(b));
  const last = pns[pns.length-1] || null;
  const c = caseD || {};
  const pickv = k => (last && str(last[k])) ? last[k] : (str(c[k]) ? c[k] : '');
  const d = { author: author || (last && str(last.author)) || str(c.interviewer) || '' };
  ['patient','mrn','agesex','location','attending'].forEach(k=>{ const v=pickv(k); if(v) d[k]=v; });
  d.admitDate = (last && str(last.admitDate)) || str(c.datetime).replace(/,?\s*\d{1,2}:\d{2}.*$/,'');
  d.dischargeDate = shortDate(now);
  d.los = daysBetween(d.admitDate, d.dischargeDate);
  if(caseD){
    if(str(c.cc)) d.cc = c.cc;
    if(str(c.hpi)) d.admitSummary = c.hpi;
    if(c.loc==='Inpatient voluntary') d.admitStatus='Voluntary';
    if(c.loc==='Inpatient involuntary') d.admitStatus='Involuntary';
    const r=[c.suicideRisk&&'Suicide risk: '+c.suicideRisk, c.violenceRisk&&'Violence risk: '+c.violenceRisk].filter(Boolean).join('. ');
    const rf = c.riskForm && str(c.riskForm['Overall rationale']);
    if(r||rf) d.admitRisk = [r&&r+'.', rf].filter(Boolean).join(' ');
    const mse = str(c.mseNarr) || draftMSE(c); if(mse) d.admitMSE = mse;
    const dx = [str(c.admitImp) || str(c.primaryDx), caseDifferential(c) && 'Rule out: '+caseDifferential(c).split('\n').join('; ')].filter(Boolean).join('\n'); if(dx) d.admitDx = dx;
    if(str(c.course)) d.course = c.course;
    const lab = extText({t:'labs', id:'labPanels'}, c); if(lab) d.keyResults = lab;
    if(str(c.safetyPlan)) d.safetyPlan = c.safetyPlan;
    if(str(c.medhx)) d.medicalDx = c.medhx;
  }
  const fd = pickv('primaryDx'); if(fd) d.finalDx = fd;
  const od = pickv('otherDx'); if(od) d.otherDx = od;
  const rows = t => (t||[]).filter(r=>r.some(x=>str(x)));
  const medSrc = last ? rows(last.meds) : rows(c.meds);
  d.dcMeds = medSrc.map(r=>[r[0]||'', r[1]||'', '', '']);
  const prev = { suicideRisk: pickv('suicideRisk'), violenceRisk: pickv('violenceRisk') };
  const lastMSE = last ? (str(last.mseNarr) || draftMSE(last)) : '';
  const courseNotes = pns.map(p=>({ hday:str(p.hday), date:str(p.datetime).replace(/,?\s*\d{1,2}:\d{2}.*$/,''), changes:str(p.changes), assessment:str(p.assessment), risk:p.suicideRisk||'', dispo:p.dispo||'' }));
  return { data:d, prev, lastMSE, courseNotes };
}

/* One line per progress note, oldest first, for the resident to edit */
function draftCourse(notes){
  const first = s => { s=str(s); const m=s.match(/^.*?[.!?](\s|$)/); return (m?m[0]:s).trim(); };
  return (notes||[]).map(n=>{
    const head = (n.hday?'Hospital day '+n.hday:'Progress note')+(n.date?' ('+n.date+')':'')+': ';
    const bits = [first(n.assessment), n.changes && endDot(n.changes), n.risk && 'Suicide risk '+n.risk.toLowerCase()+'.', n.dispo && n.dispo+'.'].filter(Boolean);
    return bits.length ? head+bits.join(' ') : '';
  }).filter(Boolean).join('\n');
}

const normName = s => str(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

/* Pre-fill a certificate from a case, progress note, or discharge summary */
function certFromSource(src, kind, now, last){
  last = last || {};
  const d = { certDate: shortDate(now), instName:last.instName||'', instDept:last.instDept||'Department of Psychiatry', instAddress:last.instAddress||'',
    resTitle:last.resTitle||'Resident Physician', attTitle:last.attTitle||'Attending Physician' };
  if(src){
    d.patientName = splitPatient(src.patient).name;
    Object.assign(d, splitAgeSex(src.agesex));
    if(str(src.marital)) d.civil = src.marital;
    const dateOnly = s => str(s).replace(/,?\s*\d{1,2}:\d{2}.*$/,'');
    if(kind==='dc'){ d.setting='Inpatient'; d.admitDate=str(src.admitDate); d.dischargeDate=str(src.dischargeDate); }
    else if(kind==='pn'){ d.setting='Inpatient'; d.admitDate=str(src.admitDate); }
    else if(kind==='case'){
      if(/^Inpatient/.test(src.loc||'')){ d.setting='Inpatient'; d.admitDate=dateOnly(src.datetime); }
      else if(src.loc==='Outpatient'){ d.setting='Outpatient'; d.consultDates=dateOnly(src.datetime); }
    }
    d.diagnosis = str(kind==='dc' ? src.finalDx : src.primaryDx);
    d.resName = str(src.author) || str(src.interviewer);
    d.attName = str(src.attending);
  }
  const lic = last.lic || {};
  if(d.resName && lic[normName(d.resName)]) d.resLic = lic[normName(d.resName)];
  if(d.attName && lic[normName(d.attName)]) d.attLic = lic[normName(d.attName)];
  return d;
}

/* Shared by certificates and abstracts */
function headerOf(d){ return [str(d.instName), str(d.instDept), str(d.instAddress)]; }
function signersOf(d){
  const s=[];
  if(str(d.resName)) s.push({name:str(d.resName), title:str(d.resTitle)||'Resident Physician', lic:str(d.resLic)});
  if(str(d.attName)) s.push({name:str(d.attName), title:str(d.attTitle)||'Attending Physician', lic:str(d.attLic)});
  return s;
}
/* Records from before the name and MRN had separate fields kept both in "Name / MRN" */
function splitLegacyPatient(d){
  if(!d || typeof d!=='object' || str(d.mrn) || !/[\/|]|\bMRN\b/i.test(str(d.patient))) return d;
  const sp=splitPatient(d.patient); d.patient=sp.name; if(sp.mrn) d.mrn=sp.mrn; return d;
}
const normMRN = s => str(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
/* Same patient: the MRN decides when both records have one; otherwise the name, in any word order */
function samePt(a, b){
  a=a||{}; b=b||{};
  const ma=normMRN(a.mrn), mb=normMRN(b.mrn); if(ma && mb) return ma===mb;
  const n = x => str(x).toLowerCase().replace(/[^a-z0-9ñ]+/g,' ').trim().split(' ').filter(Boolean).sort().join(' ');

  function run(r){
    const pr = (r.b?'<w:b/>':'')+(r.i?'<w:i/>':'')+(r.color?`<w:color w:val="${r.color}"/>`:'')+(r.sz?`<w:sz w:val="${r.sz}"/><w:szCs w:val="${r.sz}"/>`:'')+(r.u?'<w:u w:val="single"/>':'');
    const lines = String(r.text).split(/\r?\n/);
    return lines.map((ln,k)=>`<w:r>${pr?`<w:rPr>${pr}</w:rPr>`:''}${k?'<w:br/>':''}<w:t xml:space="preserve">${esc(ln)}</w:t></w:r>`).join('');
  }
  // para: {runs:[], style, align, after, before, keepNext}
  function para(p){
    const pp = (p.style?`<w:pStyle w:val="${p.style}"/>`:'')+(p.keepNext?'<w:keepNext/>':'')+
      ((p.after!=null||p.before!=null)?`<w:spacing w:before="${p.before||0}" w:after="${p.after||0}"/>`:'')+(p.align?`<w:jc w:val="${p.align}"/>`:'');
    return `<w:p>${pp?`<w:pPr>${pp}</w:pPr>`:''}${(p.runs||[]).map(run).join('')}</w:p>`;
  }
  const borders = `<w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:space="0" w:color="${C.line}"/>`).join('')}</w:tblBorders>`;
  function cell(width, paras, fill){
    return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:''}</w:tcPr>${paras.map(p=>para({after:0,...p})).join('')}</w:tc>`;

  function table(widths, rows){ // rows: [{cells:[{paras,fill}], header}]
    const total = widths.reduce((a,b)=>a+b,0);
    return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/>${borders}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="70" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="70" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
      `<w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`+
      rows.map(r=>`<w:tr>${r.header?'<w:trPr><w:tblHeader/></w:trPr>':''}${r.cells.map((c,i)=>cell(widths[i], c.paras, c.fill)).join('')}</w:tr>`).join('')+`</w:tbl>`;

  const spacer = () => para({after:60, runs:[]});
  const W_IMG = W+' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const EMU = 914400;
  function imageRun(rid, wIn, hIn, id, name){

      `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;

  // A picture floating beside the text (the letterhead logos), positioned from the column and paragraph like the hospital's file
  function anchorRun(rid, sizeIn, xEmu, yEmu, id, name){

      `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${c}" cy="${c}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing></w:r>`;

  // Genogram size on the page: half an inch per symbol, at most maxW wide and 7 inches tall
  const genoSize = (g, maxW) => { let w=g.wIn*0.5, h=g.hIn*0.5; const k=Math.min(1, maxW/w, 7/h); return { w:w*k, h:h*k }; };
  const b64bytes = s => { const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };

  /* Turn one field's value into cell paragraphs (or null when empty) */
  function valueParas(f, d){
    if(!isFilled(f,d)) return null;
    const v = d[f.id];
    switch(f.t){
      case 'text': case 'area': return [{runs:[{text: f.quote ? quoted(v) : str(v)}]}];

  /* Tables for the newer field types in the app-format export */
  const headRow = cols => ({header:true, cells:cols.map(h=>({fill:C.thead, paras:[{runs:[{text:h,b:true,sz:18}]}]}))});
  const plainCell = (t, extra) => ({paras:[{runs:[{text:str(t), ...(extra||{})}]}]});
  function famTable(d){
    const cols=['Name','Relationship','Age','Status','Condition / illness','Description'], widths=[1500,1750,700,1950,1700,3056];
    const rows=[headRow(cols)];
    famMembers(d).forEach(m=>{ const ri=relInfo(m.rel);
      const rel = str(m.rel) + (!ri.sex && m.sex ? ' ('+m.sex+')' : '');
      const st = [m.status||'Living', m.psych && 'psychiatric condition', m.withPt && 'lives with patient'].filter(Boolean).join('; ');
      rows.push({cells:[plainCell(m.name), plainCell(rel), plainCell(m.age), plainCell(st), plainCell(m.cond), plainCell(m.desc)]}); });

  function labTable(d){

      else x.rows.forEach(r=>rows.push({cells:[plainCell(x.panel.name), plainCell(r.test), plainCell(r.value+(r.flag?' ('+r.flag+')':''), r.flag?{b:true, color:'C00000'}:null), plainCell(r.range)]}));

  }

  function buildDocument(d, kind, ex){
    ex = ex || {};
    const sch = SCHEMAS[kind||'case'];
    const body=[];
    body.push(para({style:'Title', runs:[{text:sch.title}]}));
    const sub = (kind==='dc'
      ? [str(d.patient), str(d.mrn)&&'MRN '+str(d.mrn), str(d.admitDate)&&'Admitted '+str(d.admitDate), str(d.dischargeDate)&&'Discharged '+str(d.dischargeDate)]
      : [str(d.patient), str(d.mrn)&&'MRN '+str(d.mrn), str(d.datetime), (kind==='pn' && str(d.hday)) ? 'Hospital day '+str(d.hday) : '']).filter(Boolean).join('  |  ');
    if(sub) body.push(para({align:'center', after:200, runs:[{text:sub, color:C.grey, sz:20}]}));
    let lastGroup = null;
    sch.sections.forEach(s=>{
      if(s.group && s.group!==lastGroup){
        body.push(para({style:'Heading1', runs:[{text:s.num.replace(/[A-Z]$/,'')+'. '+s.group}]}));
        if(s.groupNote) body.push(para({after:60, runs:[{text:s.groupNote, i:true, color:C.grey, sz:18}]}));

      lastGroup = s.group || null;
      const num = s.group ? s.num+'.' : (s.num==='A' ? 'A.' : s.num+'.');
      body.push(para({style: s.group ? 'Heading2' : 'Heading1', runs:[{text:num+' '+s.title, color: s.risk ? C.risk : undefined}]}));
      let kv=[]; let any=false;

          body.push(f.t==='family' ? famTable(d) : f.t==='labs' ? labTable(d) : gridTable(f,d)); body.push(spacer());
          if(f.t==='family' && ex.geno){ const z=genoSize(ex.geno, 6.2);
            body.push(para({keepNext:true, before:120, after:60, runs:[{text:'Genogram', b:true, sz:20}]}));
            body.push(`<w:p><w:pPr><w:keepNext/><w:jc w:val="center"/></w:pPr>${imageRun('rIdGeno', z.w, z.h, 101, 'Genogram')}</w:p>`);
            body.push(para({align:'center', after:120, runs:[{text:GENO_LEGEND, i:true, color:C.grey, sz:16}]})); }
          return;
        }
        if(f.t==='table'){
          const rows = (d[f.id]||[]).filter(r=>r.some(c=>str(c)));
          if(!rows.length) return;
          flush(); any=true;
          body.push(para({keepNext:true, after:60, runs:[{text:f.label, b:true, sz:20}]}));
          const n=f.c.length, w=Math.floor(TEXT_W/n), widths=f.c.map((_,i)=> i<n-1 ? w : TEXT_W - w*(n-1));
          const trs=[{header:true, cells:f.c.map(h=>({fill:C.thead, paras:[{runs:[{text:h,b:true,sz:18}]}]}))}];
          rows.forEach(r=>trs.push({cells:f.c.map((_,i)=>({paras:[{runs:[{text:str(r[i]||'')}]}]}))}));

          return;
        }
        const vp = valueParas(f,d);
        if(!vp) return;
        any=true;
        kv.push({cells:[{fill:C.label, paras:[{runs:[{text:f.label, b:true}]}]},{paras:vp}]});
      });
      flush();
      if(!any) body.push(para({after:120, runs:[{text:'Not documented.', i:true, color:C.grey}]}));
    });
    const sect = `<w:sectPr><w:footerReference w:type="default" r:id="rId2"/><w:pgSz w:w="${PAGE_W}" w:h="15840"/><w:pgMar w:top="864" w:right="${MAR}" w:bottom="864" w:left="${MAR}" w:header="432" w:footer="432" w:gutter="0"/></w:sectPr>`;

  }

  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W}>
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="en-US"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="252" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="60"/><w:jc w:val="center"/></w:pPr><w:rPr><w:b/><w:color w:val="1B2A3A"/><w:sz w:val="30"/><w:szCs w:val="30"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:keepLines/><w:spacing w:before="280" w:after="80"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:color w:val="${C.head}"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:keepLines/><w:spacing w:before="180" w:after="60"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:color w:val="${C.head}"/><w:sz w:val="21"/><w:szCs w:val="21"/></w:rPr></w:style>
</w:styles>`;
  const FOOTER = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${W}><w:p><w:pPr><w:jc w:val="center"/></w:pPr>`+
    `<w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr><w:t xml:space="preserve">Confidential patient information  |  Page </w:t></w:r>`+
    `<w:fldSimple w:instr=" PAGE "><w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr><w:t>1</w:t></w:r></w:fldSimple>`+
    `<w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr><w:t xml:space="preserve"> of </w:t></w:r>`+
    `<w:fldSimple w:instr=" NUMPAGES "><w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr><w:t>1</w:t></w:r></w:fldSimple></w:p></w:ftr>`;
  const CT = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const RELS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const DOCRELS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>`;

  /* ---- Case presentation protocol in the hospital's format (A4, Arial 12, underlined headings) ---- */
  const PW = 11909, PH = 16834, PML = 1440, PTW = PW - 2*PML;   // A4; text width 9029
  function buildProtocol(d, ex){
    ex = ex || {};
    const SZ = 24, B = [], nums = [];
    const v = k => str(d[k]);
    // one paragraph: runs [{text,b,i,u,color,sz}], options: align, ind:{left,firstLine,hanging}, before, after, keepNext, num:{id}
    const P = (runs, o={}) => {
      const ind = o.ind ? `<w:ind${o.ind.left!=null?` w:left="${o.ind.left}"`:''}${o.ind.firstLine!=null?` w:firstLine="${o.ind.firstLine}"`:''}${o.ind.hanging!=null?` w:hanging="${o.ind.hanging}"`:''}/>` : '';
      const ppr = (o.keepNext?'<w:keepNext/>':'')+(o.num?`<w:numPr><w:ilvl w:val="0"/><w:numId w:val="${o.num}"/></w:numPr>`:'')+
        `<w:spacing w:before="${o.before||0}" w:after="${o.after||0}" w:line="259" w:lineRule="auto"/>`+ind+(o.align?`<w:jc w:val="${o.align}"/>`:'');
      return `<w:p><w:pPr>${ppr}</w:pPr>${runs.filter(r=>r && r.text!=null && r.text!=='').map(r=>run({sz:SZ, ...r})).join('')}</w:p>`;
    };
    const T = (t, o) => ({ text:t, ...(o||{}) });
    const H = t => B.push(P([T(t+':', {b:true, u:true})], { before:240, keepNext:true }));
    const sub = t => B.push(P([T(t, {u:true})], { before:120, keepNext:true }));
    // narrative: one paragraph per line, justified, first line indented
    const N = (text, o={}) => { str(text).split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(line=>B.push(P([T(line, o.run)], { align:o.align||'both', ind: o.ind || { firstLine:720 } }))); };
    const labelled = (label, text) => { if(str(text)) B.push(P([T(label+' ', {b:true}), T(str(text))], { align:'both', ind:{ left:720 } })); };
    const bullets = (items, o={}) => items.map(str).filter(Boolean).forEach(t=>B.push(P(o.bold ? [T(t,{b:true})] : [T(t)], { num:1, ind:{ left:720, hanging:360 }, align:'both' })));
    const numbered = items => { const list=items.map(str).filter(Boolean); if(!list.length) return; const id = 2 + nums.length; nums.push(id); list.forEach(t=>B.push(P([T(t)], { num:id, ind:{ left:720, hanging:360 } }))); };
    const radioTxt = k => [d[k], str(d[k+'__d'])].filter(Boolean).join('. ');
    const partsTxt = (k, keys) => { const o=d[k]||{}; return (keys||Object.keys(o)).filter(x=>str(o[x])).map(x=>x+': '+str(o[x])).join('; '); };
    // tables: rows of cells { paras (xml), fill, w } with black single borders
    const tbl = (widths, rows, o={}) => {
      const bd = o.noBorder ? `<w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="nil"/>`).join('')}</w:tblBorders>`
                            : `<w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('')}</w:tblBorders>`;
      const total = widths.reduce((a,b)=>a+b,0);
      return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/>${o.center?'<w:jc w:val="center"/>':''}${bd}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="40" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
        `<w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`+
        rows.map(r=>`<w:tr>${r.header?'<w:trPr><w:tblHeader/></w:trPr>':''}${r.cells.map((c,i)=>`<w:tc><w:tcPr><w:tcW w:w="${widths[i]}" w:type="dxa"/>${c.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${c.fill}"/>`:''}${c.vc?'<w:vAlign w:val="center"/>':''}</w:tcPr>${c.paras || P([])}</w:tc>`).join('')}</w:tr>`).join('')+`</w:tbl>`;
    };
    const cellBullets = (items, sz) => { const list=items.map(str).filter(Boolean); return list.length ? list.map(t=>P([T(t,{sz:sz||SZ})], { num:1, ind:{ left:360, hanging:270 } })).join('') : P([T('',{})]); };

  /* ---- ZIP (stored, no compression) ---- */
  const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  const crc32 = b => { let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  function zip(files){
    const enc = new TextEncoder(), now=new Date();
    const dtime = (now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
    const ddate = ((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
    const chunks=[], central=[]; let off=0;
    for(const [name, text] of files){
      const nb=enc.encode(name), db=typeof text==='string' ? enc.encode(text) : text, crc=crc32(db);
      const h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
      h.setUint16(10,dtime,true); h.setUint16(12,ddate,true); h.setUint32(14,crc,true); h.setUint32(18,db.length,true); h.setUint32(22,db.length,true);
      h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
      chunks.push(new Uint8Array(h.buffer), nb, db);
      const c=new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
      c.setUint16(12,dtime,true); c.setUint16(14,ddate,true); c.setUint32(16,crc,true); c.setUint32(20,db.length,true); c.setUint32(24,db.length,true);
      c.setUint16(28,nb.length,true); c.setUint32(42,off,true);
      central.push(new Uint8Array(c.buffer), nb);
      off += 30+nb.length+db.length;
    }
    const csize = central.reduce((a,b)=>a+b.length,0);
    const e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);
    const all=[...chunks,...central,new Uint8Array(e.buffer)], out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));
    let p=0; for(const a of all){ out.set(a,p); p+=a.length; }
    return out;
  }

      (o.ind?`<w:ind w:left="${o.ind}"/>`:'')+(o.align?`<w:jc w:val="${o.align}"/>`:'');

          if(typeof DecompressionStream==='undefined') throw new Error('old-ios');
          const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          return dec.decode(await new Response(stream).arrayBuffer());
        }
        throw new Error('unsupported');
      }
      p += 46+nlen+xlen+clen;
    }
    throw new Error('not-docx');
  }

  const kids = (el, tag) => Array.from(el.childNodes).filter(n=>n.nodeType===1 && n.namespaceURI===NS && n.localName===tag);
  function paraText(p){
    let t=''; const walk=n=>{ for(const c of n.childNodes){ if(c.nodeType!==1) continue;
      if(c.namespaceURI===NS){ if(c.localName==='t') t+=c.textContent; else if(c.localName==='br'||c.localName==='cr') t+='\n'; else if(c.localName==='tab') t+='\t'; else if(c.localName==='delText') continue; else walk(c); } } };
    walk(p); return t;
  }
  function cellText(tc){ const ps=[]; const walk=n=>{ for(const c of n.childNodes){ if(c.nodeType!==1||c.namespaceURI!==NS) continue; if(c.localName==='p') ps.push(paraText(c)); else if(c.localName!=='tcPr') walk(c); } }; walk(tc); return ps.join('\n').trim(); }
  const rowsOf = tbl => { const out=[]; const walk=n=>{ for(const c of n.childNodes){ if(c.nodeType!==1||c.namespaceURI!==NS) continue; if(c.localName==='tr') out.push(c); else if(c.localName==='sdt'||c.localName==='sdtContent') walk(c); } }; walk(tbl); return out; };
  const cellsOf = tr => { const out=[]; const walk=n=>{ for(const c of n.childNodes){ if(c.nodeType!==1||c.namespaceURI!==NS) continue; if(c.localName==='tc') out.push(cellText(c)); else if(c.localName==='sdt'||c.localName==='sdtContent') walk(c); } }; walk(tr); return out; };

  /* Split "Key: value; Key2: value" using the known keys only */
  function splitKeys(text, keys){
    const hits=[];
    keys.forEach(k=>{ const re=new RegExp('(^|\\n|;\\s*)'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*:\\s*','gi'); let m;
      while((m=re.exec(text))){ hits.push({k, at:m.index, start:m.index+m[0].length}); } });
    hits.sort((a,b)=>a.at-b.at);
    const out={}; hits.forEach((h,i)=>{ const end = i+1<hits.length ? hits[i+1].at : text.length; const v=text.slice(h.start,end).replace(/[;\s]+$/,'').trim(); if(v && !(h.k in out)) out[h.k]=v; });
    return out;
  }
  const pick = (opts, s) => opts.find(o=>norm(o)===norm(s));

  function parseValue(f, text, d, miss){
    const label=f.label;
    switch(f.t){
      case 'text': case 'area': {
        let v=text; if(f.quote) v=v.replace(/^[“"]\s*/,'').replace(/\s*[”"]$/,'');
        d[f.id]=v; return; }
      case 'checks': {
        const body=text.replace(/^\s*\d+\s*\/\s*\d+\s*positive\s*:?\s*/i,'');
        const got=[]; body.split(/\s*[,;\n]\s*/).filter(Boolean).forEach(x=>{ const o=pick(f.o,x); if(o){ if(!got.includes(o)) got.push(o); } else miss.push(label+': '+x); });
        d[f.id]=f.o.filter(o=>got.includes(o)); return; }
      case 'radio': {
        let rest=text.trim(), v=null;
        for(const o of [...f.o].sort((a,b)=>b.length-a.length)){ if(norm(rest).startsWith(norm(o))){ const after=rest.slice(o.length); if(!after.trim() || /^\s*[.;,]/.test(after)){ v=o; rest=after.replace(/^\s*[.;,]\s*/,''); break; } } }
        if(f.detail){ const re=new RegExp('^'+f.detail.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['’]")+'\\s*:\\s*','i'); rest=rest.replace(re,''); }
        if(v) d[f.id]=v;
        if(rest.trim()){ if(f.detail) d[f.id+'__d']=rest.trim(); else miss.push(label+': '+rest.trim()); }
        return; }
      case 'radios': {
        const m=splitKeys(text, f.p.map(x=>x[0])), o={};
        f.p.forEach(([k,opts])=>{ if(m[k]){ const v=pick(opts,m[k]); if(v) o[k]=v; else miss.push(label+', '+k+': '+m[k]); } });
        d[f.id]=o; return; }
      case 'lines': d[f.id] = text.split('\n').map(x=>x.replace(/^\s*\d+\.\s*/,'').trim()).filter(Boolean); return;
      case 'parts': {
        const m=splitKeys(text, f.p), o={}; f.p.forEach(k=>{ if(m[k]) o[k]=m[k]; });
        if(!Object.keys(o).length && text.trim()) miss.push(label+': '+text.trim());
        d[f.id]=o; return; }
    }
  }

  /* Certificates carry a hidden copy of their data in the document properties */
  async function embedded(buf){
    let xml; try{ xml = await readPart(buf, 'docProps/custom.xml'); }catch(e){ return null; }
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const props = {}; Array.from(doc.getElementsByTagName('*')).filter(n=>n.localName==='property').forEach(p=>{ props[p.getAttribute('name')] = p.textContent; });
    if(!props.CaseAppKind || !SCHEMAS[props.CaseAppKind]) return null;
    const json = Object.keys(props).filter(k=>/^CaseAppData\d+$/.test(k)).sort().map(k=>props[k]).join('');
    let data; try{ data = JSON.parse(json); }catch(e){ return null; }
    let edited = false;
    try{ const docXml = await readPart(buf, 'word/document.xml'); edited = !!props.CaseAppPrint && DocxGen.textPrint(docXml)!==props.CaseAppPrint; }catch(e){}
    splitLegacyPatient(data); (data.rows||[]).forEach(splitLegacyPatient);
    return { kind:props.CaseAppKind, layout:props.CaseAppLayout||'', data, filled:Object.keys(data).length, missed:[], edited };
  }
  /* Handover: read the printed table (it may have been typed into in Word); the hidden copy supplies what the table doesn't show */
  async function handoverFrom(buf, emb){
    let xml; try{ xml = await readPart(buf, 'word/document.xml'); }catch(e){ return emb; }
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const tbl = Array.from(doc.getElementsByTagNameNS(NS,'tbl')).map(t=>rowsOf(t).map(cellsOf)).find(rs=>rs.length && norm(rs[0][0])==='patient' && rs[0].length===HO_COLS.length);
    const base = emb ? emb.data : {};
    if(!tbl) return emb ? {...emb, edited:false} : null;
    const old = base.rows || [], used = new Set();
    const rows = tbl.slice(1).filter(r=>r.some(c=>c.trim())).map((cells, i)=>{
      const lines = cells[0].split('\n').map(x=>x.trim()).filter(Boolean);
      const first = lines[0]||'', mm = first.match(/^(.*?)\s+MRN[:#\s]*(\S+)\s*$/i);
      const name = mm ? mm[1].trim() : first, mrn = mm ? mm[2] : '';
      let prev = old.findIndex((o,j)=>!used.has(j) && samePt(o, {patient:name, mrn})); if(prev<0 && old[i] && !used.has(i)) prev=i;
      const r = prev>=0 ? {...old[prev]} : {key:'', agesex:'', ward:'', hday:'', admitDate:''};
      if(prev>=0) used.add(prev);
      r.patient = name; if(mrn) r.mrn = mrn;
      if(prev<0){
        const l2=(lines[1]||'').split(/\s*\|\s*/), l3=lines[2]||'';
        l2.forEach(x=>{ if(/^\d+\s*\/\s*[a-z]/i.test(x)) r.agesex=x; else if(x) r.ward=x; });
        const hd=l3.match(/HD\s*(\d+)/i); if(hd) r.hday=hd[1];
        const ad=l3.match(/Adm\.?\s*([^|]+)/i); if(ad) r.admitDate=ad[1].trim();
      }
      HO_COLS.slice(1).forEach((c,k)=>{ r[c.k] = cells[k+1]||''; });
      return r;
    });
    const data = {...base, rows};
    if(!emb){
      const ps = Array.from(doc.getElementsByTagNameNS(NS,'p')).slice(0,3).map(paraText);
      const head = ps[0]||'', who = ps[1]||'';
      const hp = head.split(/\s*\|\s*/); if(hp[1]) data.unit=hp[1]; if(hp[2]) data.hoDate=hp[2];
      const grab = re => { const m=who.match(re); return m?m[1].trim():''; };
      data.fromRes = grab(/Handing over:\s*(.*?)(?=\s{2,}|$)/); data.toRes = grab(/Receiving:\s*(.*?)(?=\s{2,}|$)/); data.attOnCall = grab(/Attending on call:\s*(.*?)(?=\s{2,}|$)/);
    }
    return { kind:'ho', data, filled:rows.length, missed:[], edited:false };
  }
  async function fileToData(file){
    const buf = await file.arrayBuffer();
    const emb = await embedded(buf);
    if(emb && emb.kind==='ho') return await handoverFrom(buf, emb);
    if(emb && emb.kind==='case' && emb.edited && emb.layout==='form'){
      const seen = await readVisible(buf);
      if(seen && seen.kind==='case') return { kind:'case', data:{ ...emb.data, ...seen.data }, filled:seen.filled, missed:seen.missed, edited:false };
    }
    if(emb) return emb;
    return await readVisible(buf);
  }
  async function readVisible(buf){
    const xml = await readPart(buf, 'word/document.xml');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const body = doc.getElementsByTagNameNS(NS,'body')[0]; if(!body) throw new Error('not-docx');
    const firstText = Array.from(doc.getElementsByTagNameNS(NS,'p')).slice(0,8).map(paraText).join(' ');
    if(/^\s*on-call handover/i.test(firstText)){ const r=await handoverFrom(buf, null); if(r) return r; }
    if(/medical certificate|clinical abstract|my safety plan|case presentation protocol/i.test(firstText)) throw new Error('letter-stripped');
    const kind = /discharge summary/i.test(firstText) ? 'dc' : /progress note/i.test(firstText) ? 'pn' : 'case';
    const SECS = SCHEMAS[kind].sections;
    const d={}, miss=[]; let sec=null, filled=0;
    const tableFields=[]; SECS.forEach(s=>s.fields.forEach(f=>{ if(f.t==='table') tableFields.push(f); }));
    const findField = label => {
      const L=norm(label); if(!L) return null;
      const ok = f => f.t!=='table' && f.t!=='sub' && (norm(f.label)===L || (f.alias||[]).some(a=>norm(a)===L));
      if(sec){ const f=sec.fields.find(ok); if(f) return f; }
      for(const s of SECS){ const f=s.fields.find(f=>f.t!=='table' && f.t!=='sub' && norm(f.label)===L); if(f) return f; }
      for(const s of SECS){ const f=s.fields.find(ok); if(f) return f; }
      return null;
    };
    const handleP = p => {
      const t=paraText(p).trim(); const m=t.match(/^(A|B|\d{1,2}[A-G]?)\.\s+(.+)$/); if(!m) return;
      // Sections were renumbered to follow the hospital's format, so match the title first
      const byTitle = SECS.find(s=>norm(s.title)===norm(m[2]));
      if(byTitle){ sec=byTitle; return; }
      if(kind==='case' && SECS.some(s=>s.group && norm(s.group)===norm(m[2]))) return;
      const s = kind==='case' ? null : SECS.find(s=>s.num===m[1]);
      const ps=p.getElementsByTagNameNS(NS,'pStyle')[0]; const style=ps ? (ps.getAttributeNS(NS,'val')||ps.getAttribute('w:val')||'') : '';
      if(s && (/heading/i.test(style) || norm(m[2]).startsWith(norm(s.title).slice(0,8)))) sec=s;
      else if(!s && /^\d+$/.test(m[1]) && t.length<60) sec=null;
    };
    const handleTbl = tbl => {
      const rows=rowsOf(tbl).map(cellsOf); if(!rows.length) return;
      const head = rows[0].map(norm);
      if(kind==='case' && head[0]==='name' && head[1]==='relationship'){
        d.family = rows.slice(1).filter(r=>r.some(c=>c.trim())).map(r=>{
          const relRaw=(r[1]||'').trim(), sx=relRaw.match(/\((Male|Female)\)\s*$/i), rel=relRaw.replace(/\s*\((Male|Female)\)\s*$/i,'');
          const st=norm(r[3]||''); const m={ name:(r[0]||'').trim(), rel, age:(r[2]||'').trim(), status: /deceased/.test(st)?'Deceased':'Living', cond:(r[4]||'').trim(), desc:(r[5]||'').trim() };
          if(/psychiatric/.test(st)) m.psych=true; if(/lives with/.test(st)) m.withPt=true; if(sx) m.sex=sx[1][0].toUpperCase()+sx[1].slice(1).toLowerCase();
          return m; });
        filled++; return;
      }
      if(kind==='case' && head[0]==='panel' && head[1]==='test'){
        const L={};
        rows.slice(1).forEach(r=>{ const p=LAB_PANELS.find(x=>norm(x.name)===norm(r[0])); if(!p) return;
          if(p.text){ L[p.id]=(r[2]||'').trim(); return; }
          if(!Array.isArray(L[p.id])) L[p.id]=(p.tests||[]).map(([t,rg])=>[t,'',rg]);
          const val=(r[2]||'').replace(/\s*\((H|L)\)\s*$/,'').trim(), i=L[p.id].findIndex(x=>norm(x[0])===norm(r[1]));
          if(i>=0){ L[p.id][i][1]=val; if((r[3]||'').trim()) L[p.id][i][2]=(r[3]||'').trim(); } else L[p.id].push([(r[1]||'').trim(), val, (r[3]||'').trim()]); });
        d.labPanels=L; filled++; return;
      }
      const gf = kind==='case' && SECS.flatMap(s=>s.fields).find(f=>f.t==='grid' && rows[0].length===f.cols.length+1 && f.cols.every((c,i)=>norm(c)===head[i+1]));
      if(gf){ const g={}; rows.slice(1).forEach(r=>{ const rl=gf.rows.find(x=>norm(x)===norm(r[0])); if(rl) gf.cols.forEach((c,i)=>{ if((r[i+1]||'').trim()) g[rl+'|'+c]=r[i+1].trim(); }); }); d[gf.id]=g; filled++; return; }
      const tf=tableFields.find(f=>norm(rows[0][0])===norm(f.c[0]) && rows[0].length===f.c.length);
      if(tf){
        const data=rows.slice(1).map(r=>tf.c.map((_,i)=>r[i]||'')).filter(r=>r.some(c=>c.trim()));
        if(data.length){ while(data.length<tf.rows) data.push(tf.c.map(()=>'')); d[tf.id]=data; filled++; }
        return;
      }
      rows.forEach(r=>{
        if(r.length<2) return;
        if(norm(r[0])==='patient / mrn'){ const v=r.slice(1).join(' ').trim(); if(v){ const sp=splitPatient(v); d.patient=sp.name; if(sp.mrn) d.mrn=sp.mrn; filled++; } return; }
        const f=findField(r[0]); const val=r.slice(1).join('\n').trim();
        if(!f){ if(val) miss.push((r[0]||'(no label)')+': '+val); return; }
        if(!val) return;
        parseValue(f, val, d, miss); filled++;
      });
    };
    const walk = n => { for(const c of n.childNodes){ if(c.nodeType!==1||c.namespaceURI!==NS) continue;
      if(c.localName==='p') handleP(c); else if(c.localName==='tbl') handleTbl(c); else if(c.localName==='sdt'||c.localName==='sdtContent') walk(c); } };
    walk(body);
    splitLegacyPatient(d);
    return { kind, data:d, filled, missed:miss };
  }
  return { fileToData };
})();

  /* ----- handover ----- */
  function patientGroups(){
    const groups = [];
    Object.values(store.cases).filter(c=>['case','pn','dc'].includes(c.kind) && str(c.data.patient)).forEach(c=>{
      let g = groups.find(g=>g.recs.some(x=>samePt(x.data, c.data))); if(!g){ g={patient:c.data.patient, mrn:str(c.data.mrn), recs:[]}; groups.push(g); } g.recs.push(c); if(!g.mrn && str(c.data.mrn)) g.mrn=str(c.data.mrn); });
    return groups.map(g=>{
      const latest = newest(g.recs,'pn') || newest(g.recs,'case');
      const discharged = g.recs.some(c=>c.kind==='dc');
      const outpatient = !g.recs.some(c=>c.kind==='pn') && latest && latest.kind==='case' && latest.data.loc==='Outpatient';
      return {patient:g.patient, mrn:g.mrn, latest, active: !!latest && !discharged && !outpatient};
    });
  }

  function morningHTML(rec){
    const rows=rec.data.rows||[];

    return `<ul class="pick checks morning">${rows.map((r,i)=>{ const made=r.noteId && store.cases[r.noteId];

      return `<li><label><input type="checkbox" data-mi="${i}" ${made?'':'checked'}><span><strong>${h(r.patient||'Patient '+(i+1))}</strong><span>${made?'Note already created this morning. ':''}${bits.length?'Will add '+bits.join(', ')+'.':'Nothing recorded overnight.'}</span></span></label></li>`; }).join('')}</ul>

  function createMorningNotes(){
    const rec=R(), ho=rec.data, now=new Date(), made=[];
    const picks = Array.from(document.querySelectorAll('[data-mi]:checked')).map(cb=>+cb.dataset.mi);
    if(!picks.length){ toast('Tick at least one patient.'); return; }
    const redo = picks.filter(i=>ho.rows[i].noteId && store.cases[ho.rows[i].noteId]);
    if(redo.length && !confirm(redo.length+' of these already have a note from this handover. Create another?')) return;
    picks.forEach(i=>{
      const row=ho.rows[i];
      let src = row.key && store.cases[row.key];
      const g = patientGroups().find(g=>samePt(g,row)); if(g && g.latest) src = g.latest;
      const built = progressFromHandover(row, ho, src?src.data:null, src?src.kind:null, now, store.last.interviewer);
      built.data.author = built.data.author || store.last.interviewer || '';
      const id=newId();
      store.cases[id] = {id, kind:'pn', created:Date.now()+made.length, updated:Date.now(), source:'on-call handover'+(str(ho.hoDate)?' ('+str(ho.hoDate)+')':'')+(src?' and '+lc(recKind(src)):''), prev:built.prev, lastMSE:built.lastMSE, data:built.data};
      row.noteId=id; made.push(store.cases[id]);
    });
    touch(); persist(); renderSection();
    sheet(`<h3>${made.length} progress note${made.length===1?'':'s'} created</h3>
      <p>Each note has the identifiers, diagnosis, medications, and plan carried forward, plus the handover items. Open one to finish it.</p>
      <ul class="pick">${made.map(r=>`<li><button data-go="${r.id}"><strong>${h(recTitle(r))}</strong><span>${h(recKind(r))}</span></button></li>`).join('')}</ul>
      <div class="tools"><button class="btn" data-close>Stay on handover</button></div>`,
      (s,close)=>{ s.querySelector('[data-close]').onclick=close; s.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ close(); openRec(b.dataset.go); }); });
  }

  function previewHTML(d){
    const P=certParts(d), e=t=>h(t).replace(/\n/g,'<br>');
    const sig = s => s ? `<div class="sig"><div class="line"></div><strong>${h(s.name)}</strong><span>${h(s.title)}</span><span>PRC Lic. No. ${s.lic?h(s.lic):'<em>missing</em>'}</span></div>` : '<div class="sig empty"></div>';

  /* ----- editor ----- */
  function openRec(id){ cur=id; secIdx=0; renderEditor(); }
  function renderEditor(){
    const rec=R(); document.title=recTitle(rec)+' | PsychInterview';
    document.body.innerHTML = `
      <header class="bar">
        <button class="btn quiet" id="back" aria-label="All records">‹ Records</button>
        <button class="btn only-narrow" id="menu" aria-expanded="false" aria-controls="rail">Sections</button>

        ${rec.kind==='case'?'<button class="btn" id="pres" aria-label="Create presentation slides">Slides</button>':''}

    $('#export').onclick = exportDocx;
    if($('#pres')) $('#pres').onclick = presentationSheet;
    renderRail(); renderSection();
  }
  function renderRail(){
    const d=D(); let g=null, html='';
    SECS().forEach((s,i)=>{
      if(s.group && s.group!==g) html+=`<div class="grp">${h(s.num.replace(/[A-Z]$/,''))} &nbsp;${h(s.group)}</div>`;
      g=s.group||null;
      const on=sectionStarted(s,d);
      html+=`<button class="${s.group?'sub ':''}${s.risk?'risk ':''}${i===secIdx?'cur':''}" data-sec="${i}" ${i===secIdx?'aria-current="step"':''}><span class="n">${h(s.num)}</span><span>${h(s.title)}</span>${s.preview||s.morning?'<span></span>':`<span class="dot ${on?'on':''}" aria-label="${on?'started':'not started'}"></span>`}</button>`;
    });
    const r=$('#rail'); r.innerHTML=html;
    r.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ secIdx=+b.dataset.sec; r.classList.remove('open'); $('#menu').setAttribute('aria-expanded','false'); renderRail(); renderSection(); window.scrollTo(0,0); });
  }
  function updateRailDots(){

  }

  /* ----- editors for the case presentation format ----- */
  const sameNotes = rec => Object.values(store.cases).filter(c=>c.kind==='pn' && samePt(c.data, rec.data)).map(c=>c.data);
  const famOpt = (list, v) => list.map(o=>`<option value="${h(o)}"${o===v?' selected':''}>${h(o||'Choose…')}</option>`).join('');
  function familyHTML(f, d){
    const list = Array.isArray(d.family) ? d.family : (d.family = []);

          <div class="famrow">
            <label class="w2">Name<input type="text" data-fam="${i}" data-fk="name" value="${h(m.name)}" autocomplete="off"></label>

          </div>
          <div class="famrow">
            <div class="seg sm" role="group" aria-label="Living or deceased">${['Living','Deceased'].map(o=>`<button data-famset="${i}" data-fk="status" data-o="${o}" aria-pressed="${(m.status||'Living')===o}">${o}</button>`).join('')}</div>
            <button class="chip" data-famtog="${i}" data-fk="psych" aria-pressed="${!!m.psych}">Psychiatric condition</button>

          </div>
          <div class="famrow">
            <label class="w2">Condition / illness<input type="text" data-fam="${i}" data-fk="cond" value="${h(m.cond)}" placeholder="For example: MDD, alcohol use, hypertension" autocomplete="off"></label>
          </div>
          <label class="full">Description<textarea data-fam="${i}" data-fk="desc" placeholder="For example: a 62-year-old tricycle driver who drinks daily; distant from the patient.">${h(m.desc)}</textarea></label>
          <div class="tbl-actions"><button class="btn quiet danger" data-famdel="${i}">Remove</button></div>

  function genoBox(d){
    const G = genogramLayout(d);

  }
  function labsHTML(f, d){
    return `<div class="field"><span class="lab" id="l-${f.id}">${h(f.label)}</span><span class="hint">Type the results you have; empty tests are left out. Ranges can be changed.</span>
      <div class="labs">${LAB_PANELS.map(p=>{

        const rows = labRows(d,p);
        return `<section class="labcard"><h4>${h(p.name)}</h4><div class="labgrid"><span>Test</span><span>Result</span><span>Normal range</span><span></span>
          ${rows.map((r,i)=>{ const fl=labFlag(r[1],r[2]);
            return `<input type="text" data-lab="${p.id}" data-lr="${i}" data-lc="0" value="${h(r[0])}" aria-label="Test" autocomplete="off"><input type="text" data-lab="${p.id}" data-lr="${i}" data-lc="1" value="${h(r[1])}" aria-label="${h((r[0]||'Test')+' result')}" autocomplete="off"><input type="text" data-lab="${p.id}" data-lr="${i}" data-lc="2" value="${h(r[2])}" aria-label="${h((r[0]||'Test')+' normal range')}" autocomplete="off"><span class="flag ${fl?'on':''}" id="lf-${p.id}-${i}">${fl==='H'?'High':fl==='L'?'Low':''}</span>`; }).join('')}
          </div><div class="tbl-actions"><button class="btn quiet" data-labadd="${p.id}">Add test</button></div></section>`; }).join('')}</div></div>`;

  function gridHTML(f, d){
    const v = d[f.id] || {};
    return `<div class="field"><span class="lab" id="l-${f.id}">${h(f.label)}</span><div class="tbl"><table class="gridtbl"><thead><tr><th></th>${f.cols.map(c=>`<th scope="col">${h(c)}</th>`).join('')}</tr></thead><tbody>
      ${f.rows.map(r=>`<tr><th scope="row">${h(r)}</th>${f.cols.map(c=>`<td><textarea data-grid="${f.id}" data-gk="${h(r+'|'+c)}" aria-label="${h(r+', '+c)}">${h(v[r+'|'+c])}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  }

  function fieldHTML(f, d, rec){
    if(f.legacy && !isFilled(f,d)) return '';
    const prevV = f.prev && rec.prev && rec.prev[f.prev];
    const lab = `<span class="lab" id="l-${f.id}">${h(f.label)}</span>${f.hint?`<span class="hint">${h(f.hint)}</span>`:''}${prevV?`<span class="hint prev">Last documented: <strong>${h(prevV)}</strong></span>`:''}`;
    const v = d[f.id];
    switch(f.t){
      case 'sub': return `<h3 class="subhead ${f.small?'small':''}" id="l-${f.id}">${h(f.label)}</h3>`;
      case 'text': return `<div class="field">${lab}<input type="text" data-f="${f.id}" aria-labelledby="l-${f.id}" value="${h(v)}" autocomplete="off"></div>`;
      case 'area': return `<div class="field">${lab}<textarea class="${f.big?'big':''}" data-f="${f.id}" aria-labelledby="l-${f.id}">${h(v)}</textarea>${f.tool==='course' && rec.courseNotes && rec.courseNotes.length?`<div class="tools"><button class="btn" id="draftCourse">Draft from ${rec.courseNotes.length===1?'1 progress note':rec.courseNotes.length+' progress notes'}</button></div>`:''}${f.tool==='lastMSE' && str(rec.lastMSE)?`<div class="tools"><button class="btn" id="insLastMSE">Insert last progress-note MSE</button></div>`:''}${f.tool==='caseCourse'?(n=>n?`<div class="tools"><button class="btn" id="draftCaseCourse">Draft from ${n===1?'1 progress note':n+' progress notes'}</button></div>`:'<span class="hint">Progress notes for this patient on this iPad can be drafted into this box.</span>')(sameNotes(rec).length):''}${f.mseTools?`<div class="tools"><button class="btn" id="draft">${h(typeof f.mseTools==='string'?f.mseTools:'Draft from 18A–18F')}</button><button class="btn" id="copy">Copy paragraph</button></div>`:''}</div>`;
      case 'checks': { const sel=v||[]; return `<div class="field" role="group" aria-labelledby="l-${f.id}">${lab}<div class="chips">${f.o.map(o=>`<button class="chip" data-chk="${f.id}" data-o="${h(o)}" aria-pressed="${sel.includes(o)}">${h(o)}</button>`).join('')}</div>${f.score?`<div class="score" id="sc-${f.id}">${sel.length}/${f.o.length} positive</div>`:''}</div>`; }
      case 'radio': return `<div class="field" role="group" aria-labelledby="l-${f.id}">${lab}<div class="seg">${f.o.map(o=>`<button data-rad="${f.id}" data-o="${h(o)}" aria-pressed="${v===o}">${h(o)}</button>`).join('')}</div>${f.detail?`<div class="detail"><input type="text" data-f="${f.id}__d" placeholder="${h(f.detail)}" aria-label="${h(f.label+': '+f.detail)}" value="${h(d[f.id+'__d'])}"></div>`:''}</div>`;
      case 'radios': { const o=v||{}; return `<div class="field">${lab}<div class="radios">${f.p.map(([k,opts])=>`<div class="row" role="group" aria-label="${h(k)}"><span>${h(k)}</span><div class="seg">${opts.map(x=>`<button data-rads="${f.id}" data-k="${h(k)}" data-o="${h(x)}" aria-pressed="${o[k]===x}">${h(x)}</button>`).join('')}</div></div>`).join('')}</div></div>`; }
      case 'parts': { const o=v||{}; return `<div class="field">${lab}<div class="grid ${f.long?'long':''} ${f.inline?'inline':''}">${f.p.map(k=>`<label>${h(k)}${f.long?`<textarea data-f="${f.id}" data-k="${h(k)}">${h(o[k])}</textarea>`:`<input type="text" data-f="${f.id}" data-k="${h(k)}" value="${h(o[k])}" autocomplete="off">`}</label>`).join('')}</div></div>`; }
      case 'patients': return patientsHTML(d);
      case 'family': return familyHTML(f, d);
      case 'labs': return labsHTML(f, d);
      case 'grid': return gridHTML(f, d);
      case 'lines': {
        const arr = Array.isArray(v) ? v : (f.defaults ? REFERENCES_DEFAULT.slice() : []); while(arr.length<(f.n||3)) arr.push(''); d[f.id]=arr;
        return `<div class="field">${lab}<div class="lines">${arr.map((x,i)=>`<div class="ln"><span>${i+1}.</span>${f.defaults?`<textarea class="lnarea" data-f="${f.id}" data-li="${i}" aria-label="${h(f.label+', line '+(i+1))}">${h(x)}</textarea>`:`<input type="text" data-f="${f.id}" data-li="${i}" value="${h(x)}" aria-label="${h(f.label+', line '+(i+1))}" autocomplete="off">`}</div>`).join('')}</div><div class="tbl-actions"><button class="btn quiet" data-addline="${f.id}">Add line</button></div></div>`;
      }
      case 'table': {
        let rows = (v && v.length) ? v : [];
        while(rows.length<f.rows) rows.push(f.c.map(()=>''));
        d[f.id]=rows;
        return `<div class="field">${lab}<div class="tbl"><table><thead><tr>${f.c.map(c=>`<th scope="col">${h(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr>${f.c.map((c,ci)=>`<td><textarea data-f="${f.id}" data-r="${ri}" data-c="${ci}" aria-label="${h(c+', row '+(ri+1))}">${h(r[ci])}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tbl-actions"><button class="btn quiet" data-addrow="${f.id}">Add row</button>${rows.length>1?`<button class="btn quiet" data-delrow="${f.id}">Remove last row</button>`:''}</div></div>`;
      }
    }
    return '';
  }

  function renderSection(){
    const rec=R(), secs=SECS(), s=secs[secIdx], d=D();

    const hasLast = s.copyMSE && rec.lastMSE && Object.keys(rec.lastMSE).length;
    $('#main').innerHTML = `
      <div class="sec-head ${s.risk?'risk':''}">
        ${s.group?`<p class="kicker">${h(s.num.replace(/[A-Z]$/,''))}. ${h(s.group)}</p>`:''}

      ${(s.id==='pnInfo'||s.id==='dcInfo') && rec.source?`<p class="source">Started from ${h(rec.source)}.</p>`:''}

      ${rec.kind==='sp'?refsHTML(s,rec):''}
      ${s.preview?(rec.kind==='ca'?abstractPreviewHTML(d):rec.kind==='ho'?handoverPreviewHTML(d):rec.kind==='sp'?safetyPreviewHTML(d):previewHTML(d)):''}

      <div class="pager">
        ${prev?`<button class="btn" id="prev">‹ ${h(prev.num)} ${h(prev.title)}</button>`:'<span></span>'}
        ${next?`<button class="btn primary" id="next">${h(next.num)} ${h(next.title)} ›</button>`:`<span class="tools" style="margin:0">${rec.kind==='case'?'<button class="btn" id="donePres">Create slides</button>':''}<button class="btn primary" id="done">Export Word file</button></span>`}
      </div>`;
    const go = i => { secIdx=i; renderRail(); renderSection(); window.scrollTo(0,0); };
    if(prev) $('#prev').onclick=()=>go(secIdx-1);
    if(next) $('#next').onclick=()=>go(secIdx+1); else { $('#done').onclick=exportDocx; if($('#donePres')) $('#donePres').onclick=presentationSheet; }
    const cm=$('#copymse'); if(cm) cm.onclick=()=>{
      const L=rec.lastMSE, touched=Object.keys(L).some(k=>{ const x=d[k]; return Array.isArray(x)?x.length:!!x; });
      if(touched && !confirm('Replace your current 3A–3C selections with the last MSE?')) return;
      Object.entries(L).forEach(([k,v])=>{ d[k]=Array.isArray(v)?v.slice():v; });
      touch(); renderSection(); toast('Copied. Review each finding; SI, HI, and self-harm were left blank.');
    };
    const ap=$('#addpt'); if(ap) ap.onclick=addPatientSheet;
    const mk=$('#mknotes'); if(mk) mk.onclick=createMorningNotes;
    const dc=$('#draftCourse'); if(dc) dc.onclick=()=>{
      const t=draftCourse(rec.courseNotes); if(!t){ toast('Those progress notes have no assessment or plan changes to draft from.'); return; }

  /* ----- the files themselves, so Share and Google Drive make the same thing ----- */
  const DOCX_TYPE = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', PPTX_TYPE = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
  const today = () => new Date().toISOString().slice(0,10);
  const fileBase = (d, kind) => (str(d.patient)||str(d.patientName)||(kind==='ho'?(str(d.unit)||'Unit'):'')||'Patient').replace(/[^\w\- ]+/g,' ').trim().replace(/\s+/g,'_').slice(0,50) || 'Patient';
  async function docxFor(rec, layout){

  async function slidesFor(rec, P){
    const T = CaseSlides.TEMPLATES, t = T.find(x=>x.id===P.tpl) || T[0];
    const out = await CaseSlides.generate(rec.data, { template: await templateBytes(t), templateCfg:t, title:P.title, presenter:P.presenter, patientAs:P.mode, dividers:P.dividers, notes:P.notes, include:P.include });
    const base = String(out.label).replace(/\./g,'').replace(/[^\w\- ]+/g,' ').trim().replace(/\s+/g,'_').slice(0,40) || 'Patient';
